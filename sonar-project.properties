# SonarCloud Configuration
sonar.organization=oleg-ivanov
sonar.projectKey=greydragon888_real-router

# Project Information
sonar.projectName=real-router
# sonar.projectVersion is set dynamically in CI from packages/core/package.json
# (the `Get version from core package` step in .github/workflows/ci.yml) and
# passed as a -D arg, which overrides this file. Omitted here so a stale literal
# can't mislead local `pnpm sonar:local` runs.

# Source Code, tests, and coverage report paths are generated dynamically in CI
# from the filesystem (the `Compute Sonar scope` step in .github/workflows/ci.yml)
# and passed as scanner `-D` args, which override this file. They were previously
# hardcoded here and drifted out of sync with the package set. Do NOT
# re-add static sonar.sources / sonar.tests / sonar.javascript.lcov.reportPaths.

# Coverage exclusions — files whose coverage Sonar must not score.
# `**/types/**` mirrors the same exclusion in vitest coverage (vitest-excluded
# files have no lcov records → Sonar would score them 0%). The trailing
# packages/*/src/** entries exclude code that legitimately lacks a clean lcov,
# so the new-code-coverage gate can't red on it:
#   - angular/solid/svelte: compiler-phantom code → lowered vitest thresholds
#     (coverage stays enforced by vitest + visible in Codecov)
# `shared/**` is NOT excluded: each shared dir is measured at 100% by an
# owner package (shared/browser-env → browser-plugin, shared/dom-utils → react,
# shared/ssr → ssr-data-plugin) via coverage.allowExternal + a shared/<dir>
# include in the owner's vitest.config.mts. The owners' lcov SF paths are
# normalized to repo-root-relative shared/<dir>/… by the CI "Fix coverage paths"
# step, so Sonar scores shared sources at their real location.
# scripts/check-coverage-scope.mjs asserts these stay in sync with the package set.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/*.config.ts,**/*.config.mts,**/*.config.js,**/index.ts,**/constants.ts,**/types.ts,**/types/**,**/enums.ts,**/interfaces.ts,**/contexts.ts,packages/angular/src/**,packages/solid/src/**,packages/svelte/src/**

# Exclusions (analysis scope - exclude non-production code)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/.vitest/**,**/*.config.ts,**/*.config.mts,**/*.config.js,**/benchmarks/**,**/scripts/**,.env,**/*.bench.ts

# Test exclusions — exclude ALL test code from analysis. `sonar.tests` is set in
# CI to `packages/*/tests` (the `Compute Sonar scope` step), so those files land
# in Sonar's test source set and get test-specific rules (e.g. S2699 "assertion
# always succeeds/fails", S5863) raised as Code Smells. Tests are not production
# code — exclude the whole test set so Sonar never analyses or scores it. Coverage
# is unaffected (it comes from the lcov reportPaths, not the test source set; tests
# are already coverage-excluded above, and Sonar computes no duplication for a
# test file).
sonar.test.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stress.ts,**/*.properties.ts,**/*.bench.ts,**/benchmarks/**

# Duplications. Each entry of the `ignore` of .jscpd.json, the configuration of
# the repository's own duplication gate, is translated into a pattern that
# leaves out the same files here; the reason for each entry is beside it there.
# >>> sync-config: cpd-exclusions — the ignore of .jscpd.json, translated
sonar.cpd.exclusions=**/packages/preact/src/**,**/packages/hash-plugin/src/**,**/packages/*/**/src/dom-utils/**,**/packages/*/**/src/browser-env/**,**/packages/*/**/src/shared-ssr/**,**/packages/*/**/src/**/**.react-server.ts,**/packages/react/src/legacy.ts,**/packages/react/src/legacy.ssr.ts,**/packages/react/src/ink.ts,**/packages/validation-plugin/src/type-guards/**,**/shared/browser-env/state-guard.ts,**/**.d.ts
# <<< sync-config: cpd-exclusions

# TypeScript — the program the JS/TS sensor builds, NOT the repository's own
# type-check config. The root tsconfig.json declares no `include`, so TypeScript
# takes every .ts/.tsx under the root: every runnable example application, the
# benchmark harness, scripts/ and every test file. Measured on a CI run,
# that is `Analyzing 481 file(s) from tsconfig (4602 total files in program)` —
# the sensor carries ten files for every one it analyses, and the segment from
# `Resolving provided TSConfig files` to `Analyzing` was 12.0 s of its 16.7 s.
# tsconfig.sonar.json seeds the program with exactly the analysed set; imports
# still pull in whatever those files need.
#
# It excludes the three symlink aliases under packages/*/src because TypeScript
# keeps ONE path per real file and the alias wins: with them included the whole
# of shared/ vanishes from the program and Sonar falls back to `merged compiler
# options` for it. Excluding them puts all 32 shared files in under their real
# paths, which is where sonar.sources and the normalized lcov look for them —
# the root config manages 7 of the 32. The aliases stay in the program anyway,
# pulled in by the imports of the packages that use them.
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Encoding
sonar.sourceEncoding=UTF-8

# Code Quality
sonar.qualitygate.wait=true
