[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "glib 0.18.5 VariantStrIter unsoundness (RUSTSEC-2024-0429). Transitive via Tauri 2.x → GTK/WebKit on Linux only, pulled by examples/desktop/tauri/*/src-tauri/. Not in any published @real-router/* package. Tauri 2.x pins glib < 0.20, so the fix can only land via an upstream Tauri bump that re-bases its GTK stack."

# node-forge has no fixed release: every version through 1.4.0, the latest, is
# affected. Its one dependent here is `@sonar/scan`, the root devDependency that
# `pnpm sonar:local` runs on a developer's machine — no workflow runs it and no
# published package depends on it. The advisory is about RSA PKCS#1 v1.5
# signature verification, and @sonar/scan 5.0.1 calls node-forge only to read a
# PKCS#12 truststore into PEM certificates (`extractTruststoreCerts` in its
# `src/request.js`, reached only when `sonar.scanner.truststorePath` is set),
# which verifies no signature. Drop it when node-forge ships a fix or
# @sonar/scan stops depending on it — ask api.osv.dev per version.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"  # node-forge RSA PKCS#1 v1.5 signature verification
reason = "No fixed node-forge release (<= 1.4.0, the latest). Only dependent: root devDependency @sonar/scan 5.0.1, run locally by `pnpm sonar:local`; it uses node-forge solely to read a PKCS#12 truststore, a path that verifies no signature."

# braces has no fixed release: every version through 3.0.3, the latest, is
# affected. It arrives only through micromatch 4.0.8 under the root
# devDependency `danger`, and danger calls micromatch only to expand the
# patterns a dangerfile passes to `danger.git.fileMatch` and
# `danger.git.linesOfCode` — dangerfile.ts calls neither. No published package
# depends on it. Drop it when braces ships a fix — ask api.osv.dev per version.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"  # braces stack-exhaustion DoS through deeply nested patterns
reason = "No fixed braces release (<= 3.0.3, the latest). Only path: root devDependency danger 14.0.7 -> micromatch 4.0.8, which expands only the patterns a dangerfile passes to fileMatch and linesOfCode; dangerfile.ts calls neither. Not in any published @real-router/* package."

# http-cache-semantics has no fixed release: every version through 4.2.0, the
# latest, is affected. It arrives only in the examples lockfile, through
# electron-builder (a devDependency of the three Electron examples) ->
# @electron/get -> got 11 -> cacheable-request. got builds that HTTP cache only
# when it is given a `cache` option; electron-builder gives it none, and the
# examples configure no download options. The examples are never published.
# Drop it when http-cache-semantics ships a fix — ask api.osv.dev per version.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"  # http-cache-semantics max-stale cross-user disclosure
reason = "No fixed http-cache-semantics release (<= 4.2.0, the latest). Only path: electron-builder 26.15.3 (devDependency of examples/desktop/electron/*) -> @electron/get 3.1.0 -> got 11.8.6 -> cacheable-request 7.0.4; got builds that HTTP cache only when given a `cache` option, which neither electron-builder nor the examples pass. examples/ is never published."

# seroval's fix, 1.6.3, is outside the range solid-js 1.9.15 pins (`~1.5.4`,
# with seroval-plugins), and solid-js has no newer 1.9 release. seroval is in
# the three lockfiles only through solid-js: in the root for @real-router/solid's
# tests and the benchmarks, in examples/ for the Solid examples, in
# cross-router-bench for its Solid app — none published, and @real-router/solid
# takes solid-js as a peer. The advisory is in deserializing seroval JSON
# (`fromJSON`, `fromCrossJSON`); solid-js imports only seroval's serializer, in
# its server build, and no code here imports seroval. Drop it when solid-js takes
# a seroval past 1.6.2 — ask api.osv.dev per version.

[[IgnoredVulns]]
id = "GHSA-jp82-f5mq-hwhp"  # seroval memory exhaustion through a TypedArray length in its JSON
reason = "Fixed in seroval 1.6.3, outside solid-js 1.9.15's ~1.5.4; solid-js has no newer 1.9 release. Only via solid-js: root devDependencies (@real-router/solid tests, benchmarks), the Solid examples, cross-router-bench; none published, and @real-router/solid takes solid-js as a peer. The flaw is in fromJSON/fromCrossJSON; solid-js imports only seroval's serializer, and nothing here imports seroval."

# A second seroval advisory, also in `fromJSON` — a deserialized fulfilled
