# holds for it word for word: solid-js imports only seroval's serializer, and
# nothing here imports seroval. Drop it with the entry above.

[[IgnoredVulns]]
id = "GHSA-p6vx-979v-rg4c"  # seroval fromJSON thenable assimilation invokes plugin-produced callables
reason = "Fixed in seroval 1.6.2, outside solid-js 1.9.15's ~1.5.4; solid-js has no newer 1.9 release. The same paths as GHSA-jp82-f5mq-hwhp: solid-js in root devDependencies, the Solid examples and cross-router-bench; none published. The flaw is in fromJSON; solid-js imports only seroval's serializer, and nothing here imports seroval."

# sprintf-js has no fixed release: every version through 1.1.3, the latest, is
# affected. It arrives only in the examples lockfile, through electron-builder
# (a devDependency of the three Electron examples) -> @electron/get ->
# global-agent 3.0.0 -> roarr 2.15.4. The advisory needs a format string an
# attacker controls; roarr formats the message its caller passes, and
# global-agent passes only its own literals, none with a precision specifier.
# The examples are never published. Drop it when sprintf-js ships a fix or the
# chain stops pulling it — ask api.osv.dev per version.

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"  # sprintf-js DoS through unbounded precision specifiers
reason = "No fixed sprintf-js release (<= 1.1.3, the latest). Only path: electron-builder 26.15.3 (devDependency of examples/desktop/electron/*) -> @electron/get 3.1.0 -> global-agent 3.0.0 -> roarr 2.15.4, whose format strings are global-agent's own literals, none with a precision specifier. examples/ is never published."

# NOTE (2026-09-10): ten entries stood here — RUSTSEC-2024-0411 through -0420,
# the gtk-rs unmaintained-crate advisories (gdk, gtk, atk, their -sys crates and
# gtk3-macros). They are gone, and the way they left is worth one paragraph
# because it is NOT the way their own removal condition predicted.
#
# ⚠ **They did not become stale by the dependency moving.** That block said to
# drop them "when Tauri 2.x ships a new GTK stack", and Tauri has not: all ten
# crates are still in both `examples/desktop/tauri/*/src-tauri/Cargo.lock`.
# What changed is upstream — RustSec WITHDREW all ten on 2026-08-14, asked per
# id at api.osv.dev rather than read off the scanner's column. A removal
# condition written against the dependency graph cannot see that, so following
# it literally would have kept ten dead entries for as long as Tauri keeps GTK.
#
# The signal that something had gone stale came from osv-scanner itself, which
# prints `has unused ignores:` and lists them. It does not fail the run, so it
# is easy to scroll past. Positive control at the time: the OTHER Tauri-chain
# ignores below (RUSTSEC-2024-0370, the unic-* set, quick-xml) were NOT listed
# as unused, which is what proved the scanner was still reading Cargo.lock and
# the ten were genuinely unmatched.

