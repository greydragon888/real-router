# quick-xml DoS advisories — real CVEs with CVSS scores (unlike the
# unmaintained-crate entries above). RUSTSEC-only (no GHSA alias), so NOT
# mirrored in codeql.yml: GitHub Dependency Review only flags GHSA advisories,
# and quick-xml is unchanged by any PR diff anyway. Drop these when an upstream
# Tauri/plist bump moves quick-xml to >= 0.41.0.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"  # quick-xml quadratic duplicate-attribute DoS
reason = "quick-xml < 0.41.0 uses an O(N^2) duplicate-attribute check → CPU-exhaustion DoS. Transitive via Tauri 2.x (tauri 2.11.2 -> plist 1.9.0 -> quick-xml ^0.39.2), examples/desktop/tauri/* only — not in any published @real-router/* package. The DoS needs attacker-controlled XML; the examples parse only trusted app config through plist, so the vector is unreachable. Bump-blocked: plist 1.9.0 pins quick-xml ^0.39.2, so 0.41.0 can only arrive via an upstream Tauri/plist bump."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"  # quick-xml unbounded namespace-declaration memory DoS
reason = "quick-xml < 0.41.0 NsReader allocates unbounded memory for namespace declarations → memory-exhaustion DoS. Same chain and rationale as RUSTSEC-2026-0194 (Tauri 2.x -> plist -> quick-xml ^0.39.2, desktop examples only, unreachable vector, bump-blocked by plist ^0.39.2)."

# NOTE (2026-08-03): the GHSA-mh99-v99m-4gvg entry that used to sit here is GONE, and the way it
# left is the point. It was allowlisted because the advisory had a fix on the @5 line only, and it
# carried an explicit removal condition plus a warning not to read a version bump as a fix (1.1.17
# and 2.1.3 had both shipped while still affected). Re-querying api.osv.dev per version on 08-03
# answered CLEAN for both, so the condition was genuinely met: the pins in pnpm-workspace.yaml moved
# to 1.1.17 / 2.1.3, the mirrored `allow-ghsas:` line in codeql.yml lost the id too, and the
# Dependabot alert (#593, the third channel that neither allowlist touches) closes on the lockfile.
# Ask OSV per version before re-adding anything here.


# image-size DoS pair (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr — both High,
# published 2026-08-07). Allowlisted rather than bumped because there is NO fixed
# release: OSV answers `last_affected: 2.0.2` for both, i.e. every version ever
# published is affected, and `less` pins `image-size: ~0.5.0` in its
# optionalDependencies anyway. Asked api.osv.dev per version before writing this,
# per the note above — the scanner's empty "FIXED VERSION" column was not taken
# on trust.
#
# Reachability is not merely "trusted input" — the code never runs. `less` is a
# transitive OPTIONAL peer of the build toolchain (vite, @angular/build,
# ng-packagr); nobody declares it directly, and the repository contains ZERO
# `.less` files, so the LESS compiler never executes and never loads its
# `image-size()` builtin. Neither advisory is in any published @real-router/*
# package. Both need an attacker-supplied image buffer reaching a JXL/HEIF/ICNS
# parser — there is no such input anywhere in this repo.
#
# Drop BOTH entries when image-size ships a fixed release and the toolchain pulls
# it, or when `less` leaves the tree. Re-query OSV per version before assuming a
# bump fixed it.

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
reason = "image-size <= 2.0.2: infinite loop in the JXL/HEIF parsers on a zero-valued size field → Node event-loop DoS. No fixed release exists (OSV last_affected 2.0.2). Transitive optional peer via less (vite / @angular/build / ng-packagr), build-time only, never in a published @real-router/* package — and unreachable: the repo has no .less files, so less never runs."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
reason = "image-size <= 2.0.2: infinite loop in the ICNS parser on a zero-valued entry length → Node event-loop DoS. Same package, chain and rationale as GHSA-5p2g-fcmc-qvqq (no fixed release, less-only transitive, build-time, no .less files in the repo)."
