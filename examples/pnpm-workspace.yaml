# The examples workspace: its own lockfile, overrides and settings. pnpm reads
# settings per workspace, so none of the repository root's reach this one.
#
# @real-router/* resolve from npm. `pnpm -w run use-checkout` runs
# scripts/checkout-tarballs.mjs, which installs this checkout's packages in
# their place through .pnpmfile.mjs and restores the committed lockfile.
packages:
  - "web/*"
  - "web/*/*"
  - "web/*/*/*" # subgroups (e.g. web/react/animation-examples/)
  - "desktop/*/*"
  - "console/*"
peerDependencyRules:
  allowedVersions:
    typescript: '6'
overrides:
  '@types/node': $@types/node
  # Bound to <8 for the SOLID CHAIN ONLY: an open upper bound lets `pnpm dedupe`
  # (the pre-commit hook auto-dedupes) pull @babel/core 8 into a chain that cannot
  # run it. Lift when vite-plugin-solid supports babel 8. Why the entry is scoped to
  # the consumer rather than global is recorded in the root pnpm-workspace.yaml.
  'vite-plugin-solid>@babel/core': '>=7.29.6 <8'
  # Floor raised for GHSA-4mjr-xmp4-gh2g + GHSA-x5fp-wj9c-mxmx (both Medium, 6.16.0).
  # Parents are express and body-parser — the SSR examples' servers, never a
  # published @real-router/* package.
  qs: '>=6.16.0'
  # Floor raised for GHSA-mw96-cpmx-2vgc (arbitrary file write via path traversal,
  # High, fixed in 4.59.0). Unscoped because no example declares rollup itself;
  # the root pnpm-workspace.yaml says, under its `vite` entry, what an override
  # does to a direct dependency.
  rollup: '>=4.59.0'
  minimatch@3: ~3.1.4
  minimatch@9: ~9.0.7
  minimatch@10: ~10.2.3
  ajv@6: ~6.14.0
  # At the version @angular-devkit/core pins exactly (8.20.0); every other
  # parent's range admits it.
  ajv@8: ~8.20.0
  http-proxy-agent: 7.0.2
  # undici, split by major: every parent here takes it as a regular dependency,
  # so a floor per line holds — 7.29.1 on @electron/get's 7.x, 6.28.1 on node-gyp's
  # 6.x, each the release that fixes that line's advisories, GHSA-3wwx-pv8p-q78v
  # the latest. No entry for 8: jsdom's `^8.10.2` starts at the release that fixed
  # that line, and a floor could only hold it back (#2605).
  undici@6: '>=6.28.1 <7'
  undici@7: '>=7.29.1 <8'
  # At the version @angular/build pins exactly; ng-packagr's `^5.0.0` admits it.
  piscina: '>=5.3.2 <6.0.0'
  path-to-regexp: '>=8.4.0'
  # ReDoS in brace-expansion (GHSA-3jxr-9vmj-r5cp, High). All three major lines are in the tree
  # via assorted dev/tooling deps — pin each to its patched release. EXACT (not '>=') because the
  # '@N' selector value can't be an open range without risking a cross-major jump (a '>=1.1.16' on
  # the @1-selected dep could resolve up to 5.x). Bump each line when its next patch lands.
  #
  # ⚠ A SECOND ReDoS landed on the same package (GHSA-mh99-v99m-4gvg, High, 2026-07) and for a
  # while had a fix on the @5 line only — see the dated note below for how that resolved.
  #
  # ⛔ Collapsing all three onto 5.0.8 is NOT the fix, and this is measured rather than assumed:
  # v1 and v2 both end in `module.exports = expandTop` (the function IS the export), while 5.x's
  # CJS build emits `exports.expand = expand` — a NAMED export with no default. Every consumer of
  # the older lines is `minimatch` doing
  # `require('brace-expansion')` and calling the result, so the override would hand it an object
  # and break glob matching across the tooling — which is why each line is pinned separately
  # rather than collapsed onto @5.
  #
  # GHSA-mh99-v99m-4gvg (ReDoS #2, High) used to have no 1.x/2.x fix, so the surviving @1/@2
  # instances were allowlisted in `scripts/osv-scanner.toml` + `codeql.yml`. That changed on
  # 2026-08-01: OSV now answers CLEAN for 1.1.17 and 2.1.3 (both were still affected when this
  # was last checked on 07-30 — a version bump alone proved nothing, so it was re-queried per
  # version before acting). Both lines are pinned to those releases and BOTH allowlist entries
  # are gone, exactly as their own removal condition prescribed.
  #
  # 2026-08-04: a THIRD ReDoS (GHSA-rgw5-rvv9-x895, High) landed on all three lines at once and
  # invalidated yesterday's pins — 1.1.17, 2.1.3 and 5.0.8 are each affected. Unlike ReDoS #2 this
  # one shipped a fix per line on day one (1.1.18 / 2.1.4 / 5.0.9), so all three pins move together
  # and no allowlist is needed. The split-by-major structure above is what made that a three-line
  # edit; keep it.
  #
  # 2026-09-30: three more (GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, High; GHSA-q2hr-2g5m-vwhr,
  # Medium) affect 1.1.18, 2.1.4 and 5.0.9. The last fix on each line is 1.1.21 / 2.1.7 / 5.0.12,
  # and api.osv.dev answers clean for each of those versions, queried one by one.
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  # body-parser < 2.3.0 (GHSA-v422-hmwv-36x6, Low) — example-only (express@5), not shipped. Drop
  # when express pulls >=2.3.0.
  body-parser: '>=2.3.0'
  picomatch@2: 2.3.2
  # At the version @angular-devkit/core and @angular/build pin exactly (4.0.5);
  # every other parent's range admits it.
  picomatch@4: 4.0.5
  yaml@1: 1.10.3
  # Collapses every 2.x consumer onto one copy (vite, eslint-plugin-sonarjs,
  # eslint-plugin-unicorn today). An override outranks semver, so a value below a
  # consumer's declared range downgrades it silently — the root pnpm-workspace.yaml
  # records the release-path incident. Raise this line with the highest declared
  # range, never below.
  yaml@2: 2.9.0
  # Floor at 5.9.2 for GHSA-9rgm-9g3h-6x36 (Medium; 5.3) — denial of service via
  # malformed input. Transitive via `svelte`, which declares `^5.8.1`, so the floor
  # holds; `svelte` is a peer of `@real-router/svelte` and is never bundled into it,
  # which leaves the examples' builds and this audit gate as the exposure.
  devalue: '>=5.9.2'
  esbuild: '>=0.28.1'
  # @angular/build depends on an exact vite of its own; this collapses that
  # edge onto the exact vite the example manifests declare, so the tree holds
  # one vite. Scoped to that edge rather than global, for the reason the root
  # pnpm-workspace.yaml gives under its `vite` entry.
  '@angular/build>vite': '>=8.2.2 <9'
  # Floor for GHSA-hrr3-gc8f-f4qj (Medium), fixed in 3.1.8. Transitive via `ajv`,
  # which declares `^3.0.1`.
  fast-uri: '>=3.1.8 <4'
  # @xmldom/xmldom < 0.8.15 (GHSA-6gmq-8vp8-gcm6, Medium). Its one parent is `plist`, pulled
  # by electron-builder for the desktop EXAMPLES — not in any published @real-router/* package,
  # and it parses our own Info.plist rather than untrusted input. Same-line patch, so a floor
  # rather than an allowlist entry.
  # Bounded `<0.9` deliberately: on a 0.x line the minor IS the major, and an open floor
  # jumps `plist` onto 0.9 — an unvetted parser change for a bump whose fix is same-line.
  '@xmldom/xmldom': '>=0.8.15 <0.9'
  # postcss < 8.5.23 (GHSA-fxqj-rqcc-2cmp, Medium). Every parent is build- or lint-time:
  # vite, @angular/build, ng-packagr, @vue/compiler-sfc, beasties, postcss-scss /
  # -safe-parser / -load-config, eslint-plugin-svelte, svelte-eslint-parser. Not in any published
  # @real-router/* package. Single 8.x line, patch-level fix, so a floor is enough. It sits at
  # 8.5.26, the highest minimum a parent declares (vite's `^8.5.26`): an override outranks
  # semver, so a lower floor can keep vite on an older release. Drop when the toolchain pulls
  # >=8.5.23 on its own.
  postcss: '>=8.5.26'
  tmp: '>=0.2.6'
  # fflate < 0.8.3: `unzipSync` can loop forever on a malformed ZIP64 archive
  # (GHSA-px8p-9vwx-vf98, 7.5). Its one parent here, `@vitest/ui`, declares
  # `^0.8.2`, a range that admits the affected release; the floor is what excludes
  # it. Test tooling, never in a published @real-router/* package. Bounded `<0.9`
  # for the reason the @xmldom/xmldom entry states: on a 0.x line the minor IS the
  # major. No 0.9 exists today, so the bound costs nothing.
  fflate: '>=0.8.3 <0.9'
  # js-yaml 4.x — GHSA-5p4m-2wfm-xmqj (High, quadratic CPU in `!!omap`, fixed 4.3.1)
  # and GHSA-2883-xcg3-v3hh (High, 7.5, fixed 4.3.2). Every parent is part of
  # electron-builder (app-builder-lib, builder-util, dmg-builder) and parses OUR OWN
  # yaml for the desktop examples, never a published @real-router/* package and never
  # untrusted input — but both fixes are same-line patches, so there is no reason to allowlist.
  # Bounded `<5` deliberately: 5.x is a separate major these consumers don't declare, and an
  # open floor would let dedupe jump the whole tree onto it. Drop when the tooling pulls >=4.3.2.
  js-yaml: '>=4.3.2 <5'
  # joi < 18.2.5 — GHSA-gg4h-3hg2-grpc and GHSA-6w3j-5fw6-r9vr (both Low, 3.7),
  # fixed in 18.2.4 and 18.2.5 respectively, so one floor at 18.2.5 clears both.
  # Its only consumer is `wait-on`, which the example e2e suites use to block on a
  # dev server — dev tooling, never a published @real-router/* package. Unbounded
  # above like the other 18.x floors here: joi is on a stable major.
  joi: '>=18.2.5'
updateNotifier: false
saveExact: true
# ⚠ `ignore` keeps pnpm-lock.yaml ONE YAML document: GitHub's dependency graph
# reads only the first, so under the default Dependabot alerts and Dependency
# Review would see pnpm and nothing else. The root pnpm-workspace.yaml has the
# measurement.
pmOnFail: ignore
# `error`: scripts parse pnpm's stdout as JSON, and pnpm writes `[WARN]` there.
loglevel: error
autoInstallPeers: true
strictPeerDependencies: true
strictDepBuilds: true
scriptShell: bash
minimumReleaseAge: 0
# ⚠ `false`: under the default pnpm 12.4 checks the dependencies before every
# `pnpm run` and installs when node_modules differs from the lockfile — and
# after a tarball install it always differs, since checkout-tarballs.mjs puts
# the committed lockfile back. Measured: `pnpm run build` reinstalled the npm
# @real-router/core and built against it. Install explicitly after a pull.
verifyDepsBeforeRun: false
allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
  electron-winstaller: false
