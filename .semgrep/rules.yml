rules:
  # Mirrors CodeQL `js/incomplete-multi-character-sanitization`, runnable locally
  # on the pre-push diff so the class is caught before it reaches CI. Stripping a
  # multi-character delimiter (`<...>`, `<!--...-->`, etc.) with a single regex
  # `replace`/`replaceAll` to "" is incomplete: nested/overlapping input (e.g.
  # `<<x>script>`) can leave a partial `<script` behind. If the goal is HTML
  # sanitization, use a real sanitizer; if it is delimiter detection (as in
  # route-tree's validateRoutePath), use an explicit scan and never reuse the
  # stripped string as output.
  - id: incomplete-multi-character-sanitization
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Incomplete multi-character sanitization: stripping `<...>`-style content
      with a single regex replace can leave a partial delimiter (e.g. `<script`)
      behind. Use a real sanitizer for HTML, or an explicit scan for delimiter
      detection — and don't reuse the stripped string as output.
    metadata:
      category: security
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
      references:
        - https://codeql.github.com/codeql-query-help/javascript/js-incomplete-multi-character-sanitization/
    patterns:
      - pattern-either:
          - pattern: $S.replace($RE, "")
          - pattern: $S.replaceAll($RE, "")
          - pattern: $S.replace($RE, '')
          - pattern: $S.replaceAll($RE, '')
      - metavariable-regex:
          metavariable: $RE
          regex: ^/.*<.*>.*/[a-z]*$

  # The `__proto__`-write class: copying a caller-derived bag key-by-key with a
  # plain assignment. `__proto__` is the only ACCESSOR among `Object.prototype`'s
  # twelve own members, so for that one key `dst[key] = value` dispatches into
  # its setter instead of creating an entry — an object value swaps the
  # destination's prototype and the key is dropped, a scalar is dropped
  # silently. `constructor` / `toString` and friends are data properties and
  # land correctly, which is what makes the defect so easy to miss in review.
  #
  # Sites of this class have been fixed one at a time — #855 (`assignParam`),
  # #1191 (`claim.write`), #1293 (`#mergeQueryParams`), #1788
  # (`prepareCustomFields`) — and #1792 / #1794 are open. #1041 closed the class
  # on the premise that the one write primitive "lives in one place with zero
  # vulnerable non-adopters"; that clause has been refuted four times.
  #
  # Why here and not in ESLint: #1041's chosen recurrence-preventer was
  # `security/detect-object-injection`, and it is `"off"` in eslint.config.mjs
  # for a good reason — it fires on EVERY `obj[variable]`, including `map[name]`
  # and every legitimate read. This rule expresses the narrow shape ESLint could
  # not: a computed-key WRITE whose key is the loop variable of an iteration over
  # someone else's bag. `check-semgrep.sh` runs diff-aware (`--baseline-commit`
  # against the merge-base), so the ~36 pre-existing sites never block a push —
  # only newly written code does.
  #
  # Discrimination measured before shipping, against the class's own history: it
  # fires on all 8 `getFactories` sites, both `channels/` copy loops, all three
  # #1792 sites, #1794's `omitKeys`, `RouterError`'s two field writes and both
  # plugin copy helpers — and stays silent on #855 / #1191 / #1788's
  # `Object.defineProperty` fixes, on #1788's plain-assignment ELSE branch (the
  # canonical CORRECT shape — a rule that flags the fix is worse than no rule),
  # and on every `Object.create(null)` accumulator.
  #
  # The fix shape is the one all four precedents use: special-case the single
  # key through `Object.defineProperty` with all four flags true, keeping the
  # plain-assignment fast path for every other name (measured on the #1788 site,
  # an unconditional `defineProperty` costs 294.0 ns against 31.7 ns per
  # three-key patch). Building the destination with `Object.create(null)` is the
  # other accepted answer — but only when it never escapes to a consumer, since
  # a null-prototype bag breaks `hasOwnProperty` / `toString` / interpolation on
  # the reader's side.
  # ⚑ The SECOND form of the same class, and a separate rule rather than an
  # alternative inside the one above — deliberately. That rule gates every
  # pattern on `pattern-inside` a loop over another bag, which is what keeps it
  # off `map[name]` noise; `Object.assign` is a whole-record copy and lives
  # OUTSIDE any such loop, so an alternative there matches nothing. Verified on a
  # synthetic file: the loop-gated rule caught `dst[k] = src[k]` and missed the
  # `Object.assign` two lines below it.
  #
  # This is the hole that hid two live sites in the matcher's junction walk
  # (#1852) — the literal above them is safe (`{ [k]: v }` DEFINES) and the
  # commit was not.
  - id: unguarded-object-assign
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `Object.assign` copies with `[[Set]]`, one key at a time, so it carries the
      same hazard as a computed-key write: a key the destination's prototype
      chain answers for is not stored — an accessor throws or diverts the value,
      a non-writable property drops it. Use `copyFields` from
      `@real-router/core/utils` (#1852), or an object SPREAD, which defines.
    metadata:
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      references:
        - https://github.com/greydragon888/real-router/issues/1852
    patterns:
      - pattern: Object.assign($DST, $SRC)
      # The source must be a BAG rather than a literal the author wrote out: an
      # object literal's keys are chosen here and visible here, which is the same
      # carve-out `isAuthoredKey` makes in the authority test.
      - metavariable-regex:
          metavariable: $SRC
          regex: ^[A-Za-z_$][\w$.]*$
      # A prototype-less destination has no inherited setter to hit. Spelled as
      # the two forms this repo actually writes.
      - pattern-not: Object.assign(Object.create(null), ...)
      - pattern-not-inside: |
          $DST = Object.create(null);
          ...
  - id: unguarded-computed-key-write
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Computed-key write while copying a caller-derived bag. `[[Set]]` walks the
      destination's prototype chain first, so a name the chain carries is not
      stored: an accessor with no setter throws, one with a setter diverts the
      value into application code, and a non-writable data property drops it.
      `__proto__` is only the instance that is hazardous in a PRISTINE
      environment — `id` / `tab` / `page` become hazardous the moment an
      application defines them, which is why the `__proto__` special case #855 /
      #1191 / #1788 each shipped was NOT enough. Use `putField` / `copyFields`
      from `@real-router/core/utils` (#1852), or build the destination with
      `Object.create(null)` where it never escapes to a consumer.
    metadata:
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      references:
        - https://github.com/greydragon888/real-router/issues/1788
        - https://github.com/greydragon888/real-router/issues/1792
        - https://cwe.mitre.org/data/definitions/1321.html
    patterns:
      - pattern: $DST[$K] = $V
      # The key must be a bare identifier — a string literal is the author
      # naming a field, not a key that arrived from somewhere else.
      - metavariable-regex:
          metavariable: $K
          regex: ^[A-Za-z_$][\w$]*$
      # ...and it must be the loop variable of a walk over another bag. This is
      # what keeps the rule off `map[name]`-style writes, i.e. off the noise that
      # got `detect-object-injection` disabled.
      - pattern-either:
          - pattern-inside: |
              for (const [$A, $B] of Object.entries($SRC)) { ... }
          - pattern-inside: |
              for (const $C of Object.keys($SRC)) { ... }
          - pattern-inside: |
              for (const $D in $SRC) { ... }
          - pattern-inside: |
              for (const [$E, $F] of $SRC) { ... }
      # A null-prototype destination has no inherited setter to hit.
      - pattern-not-inside: |
          $DST = Object.create(null);
          ...
      # ⚠ The `__proto__` name test is NO LONGER an accepted fix (#1852): it
      # closes one literal and leaves every other name open, which is exactly how
      # this class survived three separate "fixes". These two entries stay only
      # so the rule does not re-flag a site mid-migration; a NEW site written
      # this way is a finding, not an exemption.
      - pattern-not-inside: |
          if ($K === "__proto__") { ... } else { ... }
      - pattern-not-inside: |
          if ($K !== "__proto__") { ... }
      # ...and the SECOND accepted shape, which #1792 shipped after this rule
      # was written: skip the key outright, so the write below is unreachable
      # for it. Core spells the name as the `UNSAFE_KEY` constant rather than
      # the literal — both spellings are listed, and nothing else is, so a
      # `continue` on some unrelated key still leaves the write flagged.
      - pattern-not-inside: |
          if (<... $K === "__proto__" ...>) { continue; }
          ...
      - pattern-not-inside: |
          if (<... $K === UNSAFE_KEY ...>) { continue; }
          ...
