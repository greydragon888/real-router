name: Sonar (trusted)

# ⚠ **The gate this exists for is one a fork PR cannot pass** (#1868). GitHub
# gives a `pull_request` workflow from a fork a read-only token and NO repository
# secrets, deliberately, so `SONAR_TOKEN` is absent and a scan run from inside
# `ci.yml` fails at "Secret source: None". Measured on #1857, the only fork PR
# this repository has received: every other required check passed and that one
# did not, so the practical position was "no outside contribution merges without
# an admin bypass".
#
# ⚑ `workflow_run` is the documented-safe shape, and the two facts that decide
# its design are both from GitHub's own docs:
#
#   1. "The workflow started by the `workflow_run` event is able to access
#      secrets and write tokens, even if the previous workflow was not."
#   2. `GITHUB_SHA` here is the LAST COMMIT ON THE DEFAULT BRANCH, not the PR's
#      head. So a job's own check run lands on `master` and can never satisfy a
#      required check on the PR — the verdict has to be POSTED to the head SHA
#      as a commit status, which is what the `gh api` steps below do.
#
# ⚠ **This workflow holds secrets, so the boundary is: it EXECUTES only
# base-repository code, and the PR's tree is DATA.** The analysis config
# (`sonar-project.properties`) and the scope script are checked out from
# `master`, never from the PR; there is no `pnpm install`, so no lifecycle script
# from the PR runs; and the scanner parses the source rather than executing it.
# `ci.yml`'s own comment names the trap this avoids: a workflow with
# `pull-requests: write` executing attacker-shaped JS.
#
# ⚠ **`SonarCloud` is a required status check and this workflow is its only
# producer.** A verdict that is never posted is not a pass — it leaves the PR
# blocked on a context nobody produces. Every path out of `gate` below therefore
# ends in a status, the two "nothing to analyse" paths included.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Least privilege: read the triggering run's artifacts, write one commit status.
permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: sonar-trusted-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  # The context named in the `protect-master` ruleset. Required checks match by
  # context, and the ruleset pins the GitHub Actions app (integration 15368) —
  # which is what `GITHUB_TOKEN` posts as — so the producer moved here without
  # the ruleset changing.
  STATUS_CONTEXT: SonarCloud

jobs:
  # Owns the two verdicts that need no scanner. Split from `sonar` because a job
  # cannot end early and still report: a skip has to be a different job's success.
  gate:
    name: Sonar gate
    runs-on: ubuntu-latest
    # `ci.yml` triggers on `pull_request` only; the event test keeps this true if
    # a trigger is ever added there. A CI run that did not succeed produced no
    # artifacts to read, and its PR is already blocked by `CI Result`.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      analyse: ${{ steps.decide.outputs.analyse }}
      sha: ${{ steps.meta.outputs.sha }}
      pr: ${{ steps.meta.outputs.pr }}
    steps:
      # ⚠ The PR number is NOT in `github.event.workflow_run.pull_requests` for a
      # fork — GitHub leaves that array empty across repositories, which is the
      # single most common way this pattern breaks. `ci.yml` uploads it instead.
      - name: Download PR metadata
        uses: actions/download-artifact@v8
        with:
          name: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-meta

      - name: Read PR metadata
        id: meta
        run: |
          set -euo pipefail
          # Written by a run the PR author controls, so validated rather than
          # trusted: a PR number is digits, a SHA is 40 hex characters. Anything
          # else stops here instead of reaching `gh api`.
          PR=$(tr -dc '0-9' < pr-meta/pr-number.txt | head -c 10)
          SHA=$(tr -dc '0-9a-f' < pr-meta/head-sha.txt | head -c 40)
          if [[ -z "$PR" || ${#SHA} -ne 40 ]]; then
            echo "::error::unusable PR metadata (pr='$PR' sha='$SHA')"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to analyse
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Dependabot gets the same secret-less token a fork does, which is why
          # no scan ever ran on its PRs. This workflow COULD scan them — it holds
          # the token — and deliberately does not: putting a real quality gate in
          # front of `resolve:dependabot`'s squash-merge is a decision of its
          # own, separate from moving the producer.
          if [[ "$ACTOR" == 'dependabot[bot]' ]]; then
            echo "analyse=false" >> "$GITHUB_OUTPUT"
            echo "why=Not analysed: dependabot" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No coverage artifact means CI built nothing to analyse — a docs-only
          # PR, or one whose turbo filter selected zero packages. `ci.yml`'s job
          # said this by skipping, and GitHub read a skip as a pass; said here it
          # has to be an explicit success. The `gh api` failure is NOT swallowed:
          # only the empty `grep` is, or an outage would report a green gate.
          NAMES=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --paginate --jq '.artifacts[].name')
          FOUND=$(printf '%s\n' "$NAMES" | grep -c '^coverage-reports-' || true)
          if [[ "$FOUND" -eq 0 ]]; then
            echo "analyse=false" >> "$GITHUB_OUTPUT"
            echo "why=Not analysed: no coverage produced" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "analyse=true" >> "$GITHUB_OUTPUT"

      - name: Report a run with nothing to analyse
        if: steps.decide.outputs.analyse != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.meta.outputs.sha }}" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description="${{ steps.decide.outputs.why }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report pending
        if: steps.decide.outputs.analyse == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.meta.outputs.sha }}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description='Analysis running' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ⚠ A `gate` that dies posts nothing, and nothing is not a pass — the PR
      # sits on `Expected` with no way to read why. The reachable death is the
      # download: `pr-meta` is kept for a day, so re-running this workflow later
      # finds it gone. Addressed to `workflow_run.head_sha`, which is the PR's
      # head commit and not the merge commit (measured on #2166: identical).
      - name: Report a gate that could not decide
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description='Could not read which commit to analyse' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  sonar:
    name: Sonar (trusted)
    needs: gate
    if: needs.gate.outputs.analyse == 'true'
    runs-on: ubuntu-latest
    steps:
      # ── The PR's tree, as DATA. Nothing here is executed.
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # ── Base-repository code, which IS executed. Checked out second and
      #    copied over the PR's copies, so a PR cannot redirect the scanner
      #    (`sonar.host.url`) or change what the scope script does.
      - name: Checkout trusted analysis config
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: |
            sonar-project.properties
            scripts/check-coverage-scope.mjs
          sparse-checkout-cone-mode: false

      - name: Install trusted config over the PR's
        run: |
          set -euo pipefail
          cp .trusted/sonar-project.properties ./sonar-project.properties
          mkdir -p scripts
          cp .trusted/scripts/check-coverage-scope.mjs scripts/check-coverage-scope.mjs
          rm -rf .trusted

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-reports-*
          merge-multiple: true
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Get version from core package
        id: version
        run: |
          set -euo pipefail
          # `require` on a .json parses it, it does not execute it.
          node -p 'require("./packages/core/package.json").version' > version.txt
          echo "version=$(head -c 40 version.txt)" >> "$GITHUB_OUTPUT"

      # Same derivation as `ci.yml`'s job used, from the TRUSTED copy of the
      # script — but run against the PR's filesystem, so its OUTPUT is data.
      - name: Compute Sonar scope
        id: scope
        run: node scripts/check-coverage-scope.mjs --emit >> "$GITHUB_OUTPUT"

      # ⚠ Every value below reaches the scanner's ARGV, and every one of them was
      # read off the PR's own tree — `packages/<name>/src` from a directory the
      # PR can name, `projectVersion` from a file it can write. A space in either
      # splits into a second argument, and a `-Dsonar.host.url` arriving that way
      # would send the analysis, authenticated with `SONAR_TOKEN`, wherever the
      # PR asked. Refused rather than escaped: a path and a version have no
      # reason to carry anything outside this set.
      - name: Refuse scanner arguments the PR could have shaped
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCES: ${{ steps.scope.outputs.sources }}
          TESTS: ${{ steps.scope.outputs.tests }}
          REPORTS: ${{ steps.scope.outputs.reports }}
        run: |
          set -euo pipefail
          for value in "$VERSION" "$SOURCES" "$TESTS" "$REPORTS"; do
            if [[ ! "$value" =~ ^[A-Za-z0-9._,/+-]+$ ]]; then
              echo "::error::scanner argument carries an unexpected character: $value"
              exit 1
            fi
          done

      # ⚠ The PR coordinates are passed explicitly. On a `pull_request` event the
      # action derives them from the payload; on `workflow_run` there is no PR in
      # the payload at all, so without these the scan would be filed as a branch
      # analysis of whatever `sonar.branch.name` defaulted to.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.sources=${{ steps.scope.outputs.sources }}
            -Dsonar.tests=${{ steps.scope.outputs.tests }}
            -Dsonar.javascript.lcov.reportPaths=${{ steps.scope.outputs.reports }}
            -Dsonar.pullrequest.key=${{ needs.gate.outputs.pr }}
            -Dsonar.pullrequest.branch=${{ github.event.workflow_run.head_branch }}
            -Dsonar.pullrequest.base=${{ github.event.repository.default_branch }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # A red quality gate must be REPORTED, not swallowed — `sonar.qualitygate
      # .wait=true` in the properties fails the step above, and this turns that
      # into the PR's verdict. Not `always()`: a CANCELLED run has been
      # superseded by a newer one for the same SHA, and posting `failure` from it
      # would overwrite that one's answer.
      - name: Report result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state="$STATE" \
            -f context="$STATUS_CONTEXT" \
            -f description="Quality gate: $STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
