name: Examples

on:
  schedule:
    - cron: "0 22 * * 2" # Wed at 05:00 ICT (UTC+7)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; the two notify jobs declare their own
# `issues: write`, which overrides this. No-op today (repo default is `read`) —
# insurance against a future flip of default_workflow_permissions.
permissions:
  contents: read

# Self-hosted ducktors/turborepo-remote-cache on Cloud Run + Cloudflare R2 (#490).
# The examples build with `pnpm -r`; turbo only bundles the packages they get
# as tarballs.
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # The only place the examples are linted. Nothing waits on it: a red lint
  # leaves the build and e2e below running and files its own issue
  # (`notify-lint-failure`), so it never reads as a broken example.
  lint:
    name: Lint Examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # The lockfile records npm releases; the lint reads this checkout's packages
      # — the types typed rules resolve are master's, not the last release's.
      - name: Install the examples with this checkout's packages
        run: node scripts/checkout-tarballs.mjs examples

      # `pnpm -r run lint:example` skips a package without the script silently.
      - name: Every examples package declares lint:example
        run: node scripts/examples-plan.mjs --missing-lint

      - name: Lint
        id: lint
        run: pnpm --dir examples -r --no-bail run lint:example

      # What the config gives each component kind, which a green lint cannot
      # show (examples/tests/component-lint-config.test.mjs). Runs after a red
      # lint too, but not when the lint never ran.
      - name: Lint config
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: pnpm --dir examples run test:lint-config

  examples:
    name: Build & Test Examples
    # Not on the self-hosted VPS: the build ran no faster there and held the
    # runner's single job slot (IMPLEMENTATION_NOTES "The examples build runs on
    # GitHub-hosted runners").
    runs-on: ubuntu-latest
    # A hang fails as a named timeout long before the 360-minute job default,
    # and notify-failure below files it.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Bundles and packs every public package of this checkout and installs
      # the tarballs in place of the npm releases the lockfile records — a library
      # change that breaks an example surfaces here, before it is published.
      - name: Install the examples with this checkout's packages
        run: node scripts/checkout-tarballs.mjs examples

      - name: Install Playwright browsers
        run: pnpm --dir examples --filter react-combined-example exec playwright install chromium --with-deps

      # Persist the downloaded Electron zip across runs (~128 MB), keyed by the
      # electron examples' manifests — the only place the electron version is
      # pinned — so only an electron bump rotates the key. (Keying by a lockfile
      # minted a new immutable ~128 MB cache entry on every lockfile change —
      # weekly dependabot churn that pressures the 10 GB LRU quota shared with
      # the pnpm store cache.) The installer self-heals on a stale/corrupt cache
      # (checksum re-verify → re-download) and prunes zips of other versions
      # restored via restore-keys.
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-zip
          key: electron-zip-${{ runner.os }}-${{ hashFiles('examples/desktop/electron/*/package.json') }}
          restore-keys: electron-zip-${{ runner.os }}-

      # The desktop/electron/* examples launch the real Electron binary via
      # Playwright's `_electron.launch`, which reads `node_modules/electron/path.txt`.
      # pnpm records a "built" flag in the cached store, so on a warm-store
      # runner it skips electron's postinstall, leaving `path.txt` absent. Both
      # `node install.js` and a Node wrapper around @electron/get exit 0 *at the
      # await* on this runner (the download never keeps the event loop alive),
      # writing no path.txt and bypassing any guard (#812). This script downloads
      # the release zip with curl (a blocking subprocess), verifies sha256, and
      # extracts — no Node async — so the step cannot go green without a binary.
      - name: Install Electron binary
        run: bash scripts/ci-install-electron.sh

      # `--no-bail`: a failing example must not stop the others, so one run
      # yields the complete list. The SSR examples have `build:app` instead,
      # which their Playwright `webServer` runs itself.
      - name: Build
        run: pnpm --dir examples -r --no-bail run --if-present build

      # xvfb-run: the desktop/electron/* examples launch a real Electron (a GUI
      # app) via `_electron.launch`. The runner is headless, so without a virtual
      # display Electron dies on platform init ("Missing X server or $DISPLAY" →
      # SIGSEGV). Xvfb is preinstalled on ubuntu-latest; depth 24 (Chromium
      # dislikes the 8-bit default). Web examples run headless Chromium and ignore
      # the display. (#812) One example at a time: the suites share ports.
      - name: Run E2E tests
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24"
          pnpm --dir examples -r --workspace-concurrency=1 --no-bail run --if-present test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Examples nest 3-4 levels deep (examples/web/<fw>/<name>/,
          # examples/desktop/electron/<name>/) — a single-level glob matched
          # nothing, so reports were never uploaded on failure (#812).
          path: |
            examples/**/playwright-report/
            examples/**/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Open/refresh a tracking issue when the scheduled suite fails, so chronic
  # redness can't live unnoticed (the only other signal is an email to the
  # workflow-file author). Skipped on workflow_dispatch to avoid noise during
  # manual verification runs (#812).
  notify-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [examples]
    # `!success()`, not `failure()`: a job killed by `timeout-minutes` ends as
    # CANCELLED, which `failure()` does not match — so the timeout added above would
    # otherwise free the runner SILENTLY, and the class this job exists to surface
    # (a wedged weekly run) is exactly the class that hangs. Verified on run
    # 29875788664: everything ended `cancelled` and no issue was ever filed.
    # Safe here because cancellation is not routine for this workflow — it is
    # schedule/dispatch-only, and the `schedule` clause keeps a manual dispatch
    # from filing issues. (Deliberately NOT copied to post-merge.yml, where
    # `cancel-in-progress: true` cancels superseded runs constantly and `!success()`
    # would open an issue on every quick second push.) (Audit §4.8.)
    if: "!success() && github.event_name == 'schedule'"
    permissions:
      issues: write
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- examples-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🔴 Examples workflow failing';
            const body = [
              marker,
              `The scheduled **Examples** workflow failed.`,
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              '_Auto-filed by `examples.yml`. This comment updates on each subsequent failure; close the issue once green._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area: ci/cd',
              per_page: 100,
            });
            const existing = issues.find(i => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'area: ci/cd'],
              });
            }

  # The lint's own tracker — a separate marker, so a lint finding and a broken
  # example never share an issue. Same `!success()` and `schedule` rules as above.
  notify-lint-failure:
    name: Open issue on lint failure
    runs-on: ubuntu-latest
    needs: [lint]
    if: "!success() && github.event_name == 'schedule'"
    permissions:
      issues: write
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- examples-lint-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🟡 Examples lint failing';
            const body = [
              marker,
              `The scheduled **Examples** workflow's lint failed. The build and e2e ran regardless.`,
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              '_Auto-filed by `examples.yml`. This comment updates on each subsequent failure; close the issue once green._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area: ci/cd',
              per_page: 100,
            });
            const existing = issues.find(i => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'area: ci/cd'],
              });
            }
