name: CodSpeed

# Hot-path benchmark gate — BOTH suites, in one workflow, on purpose.
#
#   job `core`     — the tinybench suite under packages/core/tests/benchmarks/
#                    wired to @codspeed/tinybench-plugin via fixtures.ts
#                    (makeBench → withCodSpeed). RFC:
#                    .claude/core-benchmark-strategy-rfc-ru.md.
#   job `adapters` — the six framework suites (react/preact/vue/solid/svelte/
#                    angular), pure tinybench + vite prebuild under jsdom.
#                    Design record: IMPLEMENTATION_NOTES ("Adapter benches —
#                    all six frameworks") and benchmarks/adapter-bench/.
#
# Both run under CodSpeed's `simulation` instrument (Valgrind callgrind), so
# each bench emits deterministic instruction counts instead of wall-clock.
#
# ⚑ ONE WORKFLOW IS A REQUIREMENT, NOT A TIDY-UP (#1691). CodSpeed aggregates
# the results of several jobs into a single report ONLY when they are "split
# within a single CI workflow" (docs: Features → Sharded benchmarks). While the
# adapter suite lived in its own workflow file the two suites produced TWO
# CodSpeed runs per commit, and every report bound to one of them and marked the
# other suite SKIPPED — with three visible consequences:
#   1. the aggregate impact oscillated ±20% between consecutive commits purely
#      by which run a commit happened to bind to, on trees whose runtime code
#      was byte-identical (measured on #1689: -19.71% → +19.72% → -20.23%, the
#      middle pair cancelling to 0.01pp);
#   2. every core benchmark's BASE value was carried over from an earlier run
#      ("Skipped result on the base run, the displayed result ran 1 day ago"),
#      so base and head were never measured in the same run;
#   3. a real regression sat in the same red list as the artefacts, so the one
#      number worth reading was the hardest to find.
# Per-benchmark the instrument was never the problem: across three same-tree
# runs all 66 core benchmarks agreed to within 3.5%, most of them exactly.
#
# What the split DID protect is preserved: the two jobs carry no `needs`, so an
# adapter-suite failure still never blocks the core signal, and vice versa. They
# remain two independent checks — only the report they upload to is now one.
# ⚠ Their serialisation comes from the runner having a single job slot, exactly
# as it did when they were two workflows. If a second slot is ever added they
# could run concurrently and perturb each other's counts; the fix then is
# `needs: core` + `if: always() && …` on `adapters`, which keeps the
# independence above. Do not add a bare `needs`.
#
# Auth: real-router is a PUBLIC repo, so CodSpeed runs tokenless — no
# CODSPEED_TOKEN secret is required ("token: only required for private
# repositories"). Aggregation additionally requires both jobs to use the SAME
# auth method (docs: "Mixing authentication methods will prevent CodSpeed from
# aggregating the results correctly") — neither job passes `token:`, so both are
# tokenless. Keep it that way, or make the change in both jobs at once. The one
# external prerequisite is installing the CodSpeed GitHub App on the repo
# (https://codspeed.io) so the run has a project to upload to.
#
# Push-to-master establishes the baseline; pull_request compares against it. The
# regression threshold / gate semantics live in the CodSpeed project settings,
# not here — this workflow only runs the suites under instrumentation and
# uploads.

# ✅ ENABLED — Phase 2 (2026-07-16). History: the gate was disabled (#984,
# 2026-06-27) because GitHub's heterogeneous `ubuntu-latest` pool landed base
# and head on different CPUs (AMD EPYC vs Intel Xeon), so callgrind emitted
# different instruction counts and every PR red-flagged with phantom
# ±30–4000% swings (root cause:
# https://codspeed.io/blog/unrelated-benchmark-regression). Phase 1 moved the
# job to a dedicated self-hosted VPS (consistent hardware) — but a same-sha
# dispatch pair STILL drifted 3/56 (×5.1 / +82% / +41%): the plugin's
# single-measured-iteration `simulation` mode occasionally drops a full-GC
# tail into the one measured call. Fixed by BATCHING each task to ~4-6 ms of
# operations + a pre-run `settleHeap()` (see packages/core/tests/benchmarks/
# fixtures.ts and IMPLEMENTATION_NOTES "Batched measurements + heap settling");
# verified 0/56 across three same-code run pairs. The adapter suite was verified
# the same way in its own Phase 1 (three K-calibration iterations; final same-sha
# pair 18/18 unchanged, impact +0.014%). The installer download from codspeed.io
# is unreachable from the RF VPS, so runner-version is pinned to a cargo-git rev
# (see the action steps below).
#
# Phase 2 (this state): push:[master] seeds/updates the baseline (feature-merge
# commits only — release-merge commits are skipped, see the job `if`),
# pull_request compares against it. The regression threshold / gate semantics live in the
# CodSpeed project settings, not here; CodSpeed is NOT a required status check,
# so a red comparison informs but does not block merges. SECURITY: the job `if`
# gates pull_request to same-repo PRs only — fork-PR code never executes on the
# self-hosted VPS (public-repo RCE / resource-abuse surface).
#
# PATH FILTER (2026-08-01 CI/CD audit §3.1). Instruction counts cannot move for a
# change that ships no code, yet every run costs the SINGLE self-hosted runner
# minutes of EXCLUSIVE time — measured on d766588af (a one-file `.claude/`
# commit): core 166 s + adapters 264 s = 430 s, on a runner shared with
# examples.yml and the weekly cross-router bench. Over the 30 days to 2026-08-01,
# 163 of 517 master commits touched no packages/shared/examples/benchmarks file
# at all; `.claude/` (97) and `.github/` (52) dominate. Skipping at the `on:`
# level is safe HERE precisely because CodSpeed is not a required status check
# (contrast codeql.yml, where a skipped workflow would deadlock the required
# `Dependency Review` context): a workflow that never starts reports nothing and
# nothing waits for it. Root manifests (package.json, pnpm-lock.yaml, .nvmrc,
# turbo.json, *.config.*) are deliberately NOT ignored — a toolchain bump does
# move instruction counts. To exercise a change to this workflow itself, use
# workflow_dispatch. ⚑ There is now ONE list serving both suites — the twin that
# had to be kept byte-identical by hand (GitHub Actions has no YAML anchors) is
# gone with the second workflow file.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".github/**"
      - ".husky/**"
      - "scripts/**"
      # ⚠ ONE NARROW addition, and the narrowness is the point.
      # `packages/**` is otherwise significant by default — a source change can
      # move the numbers, so the ignore list stays conservative there.
      # `knip.json` configures dead-code analysis and reaches no runtime.
      # ⛔ Do NOT widen this to `packages/core/tests/benchmarks/**`: editing a
      # real bench MUST re-seed the baseline, and swallowing that is how a
      # comparison silently starts measuring against the wrong reference.
      - "knip.json"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".github/**"
      - ".husky/**"
      - "scripts/**"
      # ⚠ ONE NARROW addition, and the narrowness is the point.
      # `packages/**` is otherwise significant by default — a source change can
      # move the numbers, so the ignore list stays conservative there.
      # `knip.json` configures dead-code analysis and reaches no runtime.
      # ⛔ Do NOT widen this to `packages/core/tests/benchmarks/**`: editing a
      # real bench MUST re-seed the baseline, and swallowing that is how a
      # comparison silently starts measuring against the wrong reference.
      - "knip.json"
  # Manual re-seed / backtest of the CodSpeed baseline.
  workflow_dispatch:
    inputs:
      suites:
        # ⚑ WHY THIS EXISTS: the runner has ONE job slot, and this workflow
        # declares TWO jobs. On a dispatch GitHub hands the slot to `adapters`
        # FIRST, so `core` waits out its full 4 m 14 s before starting —
        # measured on run 31319433823: adapters 14:48:53 -> 14:53:07, core
        # 14:53:10 -> 14:56:01. The runner is idle of OTHER work the whole time;
        # the queue is the run competing with itself, which is why the delay
        # reproduces on every dispatch. Core's own work is ~2.75 min, so a
        # core-only dispatch is roughly twice as fast.
        #
        # Default is `core` because dispatch is overwhelmingly used to measure a
        # core probe branch. ⚠ For a deliberate BASELINE re-seed pick `both` —
        # a `core` dispatch leaves the adapter benchmarks unmeasured for that
        # commit.
        description: "Which suites to run"
        required: false
        default: "core"
        type: choice
        options:
          - core
          - both

# A burst of pushes / PR synchronizes otherwise queues N runs on a runner that
# executes one job at a time. Supersede PR runs; NEVER cancel a push run — each
# master push seeds its own baseline and dropping one leaves a hole in the
# comparison history. One group now covers both suites, which is what we want:
# they belong to the same run and must be superseded together, or a stale half
# would upload into the new run's report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Core hot-path benchmarks
    # SECURITY (self-hosted + public repo): never run untrusted fork-PR code on
    # the VPS. This gate lets push + workflow_dispatch through unconditionally
    # (they carry no pull_request payload, so the first clause is true), and
    # allows a pull_request ONLY when its head is a branch in THIS repo (a
    # collaborator's branch). A fork PR has head.repo.full_name =
    # "<forker>/real-router" != github.repository, so the job is skipped — fork
    # code never executes on the runner.
    #
    # RELEASE PRs / RELEASE MERGES: the changesets "version packages" PR (head
    # branch changeset-release/*) only bumps versions/CHANGELOGs — runtime code
    # is byte-identical to master. So BOTH its pull_request run AND its eventual
    # push-to-master merge run are redundant, and both are skipped:
    #   - pull_request side: gated by head_ref (changeset-release/*).
    #   - push side: gated by the merge commit's message ("release: version
    #     packages…" — the changesets `commit:` convention, changesets.yml) via
    #     the third clause below.
    # This drops the per-release CodSpeed cost from 3 slow runs to 2 on the
    # single self-hosted runner: feature PR (the gate) + feature-merge push (the
    # baseline). The feature-merge push already records the baseline — it
    # carries the REAL code change — so re-measuring byte-identical code at the
    # release merge would only queue the runner a redundant third time and delay
    # the release. (github.head_ref is empty on push / workflow_dispatch, so the
    # changeset-release/* clause is a no-op for them; the head_commit clause is
    # push-only, so it never affects pull_request or workflow_dispatch.)
    #
    # DEPENDABOT PRs: skipped on the pull_request side (author dependabot[bot],
    # second clause of the pull_request guard). Dependabot only bumps infra
    # devDeps / peer ranges / GitHub Actions; the CodSpeed verdict is NOT a
    # required check and adds little on a dep bump, while each run costs 2 slow
    # jobs (core + adapters) on the single one-job-at-a-time runner — a queue
    # the valuable feature-PR / baseline runs would wait behind. The push-to-
    # master side is deliberately NOT skipped: after a Dependabot PR merges, the
    # master push re-seeds the baseline with the real dep change, so a bundler/
    # compiler bump that DOES shift instruction counts (tsdown / rolldown /
    # vitest / typescript / tinybench) still surfaces on the next ordinary
    # comparison — the verdict is deferred one run, not lost.
    #
    # ⚠ The `adapters` job below carries this expression VERBATIM. They gate the
    # same runner on the same events for the same reasons; if you change one,
    # change both, or a fork PR gains a foothold through the half you forgot.
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')) &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !(github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release: version packages'))
    # Self-hosted VPS runner = consistent hardware, which fixes the #984 cause:
    # GitHub's heterogeneous ubuntu-latest pool put base/head on different CPUs
    # (AMD EPYC vs Intel Xeon) → phantom instruction-count swings.
    runs-on: self-hosted
    # Bound the hold on the single self-hosted runner: measured 163 s (core) and
    # 231 s (adapters) on real runs, so 30 min is ~10x headroom, against an
    # invisible 360-minute default that would park the production VPS for six
    # hours on a wedged process. (2026-08-01 CI/CD audit §4.8.)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # clean: false keeps the persistent runner's gitignored node_modules
        # (and pnpm store) between dispatches — checkout still fetches + resets
        # tracked files to the new sha, only the `git clean -ffdx` is skipped.
        # `pnpm install --frozen-lockfile` in Setup then no-ops instead of
        # re-linking 30 workspace packages, cutting Setup from ~36 s to a few s.
        # Safe here: the suite runs from src via tsx + --conditions=
        # @real-router/internal-source (no vitest, no dist build), so leftover
        # artifacts can't perturb resolution or the callgrind counts.
        with:
          clean: false

      - name: Setup
        uses: ./.github/actions/setup
        # node-cache: "" skips setup-node's pnpm-store cache restore — on this
        # persistent runner the store + node_modules already live on local disk
        # (see clean:false above), and the restore re-downloads a ~200 MB
        # tarball from GitHub's cache backend every run (~20 s) just to unpack
        # it over an identical local store.
        with:
          node-cache: ""

      # runner-version: rev:… installs codspeed-runner via `cargo install` into
      # ~/.cargo/bin. Actions runs each step in a non-login, non-interactive
      # shell (`bash --noprofile --norc`), which does NOT read the ~/.profile
      # line rustup adds — so ~/.cargo/bin is off PATH, and the action's runner
      # invocation dies with `codspeed: command not found` (exit 127) even
      # though the install succeeded. Persist the dir on PATH for every later
      # step (incl. the action's internal run step) via $GITHUB_PATH. The
      # release/curl path installs onto PATH itself and would not need this;
      # it is specific to the cargo-install path we switched to.
      - name: Put cargo bin dir on PATH (for cargo-installed codspeed-runner)
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # CodSpeed injects its required V8 flags (--allow-natives-syntax, --no-opt,
      # …) ONLY into the process it wraps directly, and those flags can't ride
      # ⚠ #1728 briefly "corrected" this line to say `--no-opt` is not applied in
      # `simulation`. That was WRONG and is restored: `getV8Flags()` switches on
      # `getInstrumentMode()`, and that function maps BOTH `simulation` and
      # `memory` onto `analysis` — so the full set (`--no-opt`, `--predictable`,
      # `--expose-gc`, fixed seeds, no concurrent sweeping) does apply. Reading
      # the switch without following the mapping is how the mistake happened;
      # the consequence is load-bearing, because the benchmarked code runs with
      # the JIT OFF and every deopt / inlining / tier explanation is moot.
      # through NODE_OPTIONS. So we wrap a DIRECT `node` that runs the whole suite
      # in ONE process (tests/benchmarks/codspeed.ts imports every *.bench.ts and
      # awaits them serially) — NOT `pnpm bench`, whose pnpm → tsx → spawn-per-file
      # hops strip the flags and crash @codspeed/core on its `%` native. Local
      # `pnpm bench` keeps process-per-file (run.ts) for wall-clock dev.
      #
      # working-directory: packages/core so `tsx` and @real-router/* resolve from
      # the package; --conditions maps @real-router/* to live `src/` (no build).
      #
      # `mode` is a REQUIRED input on the v4 action (no default) — omitting it
      # fails the run before any bench executes. `simulation` is the
      # deterministic instruction-count instrument (vs `walltime`, which needs
      # dedicated runners). ⚠ It measures USER-SPACE work only — "CodSpeed CPU
      # Simulation mode does not include system calls in the measurement" — and
      # these navigate arms report ~70 excluded syscalls each, so a percentage
      # here is a share of a quantity a user never experiences on its own.
      # Whether to move them to `walltime` is the open half of #1691.
      #
      # runner-version: `rev:v4.18.4` forces the action's cargo-install branch
      # (`source $HOME/.cargo/env; cargo install --locked --git
      # https://github.com/CodSpeedHQ/codspeed --rev v4.18.4 codspeed-runner`)
      # INSTEAD of its default release path, which curls the installer from
      # `https://codspeed.io/v4.18.4/install.sh`. That host is intermittently
      # unreachable from the RF-hosted self-hosted VPS — ~50% of dispatches died
      # with `curl: (28) SSL connection timeout` after 300 s, before any bench
      # ran. The cargo path fetches from github.com + crates.io only (no
      # codspeed.io). v4.18.4 pins the SAME runner the release path used, so
      # measurement is unchanged. PREREQUISITE (VPS-side, one-time): rustup/cargo
      # must be installed for the `gh-runner` user — the action does
      # `source $HOME/.cargo/env`; without it the step fails fast. On the
      # PERSISTENT runner cargo compiles once (~2-3 min, needs crates.io) then
      # reports "already installed" and skips on every later dispatch (no
      # network), so the flake is retired after the first green run. ⚠ Keep this
      # rev, the action version and `mode` identical in BOTH jobs: differing
      # values are a mixed-measurement report, and a differing auth method would
      # stop CodSpeed aggregating them at all.
      - name: Run core hot-path benchmarks under CodSpeed
        uses: CodSpeedHQ/action@v5.0.1
        with:
          mode: simulation
          runner-version: rev:v4.18.4
          working-directory: packages/core
          run: node --conditions=@real-router/internal-source --import tsx tests/benchmarks/codspeed.ts

  adapters:
    name: Adapter hot-path benchmarks (6 frameworks)
    # VERBATIM copy of the `core` guard above — see it for the full rationale
    # (fork-PR security on the self-hosted VPS, release PRs/merges, Dependabot).
    # Deliberately duplicated rather than hoisted: `if` has no workflow-level
    # form, and the two jobs must not drift.
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      inputs.suites == 'both') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')) &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !(github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release: version packages'))
    # Same self-hosted VPS as the core job: consistent hardware; the runner
    # processes one job at a time, so core/adapters queue, never race.
    # ⚑ The FIRST clause is the dispatch gate (see the `suites` input): it only
    # ever skips this job on a manual dispatch, so push and pull_request keep
    # running BOTH suites — which is what CodSpeed's aggregation requires.
    runs-on: self-hosted
    # Same bound and rationale as `core` (§4.8): measured 231 s here, so 30 min
    # is ~8x headroom instead of the invisible 360-minute default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Same persistent-runner reuse as `core`: keep gitignored node_modules
        # between runs (this suite's own dist/ is regenerated by the prebuild
        # step below — emptyOutDir: true).
        with:
          clean: false

      - name: Setup
        uses: ./.github/actions/setup
        # Skip the ~200 MB pnpm-store cache round-trip — store + node_modules
        # live on this runner's local disk (see `core` for the numbers).
        with:
          node-cache: ""

      # codspeed-runner is cargo-installed (rev pin below); ~/.cargo/bin is
      # not on Actions' non-login-shell PATH — same fix as `core`.
      - name: Put cargo bin dir on PATH (for cargo-installed codspeed-runner)
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # OUTSIDE the CodSpeed action on purpose: vite build must not be
      # instrumented — only the bench process is. The bench itself is a single
      # direct `node` (no vitest, no spawn hops), the exact process shape whose
      # V8-flag injection the core job already proved on this runner.
      - name: Prebuild the bench apps (vite ×6, production, NOT instrumented)
        working-directory: benchmarks
        # via the workspace script (not `pnpm exec vite`) so knip resolves the
        # vite binary against benchmarks/package.json, where it is declared.
        # The script also bundles the angular graph first (turbo): the angular
        # suite resolves @real-router/* to built dist — see vite/base.mts.
        run: pnpm run prebuild:adapter

      # runner-version: rev:… = cargo-install path (github.com + crates.io
      # only; codspeed.io is unreachable from this VPS ~50% of the time).
      # cargo self-caches the rev, so this is zero-network after the first
      # compile the core job already paid. ⚠ Keep the rev, the action version,
      # `mode` and the (absent) `token:` in lockstep with `core` — see that
      # step's note on why aggregation depends on it.
      - name: Run adapter benchmarks under CodSpeed
        uses: CodSpeedHQ/action@v5.0.1
        with:
          mode: simulation
          runner-version: rev:v4.18.4
          working-directory: benchmarks
          run: node --import tsx adapter-bench/codspeed.mts
