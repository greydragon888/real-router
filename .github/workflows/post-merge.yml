name: Post-Merge Build

on:
  push:
    branches: [master]

# ⚠ A RELEASE commit is the one build that must not be treated as superseded.
# `cancel-in-progress` is right for ordinary pushes and wrong for exactly this
# one: `changesets.yml` fires on a `workflow_run` whose conclusion is
# `success`, so a cancelled release build means `changeset publish` never runs
# and the versions that commit allocated exist only in their own CHANGELOG
# sections — no npm release, no tag (#2057). Measured: 51 such versions across
# 20 packages, and a 52nd appeared the day after that issue was filed.
#
# ⚑ Giving release commits their own group keyed by SHA costs nothing on the
# ordinary path — those pushes still share one group and still cancel. The
# alternative #2057 lists first (dropping `cancel-in-progress` outright) pays
# for the same protection with a wasted build on every push, which is the
# thing the setting exists to avoid. The prefix is not a guess:
# `changesets.yml` sets `commit: "release: version packages…"`, and a
# squash-merge of that PR keeps it.
concurrency:
  # ⚠ DOUBLE-quoted, and that is not style: the expression contains
  # `release: version packages`, and a colon-space inside a plain scalar makes
  # YAML read the value as a nested key. Measured — the unquoted multi-line form
  # fails to parse with MULTILINE_IMPLICIT_KEY.
  group: "post-merge-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'release: version packages') && format('-{0}', github.sha) || '' }}"
  cancel-in-progress: true

# Least-privilege default (the single build job only checks out + uploads an
# artifact). No-op today (repo default is `read`) — insurance against a future
# flip of default_workflow_permissions.
permissions:
  contents: read

# Self-hosted ducktors/turborepo-remote-cache on Cloud Run + Cloudflare R2 (#490)
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # turbo's OTLP metrics (#1745), as in ci.yml.
  TURBO_EXPERIMENTAL_OTEL_ENABLED: "true"
  TURBO_EXPERIMENTAL_OTEL_PROTOCOL: http-protobuf
  TURBO_EXPERIMENTAL_OTEL_ENDPOINT: ${{ secrets.TELEMETRY_OTLP_ENDPOINT }}
  TURBO_EXPERIMENTAL_OTEL_HEADERS: authorization=Bearer ${{ secrets.TELEMETRY_OTLP_AUTH }}
  TURBO_EXPERIMENTAL_OTEL_METRICS_TASK_DETAILS: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The same stamp as the setup action's (#1745): this job does not use it.
      - name: Stamp CI identity for turbo telemetry
        run: |
          {
            printf 'TURBO_EXPERIMENTAL_OTEL_RESOURCE=service.name=turbo,service.namespace=real-router'
            printf ',ci.job=%s' "${GITHUB_JOB}"
            printf ',ci.event=%s' "${GITHUB_EVENT_NAME}"
            printf ',ci.runner=%s' "${RUNNER_ENVIRONMENT:-unknown}"
            printf ',process.runtime.version=%s\n' "$(node -v)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `test:stress` intentionally NOT included — mirrors PR CI (`ci.yml`).
      # Leak/race-condition coverage stays in the pre-push hook, which runs
      # `test:stress` as a dedicated `--concurrency=1` step (#1423). If a leak
      # ever lands on master through a bot-push that bypasses pre-push (e.g.
      # auto-merged changeset release), re-add `test:stress` to the run line.
      # `lint` is EXPLICIT since it stopped being a `test` dependency — as a
      # sibling task it runs in parallel with the tests instead of gating them.
      - name: Build
        run: >-
          pnpm turbo run bundle test test:properties lint
          --filter='!./examples/**'
          --summarize

      # Per-task timings of master's own build (.turbo/runs/*.json). A direct
      # push to master gets no PR run, so this is the only record of what it
      # rebuilt and for how long. `if: always()` makes a failing build still
      # upload what ran. The 90 days match ci.yml's summaries.
      - name: Upload turbo run summary (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-post-merge
          path: .turbo/runs/
          retention-days: 90

      # Publish master's bundle sizes so each PR's `bundle-size` job can diff
      # against them via artifact download — instead of re-checking-out,
      # re-installing, and re-bundling the base branch on every PR (#734).
      # size-limit exits non-zero when a limit is exceeded but still prints the
      # JSON report, so the exit code is not the signal here — the report is.
      # The step stays green either way (this is a measurement, not a gate), but
      # it no longer stays SILENT: size-limit's stderr reaches the log, and a
      # report that is missing or is not a non-empty array is announced before
      # the fallback. An empty base is not free — it makes every package in
      # every PR's size diff read as "new".
      - name: Measure bundle sizes (base for PR diffs)
        run: |
          npx size-limit --json > master-bundle-sizes.json || true
          if ! node -e 'const r = JSON.parse(require("fs").readFileSync("master-bundle-sizes.json", "utf8")); if (!Array.isArray(r) || r.length === 0) process.exit(1)' 2>/dev/null; then
            echo "::warning title=Base bundle sizes unavailable::size-limit produced no usable report (see this step's log) — PR size diffs will show every package as new"
            echo '[]' > master-bundle-sizes.json
          fi

      - name: Upload base bundle sizes
        uses: actions/upload-artifact@v7
        with:
          name: master-bundle-sizes
          path: master-bundle-sizes.json
          retention-days: 90

  # A failed build here is not just a red run — it BREAKS THE RELEASE CHAIN.
  # changesets.yml triggers on `workflow_run` with conclusion == 'success', so a
  # failure means no release run is created at all and pending version bumps sit
  # on master unpublished, with no signal anywhere. Same tracking-issue pattern as
  # examples.yml / cross-router-bench.yml, which already guard their scheduled
  # runs this way. Recovery is a `workflow_dispatch` of Changesets (see its `on:`).
  # (2026-08-01 CI/CD audit §2.1.)
  notify-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [build]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- post-merge-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🔴 Post-Merge Build failing on master';
            const body = [
              marker,
              'The **Post-Merge Build** failed on `master`. Beyond the red run, this **breaks the release chain**:',
              '`changesets.yml` triggers on a *successful* `workflow_run`, so no release run was created and any',
              'pending version bumps stay unpublished.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Once master is green again, either push another commit (the next successful post-merge re-arms the',
              'chain) or dispatch **Changesets** manually — `changeset publish` is idempotent and the reconcile step',
              'backfills tags/Releases.',
              '',
              '_Auto-filed by `post-merge.yml`. This comment updates on each subsequent failure; close the issue once green._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area: ci/cd',
              per_page: 100,
            });
            const existing = issues.find(i => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'area: ci/cd'],
              });
            }
