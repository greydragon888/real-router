name: CodeQL

on:
  # No workflow-level paths-ignore: `Dependency Review` is a REQUIRED status
  # check (protect-master ruleset), and a workflow skipped at the `on:` level
  # never reports its check → the PR blocks forever on a pending required check.
  # The release PR (which only bumps versions/changelogs and has nothing to
  # scan) is skipped at the JOB level via the `if:` below — a job skipped by
  # `if:` reports a "skipped" conclusion, which branch protection treats as a
  # pass, so the required check is satisfied without running. ⚠ That makes the
  # skip part of the gate, so it names the release PR exactly:
  # `changeset-release/master` from this repository. The author of a pull
  # request picks its branch name, a fork's author included. danger.yml skips
  # the release PR by the same condition.
  # Dependabot dep PRs change pnpm-lock.yaml too, so they were
  # never matched by the old `**/package.json` ignore anyway — they keep running.
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Skip the release PR (no code to analyze) and Dependabot's npm PRs, which
    # change manifests and the lockfile but no line CodeQL reads
    # (IMPLEMENTATION_NOTES "Dependabot PRs skip every metric"). A Dependabot
    # GitHub Actions PR still runs: when the bump is this action, this job is
    # the only run of the new version before it reaches master.
    # CodeQL stays advisory (not a required check), so a skip here can't block.
    if: >-
      github.event_name == 'schedule' ||
      (!(github.head_ref == 'changeset-release/master' &&
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.pull_request.user.login != 'dependabot[bot]' ||
      startsWith(github.head_ref, 'dependabot/github_actions/')))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Required status check (protect-master). Runs on every PR but the release
    # PR, so a dependency change is always scanned; the release PR is skipped →
    # "skipped" conclusion → treated as a pass (no deadlock). A fork's branch of
    # any name, and any other branch of this repository, still runs it. Not on
    # schedule (no PR diff to review).
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/master' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # The license allow-list and `allow-ghsas`, which sync-config.mjs writes
          # from scripts/osv-scanner.toml. A key set here would replace the file's.
          config-file: ./.github/dependency-review-config.yml
          comment-summary-in-pr: on-failure
          warn-on-openssf-scorecard-level: 0
