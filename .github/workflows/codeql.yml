name: CodeQL

on:
  # No workflow-level paths-ignore: `Dependency Review` is a REQUIRED status
  # check (protect-master ruleset), and a workflow skipped at the `on:` level
  # never reports its check → the PR blocks forever on a pending required check.
  # Release PRs (`changeset-release/*`, which only bump versions/changelogs and
  # have nothing to scan) are skipped at the JOB level via head-ref `if:` below
  # — a job skipped by `if:` reports a "skipped" conclusion, which branch
  # protection treats as a pass, so the required check is satisfied without
  # running. This mirrors the head-ref gating already used in danger.yml (#811-
  # era hardening). Dependabot dep PRs change pnpm-lock.yaml too, so they were
  # never matched by the old `**/package.json` ignore anyway — they keep running.
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Skip release PRs (no code to analyze) and Dependabot's npm PRs, which
    # change manifests and the lockfile but no line CodeQL reads
    # (IMPLEMENTATION_NOTES "Dependabot PRs skip every metric"). A Dependabot
    # GitHub Actions PR still runs: when the bump is this action, this job is
    # the only run of the new version before it reaches master.
    # CodeQL stays advisory (not a required check), so a skip here can't block.
    if: >-
      github.event_name == 'schedule' ||
      (!startsWith(github.head_ref, 'changeset-release/') &&
      (github.event.pull_request.user.login != 'dependabot[bot]' ||
      startsWith(github.head_ref, 'dependabot/github_actions/')))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Required status check (protect-master). Runs on every non-release PR so a
    # dependency change is always scanned; skipped on release PRs via head-ref
    # → "skipped" conclusion → treated as a pass (no deadlock). Not on schedule
    # (no PR diff to review).
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          config-file: ./.github/dependency-review-config.yml
          comment-summary-in-pr: on-failure
          warn-on-openssf-scorecard-level: 0
          # GHSA-wrw7-89jp-8q8g — glib@0.18.5 (VariantStrIter unsoundness, fixed
          #   in 0.20.0). Transitive via Tauri 2 → GTK/WebKit bindings on Linux
          #   only, pulled by the desktop example apps under
          #   examples/desktop/tauri/*/src-tauri/. Not in any published package.
          # GHSA-5p2g-fcmc-qvqq / GHSA-w3rx-r6r6-pgpr — image-size <= 2.0.2,
          #   event-loop DoS via infinite loops in the JXL/HEIF and ICNS parsers.
          #   NO fixed release exists (OSV last_affected 2.0.2), so there is
          #   nothing to bump to. Transitive OPTIONAL peer via `less` (vite /
          #   @angular/build / ng-packagr), build-time only, not in any published
          #   package — and unreachable: the repo contains no `.less` files, so
          #   the LESS compiler never runs. Mirrors scripts/osv-scanner.toml;
          #   the two must stay in sync.
          allow-ghsas: GHSA-wrw7-89jp-8q8g, GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr, GHSA-vwc7-r8mq-g2x9
