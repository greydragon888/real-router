# The wiki's two checkers, on a schedule and on a wiki edit (#2466).
#
# They read BOTH repositories: `check-links.mjs` resolves wiki links against
# monorepo paths, and `check-messages.mjs` compares every message a page quotes
# against the literals in `packages/*/src`. So drift arrives from either side, and
# a rename in the monorepo makes a page wrong with nobody touching the wiki —
# which is how #2399, #2458 and #2460 happened.
#
# ⚠ **Neither direction can be BLOCKED where its fix lives, so nothing here is a
# required check.** A wiki finding cannot be answered in a monorepo pull request
# (the wiki is a separate repository with no pull requests), and a monorepo rename
# cannot be answered in the wiki. #2450 took the smoke test off the release pull
# request on exactly that reasoning. An advisory job on every `packages/*/src`
# pull request was considered and declined: an advisory check is one nobody must
# act on, and the schedule below finds the same drift within a day — this is
# documentation drift, not a release blocker.
#
# `gollum` fires in THIS repository when someone edits a wiki page, which covers
# the wiki-side direction immediately and costs nothing. It reports rather than
# blocks, because the push has already happened by the time the event arrives.
#
# ⚠ **The two checkers are named here by hand, and nothing holds that list to the
# wiki's.** A third checker added there runs nowhere until someone adds a step. No
# gate can close that from this side: the monorepo's own tests never see the wiki,
# so the only thing that could compare the lists is a job that has already cloned
# it — this one. A renamed checker at least fails loudly rather than silently
# passing, because `node` cannot find the file.
name: Wiki checkers

on:
  schedule:
    # Daily, ahead of `stranded-release.yml`'s 06:17 so the two do not start
    # together. 12:41 ICT (UTC+7) — the drift this reports is a day old at worst.
    - cron: "41 5 * * *"
  gollum:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ⚠ `cancel-in-progress: false` on purpose. A burst of wiki edits queues runs
  # instead of cancelling them, because a cancelled job ends as CANCELLED and the
  # `!success()` gate below would file an issue for it — the trap `examples.yml`
  # records and `post-merge.yml` deliberately avoids.
  group: wiki-checkers
  cancel-in-progress: false

jobs:
  check:
    name: Wiki checkers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # `--ignore-scripts`: `check-messages.mjs` needs exactly one thing from the
      # install — `node_modules/typescript/lib/typescript.js`, which it imports by
      # path — and it reads `packages/*/src`, never `dist`, so nothing has to be
      # built. `check-links.mjs` needs no dependency at all.
      - uses: ./.github/actions/setup
        with:
          install-args: "--frozen-lockfile --ignore-scripts"

      # A public repository's wiki clones without credentials; embedding a token
      # in the URL would put it in the log for nothing.
      - name: Clone the wiki
        run: git clone --depth 1 "$WIKI_REMOTE" "$RUNNER_TEMP/wiki"
        env:
          WIKI_REMOTE: https://github.com/greydragon888/real-router.wiki.git

      # ⚠ Both checkers resolve the wiki from their OWN location and the monorepo
      # from `$REAL_ROUTER_ROOT`, so they run from the clone with the root passed
      # in. Without the root, `check-messages.mjs` prints "no checks run" and
      # which of its three reasons applies — it does not pass silently, which is
      # what makes a summary of a broken run readable rather than green.
      # ⚠ The output is CAPTURED rather than piped into the summary. `node … | tee`
      # exits with tee's status, and the default shell for `run:` is `bash -e`
      # WITHOUT pipefail — measured, that pipeline exits 0 while the checker exits
      # 1, so a finding would have been written to the summary and the job would
      # have stayed green. Capturing also closes the fenced block on the failing
      # path, which a `set -e` abort mid-step does not.
      - name: check-links
        run: |
          set -euo pipefail
          out=$(node "$RUNNER_TEMP/wiki/check-links.mjs" 2>&1) && rc=0 || rc=$?
          {
            echo '### check-links'
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
        env:
          REAL_ROUTER_ROOT: ${{ github.workspace }}

      - name: check-messages
        # always(): the two checks are independent, and a link finding must not
        # hide a message finding from the same run.
        if: always()
        run: |
          set -euo pipefail
          out=$(node "$RUNNER_TEMP/wiki/check-messages.mjs" 2>&1) && rc=0 || rc=$?
          {
            echo '### check-messages'
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
        env:
          REAL_ROUTER_ROOT: ${{ github.workspace }}

  # The same tracker shape `examples.yml` uses: one issue, a comment per
  # subsequent failure, closed once green. A job summary would be cheaper and
  # invisible — nobody opens a green workflow's summary, and this signal exists
  # precisely for the days nobody looks.
  notify-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [check]
    # `!success()`, not `failure()`: a job killed by `timeout-minutes` ends as
    # CANCELLED, which `failure()` does not match. A manual dispatch files
    # nothing, so verifying this workflow by hand cannot open issues.
    if: "!success() && github.event_name != 'workflow_dispatch'"
    permissions:
      issues: write
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- wiki-checkers-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🔴 Wiki checkers failing';
            const body = [
              marker,
              'A **Wiki checkers** run failed — a page quotes something the code no longer prints, or a link no longer resolves.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              '',
              'The fix belongs in whichever repository the drift came from: a renamed message is fixed in the wiki page, a wrong link in whichever side moved.',
              '',
              '_Auto-filed by `wiki-checkers.yml`. This comment updates on each subsequent failure; close the issue once green._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area: ci/cd',
              per_page: 100,
            });
            const existing = issues.find(i => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — ${runUrl} (${context.eventName})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['documentation', 'area: ci/cd'],
              });
            }
