name: Danger

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  danger:
    name: Danger JS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Skip draft PRs and the release PR (it only bumps versions/changelogs).
    # Gate by head-ref, NOT paths-ignore: the old
    # `paths-ignore: **/package.json` skipped the workflow on ANY package.json-only
    # PR — including the exact case `checkLockfileSync` exists to catch (a deps
    # bump that forgot `pnpm install`), so that check could never fire.
    # The release PR is `changeset-release/master` from this repository, as in
    # codeql.yml: the author of a pull request picks its branch name, a fork's
    # author included.
    #
    # Dependabot's PRs are skipped by author (IMPLEMENTATION_NOTES "Dependabot
    # PRs skip every metric"). Every rule here is advisory, and the one about
    # bumps, `checkLockfileSync`, has nothing to find there: Dependabot changes
    # the lockfile with the manifests. A human's deps bump still runs it.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(github.head_ref == 'changeset-release/master' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Danger
        run: pnpm danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
