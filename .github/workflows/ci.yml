name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Jobs that need write (duplication→security-events,
# coverage/bundle-size→pull-requests/checks) declare their own job-level
# `permissions:`, which fully overrides this. No-op today (repo
# default_workflow_permissions is already `read`) — this is insurance against a
# future flip of that global setting silently over-permissioning every job.
permissions:
  contents: read

# Turbo Remote Cache - shared across all jobs
# Self-hosted ducktors/turborepo-remote-cache on Cloud Run + Cloudflare R2 (#490)
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # turbo's OTLP metrics (#1745) go to the collector in ops/telemetry, which
  # turns turbo's delta temporality into what Grafana Cloud accepts. A fork PR
  # gets empty secrets, and turbo starts no exporter without an endpoint. The
  # resource attributes come from the setup action's stamp step.
  TURBO_EXPERIMENTAL_OTEL_ENABLED: "true"
  TURBO_EXPERIMENTAL_OTEL_PROTOCOL: http-protobuf
  TURBO_EXPERIMENTAL_OTEL_ENDPOINT: ${{ secrets.TELEMETRY_OTLP_ENDPOINT }}
  TURBO_EXPERIMENTAL_OTEL_HEADERS: authorization=Bearer ${{ secrets.TELEMETRY_OTLP_AUTH }}
  TURBO_EXPERIMENTAL_OTEL_METRICS_TASK_DETAILS: "true"

jobs:
  # Fast check to determine if CI should run
  # Always runs to satisfy required status checks
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      turbo_base: ${{ steps.turbo.outputs.base }}
      mode: ${{ steps.plan.outputs.mode }} # 'leaf' | 'sharded'; empty for docs/CI-only PRs
      matrix: ${{ steps.plan.outputs.matrix }} # always-valid JSON; {"include":[]} for leaf
      leaf_filter: ${{ steps.plan.outputs.leaf_filter }} # explicit --filter set for pipeline-leaf; empty on a zero-package leaf
      examples_filter: ${{ steps.plan.outputs.examples_filter }} # explicit --filter set for examples-build; empty when no example is affected
      examples_lint_filter: ${{ steps.examples_lint.outputs.examples_lint_filter }} # explicit --filter set for examples-lint; empty when no change reaches an example from outside
      examples_lint_reasons: ${{ steps.examples_lint.outputs.examples_lint_reasons }}
      no_source: ${{ steps.source.outputs.no_source }} # 'true' when the diff holds no code a check could read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: changes
        run: |
          # A `changeset-release/*` PR is NOT skipped here, deliberately: its tree
          # — bumped versions, rewritten CHANGELOGs, consumed changesets — is the
          # one that lands on master, and until it does nothing else checks it
          # (see IMPLEMENTATION_NOTES "Release PRs run the pipeline"). CodeQL,
          # CodSpeed and danger keep their own head-ref skips.
          #
          # pull_request-only workflow — base/head come straight from the PR event.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # "Code" = anything that isn't docs or CI config — EXCEPT .github/actions/**.
          # Composite actions (e.g. actions/setup) execute in every build job, so a
          # change there must run the full pipeline that exercises them. #733 closed
          # this class for workflow files (actionlint on every PR), but composite
          # actions are outside actionlint's scope AND outside a bare '^\.github/'
          # exclude — a setup-only PR skipped ALL CI and broke only after merge (#1128).
          # ERE has no lookahead, so do it in two passes over the changed set (docs
          # dropped up front): (1) everything not under .github/, plus (2) anything
          # under .github/actions/. The '|| true' guards keep a grep no-match exit
          # from tripping the step's `set -e`.
          #
          # `git diff` runs on its OWN line, unpiped and WITHOUT `|| true`: piped into
          # `grep … || true` its failure was indistinguishable from "no files changed"
          # (grep on empty input exits 1, the guard swallows it) — the step then
          # SUCCEEDED with should_run=false and the required gate printed
          # "✅ Skipped — no code changes" without running anything. The #1133 guard
          # can't catch that: it fires on check.result != success, and this variant
          # keeps the job green. `set -o pipefail` would NOT fix it either — the
          # trailing `|| true` still swallows the pipeline status. Splitting the two
          # commands is what makes a git failure fail the step (bash -e), which then
          # turns the gate red via the #1133 guard. (2026-08-01 CI/CD audit §1.2.)
          ALL_CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          CHANGED=$(printf '%s\n' "$ALL_CHANGED" | grep -vE '\.md$' || true)
          NON_GH=$(printf '%s\n' "$CHANGED" | grep -vE '^\.github/' || true)
          GH_ACTIONS=$(printf '%s\n' "$CHANGED" | grep -E '^\.github/actions/' || true)
          CODE_CHANGES=$(printf '%s\n%s\n' "$NON_GH" "$GH_ACTIONS" | grep . | head -1 || true)

          if [ -z "$CODE_CHANGES" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "📝 Only docs/CI changes detected, skipping CI"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "🔍 Code changes detected, running full CI"
          fi

      # Does this PR's diff hold anything a code reader reads (#2433)? A release
      # PR's does not — `changeset version` writes manifests, CHANGELOGs and the
      # lockfile — and neither does a manifest-only bump. `coverage` and
      # `duplication` below consult this, and so does `sonar-trusted.yml`, which
      # computes it again from the trusted payload rather than reading it here:
      # this output travels in an artifact a fork's run writes.
      #
      # `git diff` runs on its OWN line, unpiped, for the reason the step above
      # spells out: piped into the predicate, its failure would be
      # indistinguishable from an empty diff. `set -e` covers it there; inside
      # the `if` below only the predicate's exit code is read.
      - name: Check for source in the diff
        id: source
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if printf '%s\n' "$CHANGED" | node scripts/diff-carries-no-source.mjs; then
            echo "no_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_source=false" >> "$GITHUB_OUTPUT"
          fi

      # Turbo `--affected` base. This is a pull_request-only workflow, so the
      # step below is currently inert: its push branch never runs, `turbo_base`
      # stays empty, and the pipeline/bundle filters use their
      # `|| 'origin/master'` fallback — i.e. affected packages are computed
      # relative to origin/master, NOT auto-detected per the old comment (#735).
      # The push branch is retained so the step keeps working if a push trigger
      # is ever added.
      - name: Set Turbo SCM base
        id: turbo
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
          fi

      # R2.19: the shard plan (formerly a separate compute-plan job) is folded
      # into check so the leaf/sharded paths don't pay a serial job-prefix.
      # Classify affected → leaf | sharded matrix via build-matrix.mjs (native
      # `turbo query affected`). Runs only when there is code to build; for
      # docs/CI-only PRs `mode`/`matrix` stay empty and every downstream
      # `if: …mode == …` job is skipped.
      - name: Fetch master for Turbo comparison
        if: steps.changes.outputs.should_run == 'true' && github.event_name == 'pull_request'
        run: git fetch origin master:master

      # Minimal install: turbo builds the affected graph from package.json +
      # lockfile, not node_modules. --ignore-scripts is safe — @turbo/<platform>
      # ships its binary via optionalDependencies with no postinstall.
      - name: Setup (pnpm + Node + minimal install)
        if: steps.changes.outputs.should_run == 'true'
        uses: ./.github/actions/setup
        with:
          install-args: --frozen-lockfile --ignore-scripts

      - name: Build shard plan
        id: plan
        if: steps.changes.outputs.should_run == 'true'
        run: node scripts/build-matrix.mjs >> "$GITHUB_OUTPUT"

      # The examples and benchmarks this PR reaches from OUTSIDE them (#2402).
      # The checkout is the PR's merge commit, so `HEAD^1` is the base it is
      # built on.
      - name: Plan examples lint
        id: examples_lint
        if: steps.changes.outputs.should_run == 'true'
        run: node scripts/examples-lint-filter.mjs HEAD^1 HEAD >> "$GITHUB_OUTPUT"

      # ⚠ The PR number and head SHA, written to an artifact because a
      # `workflow_run` workflow cannot obtain them for a FORK: GitHub leaves
      # `github.event.workflow_run.pull_requests` empty across repositories, and
      # `workflow_run`'s own `GITHUB_SHA` is the default branch's tip rather than
      # the PR's head. `sonar-trusted.yml` reads this and validates both values
      # before they reach any API call — they originate in a fork-authored run.
      - name: Write PR metadata
        run: |
          set -euo pipefail
          mkdir -p pr-meta
          echo "${{ github.event.pull_request.number }}" > pr-meta/pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-meta/head-sha.txt

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          if-no-files-found: error
          retention-days: 1
          path: pr-meta/

  # ============================================
  # PIPELINE-LEAF: monolithic path for small, non-core PRs (mode=leaf).
  # Byte-identical to the historical single `pipeline` job; only the two
  # uploaded artifact names carry a `-leaf` suffix (coverage merge, R2.4).
  # turbo run test triggers type-check as a dep; `lint` is a SIBLING task on the
  # run line (it stopped being a `test` dependency — see IMPLEMENTATION_NOTES
  # "lint left the test dependency chain").
  # turbo run bundle produces dist/ (cache-shared with build).
  # ============================================

  pipeline-leaf:
    name: Pipeline (leaf)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.mode == 'leaf'
    outputs:
      # 'true' when turbo's affected filter actually produced package outputs.
      # A root config/docs change (e.g. package.json scripts, .jscpd.json) passes
      # the `check` heuristic (should_run=true) yet affects ZERO packages, so
      # test/bundle run nothing and no dist/coverage artifacts exist. Downstream
      # artifact consumers gate on this to skip instead of failing on a missing
      # download. See IMPLEMENTATION_NOTES "CI: artifact-gated downstream jobs".
      built: ${{ steps.artifacts.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Leaf EXECUTION scope = the ROUTING decision. build-matrix.mjs emits
      # leaf_filter as explicit `--filter=<pkg>` tokens from `turbo query affected
      # --packages`, which attributes a ROOT-file change (pnpm-lock.yaml, root
      # tsconfig) to its real package. The git-ref filter `--filter='...[ref]'`
      # instead treats ANY root-file change as touching every workspace, so a
      # Dependabot lockfile bump — routed here as a 1-package leaf — used to
      # execute the whole-repo graph; with Remote Cache off in the Dependabot
      # context (repo secrets withheld) that ran COLD (~8m vs ~2m). Fall back to
      # the git-ref filter only when leaf_filter is empty (a root-config PR
      # touching zero packages — yields zero tasks there, as before). Resolved
      # once into $GITHUB_ENV and reused (word-split, unquoted) by the steps below.
      - name: Resolve leaf filter
        env:
          LEAF_FILTER: ${{ needs.check.outputs.leaf_filter }}
          TURBO_BASE: ${{ needs.check.outputs.turbo_base || 'origin/master' }}
        run: echo "LEAF_FILTER=${LEAF_FILTER:-"--filter=...[$TURBO_BASE]"}" >> "$GITHUB_ENV"

      # Full validation: type-check → lint → test → test:properties.
      # ^bundle for upstream packages runs bundle (tsdown) as a dependency.
      #
      # `test:stress` intentionally NOT included on PR CI — its leak/race-condition
      # signal is low-frequency and the iterations are CPU-expensive (saves
      # ≈5 min of wall time per run, mostly visible on lockfile-bump PRs where
      # the whole project rebuilds). Stress tests still run locally via the
      # pre-push hook, as a dedicated `test:stress --concurrency=1` step (#1423,
      # isolated from the concurrent build so heap thresholds don't flake).
      # Re-introduce them here if a memory-leak regression
      # from a framework adapter bump (React/Vue/Solid/Svelte) ever slips
      # through pre-push.
      #
      # Coverage is enabled in `vitest.config.unit.mts` (coverage.enabled: true)
      # and disabled in property configs (coverage.enabled: false).
      # Passing `-- --coverage` here overrides `enabled: false` for property
      # tasks, which then run with vitest's default reporter set (html,
      # clover, json) — no lcov — and their `clean: true` default wipes the
      # lcov.info that `test` produced a moment earlier. The resulting coverage/
      # directory ends up without lcov.info, which in turn makes SonarCloud see
      # 0% coverage on any new source lines in those packages. Don't add the
      # `-- --coverage` passthrough back — each config controls its own
      # coverage.enabled.
      # `lint` is listed EXPLICITLY here and in every other test invocation: it
      # used to arrive as a `test` dependency, which serialised it AHEAD of the
      # tests (measured on run 30712451199: core#lint 0→70 s, core#test only
      # 70→118 s — three of the runner's cores idle the whole time). As a sibling
      # task it overlaps the tests instead. Removing it from this line does not
      # fail anything — it silently stops linting the PR.
      - name: Test with coverage
        run: >-
          pnpm turbo run test test:properties lint
          $LEAF_FILTER
          --filter='!./examples/**'
          --filter='!./benchmarks'
          --summarize

      # Bundle affected packages (tsdown/rollup/svelte-package).
      # bundle:upstream → cache hit from test step (^bundle already executed).
      # bundle:affected-leaf → tsdown runs fresh.
      - name: Bundle
        run: >-
          pnpm turbo run bundle
          $LEAF_FILTER
          --filter='!./examples/**'
          --filter='!./benchmarks'
          --summarize

      # Per-task execution timings (.turbo/runs/*.json), mirroring the shards'
      # step: without them a job's wall-clock is a single opaque number and any
      # "which task dominates?" question is guesswork (2026-08-01 CI/CD audit
      # §3.2). Each turbo invocation writes its OWN summary, so this uploads the
      # whole directory — the test run and the bundle run are separate files.
      - name: Upload turbo run summaries (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # NOT `turbo-summary-leaf`: `leaf` is also one of build-matrix.mjs's
          # GROUP_NAMES, so a sharded run can emit `turbo-summary-leaf` for the
          # catch-all shard. The two modes never coexist in one run (so artifact
          # names can't actually collide), but comparing runs later would.
          name: turbo-summary-pipeline-leaf
          path: .turbo/runs/
          retention-days: 90

      # Did turbo's affected filter actually build/test any package? On a
      # root config/docs-only PR the answer is no — and there are no dist/
      # or coverage/ dirs to upload, so downstream jobs must skip rather than
      # fail on a missing artifact download.
      - name: Detect produced artifacts
        id: artifacts
        run: |
          # Gate on real FILES, not directory existence (#730). A root config
          # change that isn't a turbo input (.jscpd.json, codecov.yml, knip.json,
          # …) passes the `check` heuristic yet affects ZERO packages, so
          # test/bundle produce nothing — but empty packages/*/dist and
          # packages/*/coverage dirs can still be present. The old
          # nullglob-on-directories check saw those empty dirs and set
          # built=true, while upload-artifact (which needs files inside) created
          # nothing — leaving coverage/bundle-size to fail on a
          # missing artifact download and blocking the config-only PR via the
          # required CI Result gate.
          #
          # The grouped \( … \) is required: `-path A -o -path B -type f` binds
          # as `A OR (B AND -type f AND -print)`, so a lcov.info match on branch
          # A would never print. Grouping applies -type f/-print/-quit to BOTH.
          produced="$(find packages \( -path '*/coverage/lcov.info' -o -path '*/dist/*' \) -type f -print -quit)"
          if [ -n "$produced" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "🏗️  Affected packages produced artifacts — downstream jobs will run"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No packages affected — downstream artifact jobs will skip"
          fi

      # publint (lint:package) + attw (lint:types) validate the published tarball
      # shape and the type resolution of the dist just built. Both dependsOn
      # bundle, which ran above with the same filter → cache hit, so this is
      # seconds. Previously pre-push only — which Dependabot automerge,
      # `--no-verify`, and web edits all bypass, so a dep/build bump that broke
      # export or .d.ts validity could merge green (#813). Gated on built:
      # nothing bundled → nothing to validate (the affected filter would run zero
      # tasks anyway). Folds into the required CI Result via this job.
      - name: Validate published artifacts (publint + attw)
        if: steps.artifacts.outputs.built == 'true'
        run: >-
          pnpm turbo run lint:package lint:types
          $LEAF_FILTER
          --filter='!./examples/**'
          --filter='!./benchmarks'

      - name: Fix coverage paths
        run: bash scripts/fix-lcov-paths.sh

      - name: Upload coverage artifacts
        if: steps.artifacts.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-leaf
          path: packages/*/coverage/
          retention-days: 1

      - name: Upload build artifacts
        if: steps.artifacts.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-leaf
          path: packages/*/dist/
          retention-days: 1

  # ============================================
  # BASE — since turbo `test` dropped its `^bundle` dependency, TESTS need no
  # dists at all, so base-bundle gates NOTHING via `needs` anymore: base-test
  # and the shards start straight after `check`, and base-bundle runs in
  # PARALLEL with them. base-bundle still exists for four jobs:
  #   1. dist-base artifact (consumed by bundle-size / smoke),
  #   2. core's publication lints (publint/attw),
  #   3. Remote-Cache warm of core#bundle — the shards' SECOND turbo invocation
  #      (`turbo run bundle`, after their tests) hits it instead of each shard
  #      rebuilding core (a lost race is a benign duplicate build, not a failure),
  #   4. the angular dom-utils sync check, run once.
  # Repo-global lints live in the separate parallel repo-lints job.
  # ============================================

  base-bundle:
    name: Base bundle (core layer)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.mode == 'sharded'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      - name: Bundle core layer
        run: pnpm turbo run bundle --filter='@real-router/core...' --summarize

      - name: Validate core published artifacts (publint + attw)
        run: pnpm turbo run lint:package lint:types --filter='@real-router/core...'

      # Per-task timings — see the note in pipeline-leaf (audit §3.2).
      - name: Upload turbo run summaries (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-base-bundle
          path: .turbo/runs/
          retention-days: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-base
          path: packages/*/dist/
          retention-days: 1

  # ============================================
  # BASE-TEST: core-layer test + test:properties, PARALLEL to the shards AND to
  # base-bundle. It starts straight after `check`: turbo `test` no longer
  # depends on `^bundle`, so the former `needs: base-bundle` edge ("purely for
  # the upstream ^bundle Remote-Cache HIT") lost its premise and was removed —
  # it was delaying the heaviest test job by base-bundle's full duration for
  # nothing. Emits coverage-reports-base for the coverage / sonar merge.
  # ============================================
  base-test:
    name: Base test (core layer, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.mode == 'sharded'
    strategy:
      # Every shard's result is wanted: the merged coverage in `base-coverage`
      # is only correct when all four blobs are present, and a cancelled shard
      # would make the 100 % thresholds fail for a reason that is not a defect.
      fail-fast: false
      matrix:
        # Four, measured. Local walls for the slowest shard: 23.5 s at 4, 20.5 s
        # at 6, 18.7 s at 8 — while the summed work goes 66.5 -> 72.9 -> 83.4 s
        # and the imbalance grows 1.41x -> 1.69x -> 1.79x, because `--shard`
        # splits by a hash of the file path and one heavy file dominates whatever
        # shard it lands in. Past four, more jobs buy less.
        shard: [1, 2, 3, 4]
    env:
      # Keeps the four shards apart in turbo's telemetry (#1745).
      TURBO_TELEMETRY_JOB_SUFFIX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # base-test OWNS the "base" layer: build-matrix.mjs classifies the
      # CORE_LAYER set as the `base` group and EXCLUDES it from the dynamic
      # shards, delegating its test+coverage to this job. Today the set is
      # `@real-router/core` alone — the fold-into-core waves dissolved every
      # other former member (engine, fsm, logger, types, event-emitter,
      # type-guards) into core itself.
      #
      # The filter still enumerates CORE_LAYER members EXPLICITLY rather than
      # using `--filter='@real-router/core...'`: turbo's `pkg...` expands the
      # package *scope* to core+deps but runs the requested task (`test`) ONLY
      # on the matched package, and `test` has no `^test` — so when the base
      # layer had multiple members, every non-core member was tested NOWHERE
      # (shards exclude them too), emitted no lcov, and SonarCloud scored its
      # changed lines 0% (#1030 hit exactly this via event-emitter —
      # new_coverage 76.1% < 80%, gate FAILED). With core alone the two forms
      # coincide, but the explicit-member form stays: the list is sourced from
      # build-matrix.mjs CORE_LAYER (the single source of truth that also
      # decides shard exclusion), so a future base-layer member is tested here
      # automatically instead of resurrecting #1030. $FILTERS is intentionally
      # unquoted (bash word-splitting into separate --filter=<pkg> tokens) —
      # same pattern as the shards' $SHARD_FILTER.
      - name: Test core layer
        run: |
          FILTERS=$(node -e 'import("./scripts/build-matrix.mjs").then((m) => process.stdout.write([...m.CORE_LAYER].map((p) => "--filter=" + p).join(" ")))')
          echo "Core-layer filters: $FILTERS"
          # #1065: shared/{browser-env,dom-utils} coverage is now owned by the
          # consumer packages (browser-plugin ← browser-env, react ← dom-utils) and
          # rides along in their shard jobs; there is no separate shared test node to
          # run here anymore.
          # shellcheck disable=SC2086
          # `lint` is NOT here: it is `base-lint`'s job. It never gated the
          # tests — the two ran concurrently on one 4-vCPU runner, at 197 s and
          # 196 s, which is why neither could be optimised without the other's
          # contention confounding the measurement (#2429).
          #
          # `test:properties` is NOT here: it is `base-properties`' job (#2429).
          # Measured over five runs, this job's wall was the serial chain
          # type-check → test → test:properties (medians 13 + 197 + 67 = 277 of a
          # 278 s job), with `lint` (196 s) fitting inside it. The tier left the
          # chain in turbo.json; running it here in parallel instead would put two
          # vitest processes on one 4-vCPU runner, which is the contention #2107's
          # property-suite timeouts were measured under.
          # ⚠ Thresholds OFF here, and the 100 % gate moves to `base-coverage`.
          # A shard's own report counts every file `coverage.include` names —
          # measured, shard 1 of 4 reads 85.64 % (3519/4109) because the other
          # three shards' files are present at 0 %. Vitest checks thresholds on
          # every coverage-enabled run, so they have to be off per shard and on
          # once, on the merged report.
          #
          # `--` forwards to `vitest`, and turbo hashes what it forwards
          # (`cliArguments`), so the four shards have four distinct cache keys
          # rather than replaying each other.
          # shellcheck disable=SC2086
          pnpm turbo run test $FILTERS --summarize -- \
            --shard=${{ matrix.shard }}/4 \
            --reporter=blob \
            --outputFile.blob=.vitest/blob/${{ matrix.shard }}.json \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.lines=0

      # These summaries are what made #2429 measurable: the audit added them
      # because nothing said how this job's time split between core#test,
      # core#test:properties and their lint/type-check dependencies. They now
      # also carry the after-numbers of the split.
      # (Phase 0, 2026-08-01 CI/CD audit §3.2.)
      - name: Upload turbo run summaries (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-base-test-${{ matrix.shard }}
          path: .turbo/runs/
          retention-days: 90

      # The shard's raw V8 coverage, not a report. `--merge-reports` in
      # `base-coverage` merges these before the Istanbul conversion, so the
      # merged numbers are one measurement rather than four averaged ones.
      - name: Upload coverage blob
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-${{ matrix.shard }}
          if-no-files-found: error
          path: packages/core/.vitest/blob/
          retention-days: 1

  # ============================================
  # BASE COVERAGE: where core's 100 % thresholds are checked (#2429). They used
  # to run inside `base-test`'s single `vitest run`; with that job split four
  # ways they cannot, because a shard sees only its own quarter — measured,
  # shard 1 of 4 reports 85.64 % (3519/4109) with the other three shards' files
  # present at 0 % through `coverage.include`.
  #
  # ⚠ Its own job, and a HARD requirement in `CI Result`. The existing
  # `coverage` job is read through `ok()` — a skip counts as a pass there, and
  # it skips on a Dependabot PR and on a diff with no source — so the 100 %
  # gate cannot live in it without becoming skippable.
  #
  # The merge itself is cheap: measured locally at 0.91 s for four blobs, and it
  # prints the same 4109/2250/813/4078 an unsharded run does.
  # ============================================
  base-coverage:
    name: Base coverage (core layer)
    runs-on: ubuntu-latest
    needs: [check, base-test]
    if: needs.check.outputs.mode == 'sharded'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      - name: Download coverage blobs
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: packages/core/.vitest/blob/

      # Fail loud on a missing blob rather than merging three quarters and
      # reporting a number that looks like a coverage regression.
      - name: Verify all four blobs arrived
        run: |
          set -euo pipefail
          count=$(find packages/core/.vitest/blob -name '*.json' | wc -l | tr -d ' ')
          echo "blobs: $count"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 coverage blobs, found $count"
            exit 1
          fi

      - name: Merge coverage and check thresholds
        working-directory: packages/core
        run: npx vitest --merge-reports=.vitest/blob --coverage

      - name: Fix coverage paths
        run: bash scripts/fix-lcov-paths.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-base
          path: |
            packages/*/coverage/
          retention-days: 1

  # ============================================
  # BASE LINT: the core layer's lint, off base-test's runner (#2429). It never
  # gated the tests — `test` and `lint` ran concurrently inside base-test at
  # 197 s and 196 s — so this split does not shorten the gate by itself. What it
  # buys is a runner each: measured locally, `eslint --concurrency=4` on core
  # takes 0.57x the wall for 2.23x the CPU, and on a shared 4-vCPU runner that
  # CPU comes out of the concurrent vitest. The same reasoning put
  # `base-properties` on its own runner.
  #
  # No coverage upload: `lint` writes none.
  # ============================================
  base-lint:
    name: Base lint (core layer)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.mode == 'sharded'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Same CORE_LAYER filter as base-test, from the same single source of
      # truth, and unquoted for the same word-splitting reason.
      - name: Lint core layer
        run: |
          FILTERS=$(node -e 'import("./scripts/build-matrix.mjs").then((m) => process.stdout.write([...m.CORE_LAYER].map((p) => "--filter=" + p).join(" ")))')
          echo "Core-layer filters: $FILTERS"
          # ESLint's worker threads, and ONLY here (#2437). This job lints one
          # package alone on its own runner; `turbo run lint` across the 25
          # packages already saturates the machine, and adding workers inside
          # each of them is over-subscription — measured, 74.7 s -> 83.0 s of
          # wall for 1.73x the CPU. So the flag is a passthrough here rather
          # than a change to the packages' `lint` scripts.
          #
          # `auto`, not a number: eslint@10.11 resolves it to
          # `min(ceil(files / 50), floor(availableParallelism() / 2))`, which is
          # 2 workers on a 4-vCPU runner — and 2 workers want 2.8 cores, which
          # fit. An explicit 4 wants 5.6 on a runner that has four.
          #
          # ⚠ turbo hashes what `--` forwards, so this job's `core#lint` entries
          # no longer share a cache key with the ones pre-push writes.
          # shellcheck disable=SC2086
          pnpm turbo run lint $FILTERS --summarize -- --concurrency=auto

      - name: Upload turbo run summaries (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-base-lint
          path: .turbo/runs/
          retention-days: 90

  # ============================================
  # REPO-LINTS: repo-global lints (syncpack / pnpm dedupe / coverage-scope /
  # knip) — not per-package, not affected-scoped, and not turbo-cached (direct
  # pnpm scripts that re-run every time). Pulled OUT of base + pipeline-leaf into
  # a standalone job that runs in PARALLEL on both paths, so they no longer
  # inflate the base→shards Amdahl prefix (R2.6). Needs only install — no build,
  # no coverage. Mode-independent: runs on every should_run PR; CI gate requires
  # it (hard, not ok()-skippable).
  # ============================================

  # ============================================
  # BASE PROPERTIES: the property tier of the base layer, off base-test's
  # critical path (#2429). It used to run inside base-test, behind
  # `test:properties.dependsOn: ["test"]`, which made that job a serial chain —
  # medians over five runs: type-check 13 s → test 197 s → test:properties 67 s,
  # 277 of a 278 s job. The edge is gone from turbo.json; a separate job rather
  # than the same runner, because two vitest processes on one 4-vCPU runner is
  # the contention the property suite timed out under in #2107.
  #
  # No coverage upload: `vitest.config.properties.mts` sets
  # `coverage.enabled: false` — the tier asserts invariants, and core's 100 %
  # comes from the `test` tier in base-test.
  # ============================================
  base-properties:
    name: Base properties (core layer)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.mode == 'sharded'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Same CORE_LAYER source as base-test, for the same reason its comment
      # gives: the list comes from build-matrix.mjs, so a future base-layer
      # member runs its property tier here instead of nowhere.
      - name: Property-test core layer
        run: |
          FILTERS=$(node -e 'import("./scripts/build-matrix.mjs").then((m) => process.stdout.write([...m.CORE_LAYER].map((p) => "--filter=" + p).join(" ")))')
          echo "Core-layer filters: $FILTERS"
          # shellcheck disable=SC2086
          pnpm turbo run test:properties $FILTERS --summarize

      - name: Upload turbo run summaries (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-base-properties
          path: .turbo/runs/
          retention-days: 90
  repo-lints:
    name: Repo Lints
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.should_run == 'true'
    env:
      # Read by the dedupe step below. The `secrets` context is not usable in a
      # job-level `if:`, so the presence check is materialised here. On a run
      # triggered BY Dependabot this resolves from the Dependabot secret store (the
      # only store such a run can see); on every other run — including the one the
      # dedupe workflow's PAT push retriggers — it is empty. That asymmetry is what
      # makes the condition below self-limiting.
      HAS_DEDUPE_FIXER: ${{ secrets.DEPENDABOT_PUSH_TOKEN != '' }}
      # On a Dependabot PR only the four checks a bump can fail run here: deps,
      # dedupe, the repository-wide scans and knip. The rest read code and docs
      # a bump does not change; the failure record behind this split is in
      # IMPLEMENTATION_NOTES "Dependabot PRs skip every metric".
      DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
      # A release PR has the SAME diff shape as a bump — manifests, CHANGELOGs,
      # the consumed changesets and the lockfile (#2433's predicate) — so it takes
      # the same split rather than its own. The four that stay are the four whose
      # subject that shape holds: `lint:deps` judges the peer floors
      # `changeset version` rewrites, `lint:dedupe` the lockfile the root
      # `version` script regenerates (#2411), and four of the twelve
      # repository-wide scans plus knip read manifests and Markdown.
      # ⚠ Asked of the DIFF, not of the branch name: one source file in a
      # `changeset-release/*` branch must still reach every check (#2450).
      NO_SOURCE: ${{ needs.check.outputs.no_source }}
    steps:
      # Full history: three cells of `diff-carries-no-source.test.mjs` read real
      # commits — release commits, dependency bumps, commits that touch source —
      # and in the default `fetch-depth: 1` clone there is no parent to diff
      # against, so they skip. Measured on this job: 3 s → 6 s for the checkout.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      - name: Check dependency consistency
        run: pnpm lint:deps

      # `ci.yml` and `dependabot-dedupe.yml` start on the SAME `pull_request` event
      # and race. CI always wins (the dedupe job does a full install first), so on a
      # Dependabot PR this step reads the lockfile BEFORE the fix is pushed and fails
      # `ERR_PNPM_DEDUPE_CHECK_ISSUES` by construction — measured 2026-08-02: of the
      # last 40 ci.yml runs, 35 green / 4 red, and all four reds are `dependabot/*`
      # branches with `Repo Lints` failing. The gate was therefore red on every
      # Dependabot PR, which is exactly what #1085 set out to prevent.
      #
      # Skipped for a Dependabot-triggered run ONLY when the dedupe workflow can
      # actually push its fix (`DEPENDABOT_PUSH_TOKEN` present). That is what keeps
      # the guarantee instead of trading it away: the PAT push retriggers CI, and
      # that second run is authored by the PAT owner — not dependabot[bot], and with
      # no Dependabot secrets — so BOTH halves of this condition are false there and
      # the check runs HARD on the head SHA that actually gets merged. When dedupe
      # finds nothing to change there is no second run, but then the lockfile was
      # already clean. Without the token the condition keeps the check hard: nothing
      # would fix the lockfile automatically, so a red run is the accurate state and
      # `pnpm resolve:dependabot <PR#>` is the documented path.
      # (2026-08-01 CI/CD audit §1.8.)
      - name: Check for duplicate dependencies
        if: github.actor != 'dependabot[bot]' || env.HAS_DEDUPE_FIXER != 'true'
        run: pnpm lint:dedupe

      # Guard: codecov.yml components + Sonar coverage-exclusions stay in sync
      # with the package set, so external quality gates can't silently drift (#732).
      - name: Check coverage scope
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        run: pnpm lint:coverage-scope

      # Every example with a playwright.config.ts must ship at least one spec —
      # a find+wc static check (scripts/check-e2e-specs.sh), so it belongs with
      # the other repo-global lints. It used to run in pre-commit ONLY, which a
      # bot push, `--no-verify` or a web edit all bypass: exactly the #813 class
      # that moved knip/publint/attw into CI. Cheap enough to sit ahead of knip.
      # (2026-08-01 CI/CD audit §4.3.)
      - name: Check e2e specs
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        run: pnpm lint:e2e

      # A rule written in a docblock AND in the package's own docs goes stale in
      # one of them and is believed anyway, because the stale copy sits next to
      # the code. Measured on the `UNSAFE_KEY` docblock, which had become a
      # second copy of INVARIANTS.md's hand-out section and disagreed with it on
      # the exempt-door count. A ratchet over a baseline, so only NEW restatement
      # fails; ~0.5 s, no build needed.
      - name: Check docblock/doc duplication
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        run: pnpm lint:doc-dup

      # One record, two questions about its own keys: a function that COUNTS with
      # `Object.keys` (own AND enumerable) and tests MEMBERSHIP with
      # `hasOwnProperty` (own only) or `in` (walks the chain) disagrees with
      # itself on the keys the count refuses to see, and two disjoint records
      # compare equal. Shipped three times — #1815, #2064, and the `shared/ssr`
      # site this guard found on its first run. A root script rather than a test
      # per package: a scan rooted in a package cannot see `shared/` (#1838), and
      # four copies of one predicate is the class it guards. ~0.6 s, no build.
      - name: Check membership predicates
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        run: pnpm lint:membership

      # EVERY repository-wide scan, in one step (#2241). A scan whose SUBJECT is
      # the whole tree cannot live behind a per-package cache key: turbo keys
      # core's `test` on core's own files, so a change in a SIBLING replays a
      # PASS and the scan never runs — and a scan that did not run is
      # indistinguishable from one that passed. Measured:
      # `captured-intrinsics-authority-1971` sat RED on `master` from #2236 to
      # #2240 while the pre-commit run on the breaking commit printed
      # `cache hit, replaying logs (no errors)`.
      #
      # This replaces three steps that covered three of TWELVE scans. Two of the
      # nine uncovered ones are not even in core — `target-predicate-authority-1834`
      # in `@real-router/react`, `core-union-mirror-authority-2091` in
      # `validation-plugin` — so "lift the core ones" would not have reached them.
      #
      # ⚠ CI as well as the hook, and that is not belt-and-braces: infrastructure
      # commits here use `--no-verify` routinely, so a hook-only scan gates only
      # whoever did not bypass it. `lint:anchors` was exactly that shape until
      # #2241, and a rotten anchor shipped in `c1020c885` on a replayed cache.
      #
      # ⚠ The list lives in `scripts/repo-wide-scans.json` and is proved COMPLETE
      # by `repo-scan-authority-2241`, which derives the set from the AST rather
      # than reading the list. One list, two consumers.
      - name: Run the repository-wide scans
        run: pnpm lint:repo-scans

      # Historiography in the Markdown corpus — the half no FORM ratchet reaches
      # (`comment-historiography-authority` and its count table scan
      # `packages/*/src` and `shared/` only, #2126). Reporting-only until #2129
      # cleared the 34 standing sites; a gate over an empty floor from here on.
      #
      # ⚠ Vale is INSTALLED rather than assumed, and the run sets
      # `VALE_REQUIRED=1`: `scripts/check-prose.sh` skips a missing binary so a
      # fresh clone is never wedged, and that same skip would make this job green
      # over a corpus it never read. The strict flag turns the skip into a
      # failure. Pin the version — a floor of zero is only meaningful against a
      # fixed rule engine.
      - name: Install Vale
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        env:
          VALE_VERSION: "3.20.0"
          VALE_SHA256: "f59e7030c5d4ace6cf915497d0d076a1699d61e876142765963237e6867c9712"
        run: |
          curl -fsSL -o /tmp/vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  /tmp/vale.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          sudo install -m 0755 /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Check Markdown prose
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        env:
          VALE_REQUIRED: "1"
        run: pnpm lint:prose

      # Dead-code / unused-export / unused-dependency detection (knip). Pure
      # source-graph analysis — no dist needed. Catches unused introduced by a PR
      # that turbo's affected filter scored as "nothing built". Previously
      # pre-push only (#813); the hard jscpd duplication threshold stays in the
      # hook — CI keeps the informational SARIF channel instead.
      - name: Check for unused code
        run: pnpm lint:unused

      # Unit-test the CI meta-layer itself (scripts/*.test.mjs — node:test
      # outside the turbo graph, so it runs here; several files import tooling
      # the setup step installs, such as typescript and eslint): the shard
      # planner (build-matrix.*) gating the leaf/sharded routing + input-aware
      # membership logic (#1067, R2.18), and the gate needs-completeness
      # meta-test (ci-gate-completeness.test.mjs) — every ci.yml job must feed
      # the CI Result gate or be allowlisted with a written reason (the #1127
      # class, debt-map axis A6).
      - name: Test CI meta (shard planner + gate completeness)
        if: env.DEPENDABOT_PR != 'true' && env.NO_SOURCE != 'true'
        run: node --test scripts/*.test.mjs

  # ============================================
  # PIPELINE-SHARDED: one runner per affected class (mode=sharded). The matrix
  # comes from check (R2.19); empty groups never enter matrix.include → their
  # runner is not spawned. core arrives from base-bundle / Remote Cache as a
  # HIT (not a rebuild). Coverage is a disjoint partition (turbo `test` has no
  # `^test`), so per-shard lcov never overlaps base-test's.
  # ============================================

  pipeline-sharded:
    name: Pipeline (shard ${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [check]
    # ⚠ An empty plan must be refused HERE. A matrix with no entries does not
    # skip the job: GitHub fails it without creating it, and `ci`, `smoke` and
    # `coverage` all read `skipped` as the empty-plan result. The planner emits
    # an empty `include` for a core-layer-only change, which base-* cover.
    if: >-
      needs.check.outputs.mode == 'sharded' &&
      needs.check.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix || '{"include":[]}') }}
    env:
      # Keeps the shards apart in turbo's telemetry (#1745).
      TURBO_TELEMETRY_JOB_SUFFIX: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch master for Turbo comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # matrix.filter is one or more `--filter=<pkg>` tokens. Route it through an
      # env var (no ${{ }} inside run: — keeps actionlint clean) and leave it
      # UNQUOTED so the shell word-splits multiple filters.
      #
      # Tests and bundling are SEPARATE invocations on purpose: tests need no
      # dists (turbo `test` has no `^bundle`), so they start immediately — the
      # shard no longer waits for base-bundle (`needs: [check]`). By the time
      # the tests finish, the parallel base-bundle job has published core#bundle
      # to the Remote Cache, so this shard's `bundle` (whose `^bundle` chain
      # reaches core) resolves it as a HIT. A lost race just re-executes the
      # upstream bundle here — a benign duplicate, never a failure.
      # `lint` explicit — see the note in pipeline-leaf's test step.
      - name: Test shard
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run test test:properties lint $SHARD_FILTER --filter='!./examples/**' --summarize

      - name: Bundle shard
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run bundle $SHARD_FILTER --filter='!./examples/**' --summarize

      # Per-task execution timings (.turbo/runs/*.json) — perf diagnostics to
      # localize which shard task dominates (e.g. solid#test vs react#test under
      # vite-plugin-solid's on-the-fly babel compile). if: always() so a failing
      # shard still uploads what ran.
      #
      # 90 days, the repository's maximum, not 1. At one day these are
      # per-run records you can read only while the run is still fresh. A
      # trend such as "is this shard slower than it was?" needs weeks of runs.
      # They are tens of KB each. The coverage/dist uploads below stay at
      # 1 day, because only downstream jobs of the SAME run consume them.
      - name: Upload turbo run summary (per-task timings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-summary-${{ matrix.name }}
          path: .turbo/runs/
          retention-days: 90

      - name: Validate shard published artifacts (publint + attw)
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run lint:package lint:types $SHARD_FILTER --filter='!./examples/**'

      - name: Fix coverage paths
        run: bash scripts/fix-lcov-paths.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ matrix.name }}
          path: packages/*/coverage/
          retention-days: 1

      # Only THIS shard's packages. `packages/*/dist/` also swept up everything
      # `^bundle` built upstream, so core's dist was uploaded once per shard and
      # `merge-multiple: true` overwrote the copies on download. `base-bundle`
      # still uploads the full set, so no consumer loses anything. (Audit §3.3.)
      # The lines are narrowed GLOBS (`packages/[rR]eact/dist/`), not plain paths:
      # that keeps a solo shard's artifact rooted at `packages/` too, which
      # `bundle-size`'s download into `packages/` relies on (#2359).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.distPaths }}
          retention-days: 1

  # ============================================
  # EXAMPLES: the dogfooding surface, previously validated by NOTHING on a PR.
  # `deriveAffected` drops example workspaces (they are not shardable and every
  # pipeline filters them out with `!./examples/**`), so an examples-only PR
  # produced `affected = []` → mode=leaf → a leaf filter resolving to zero tasks,
  # `built=false`, downstream skipped, gate green. pre-push and post-merge filter
  # them out too, so 139 runnable apps were covered only by the weekly
  # examples.yml — a break surfaced up to seven days late. This job closes that
  # with explicit `--filter=<pkg>` tokens for the examples the diff actually
  # EDITS — the planner intersects the routing query with `git diff --name-only`,
  # because the query set carries DEPENDENTS and every example depends on core.
  # Measured on PR #1642 before that intersection landed: 36 changed files under
  # packages/core, zero under examples/, and this job still ran 156 turbo tasks
  # for 5m23s — displacing base-test as the gate's critical path and pushing
  # CI Result out by ~2 minutes. `build` pulls `^bundle`, so the libs an example
  # resolves through dist arrive as Remote-Cache hits. Skipped — and
  # `ok()`-tolerated by the gate — whenever the diff touches no example, which is
  # most PRs. A library change that breaks an example stays the weekly
  # examples.yml's job, as before. (2026-08-01 CI/CD audit §4.2.) A change
  # outside the examples that is not a library change is `examples-lint`'s.
  # ============================================
  examples-build:
    name: Examples (affected)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.examples_filter != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Unquoted on purpose: the filter carries one `--filter=<pkg>` token per
      # affected example and must word-split, same pattern as $SHARD_FILTER.
      - name: Build affected examples
        env:
          EXAMPLES_FILTER: ${{ needs.check.outputs.examples_filter }}
        run: pnpm turbo run build $EXAMPLES_FILTER

  # ============================================
  # EXAMPLES LINT: what "Examples (affected)" cannot see (#2402). A change
  # OUTSIDE the examples and benchmarks/ — an ESLint bump in the lockfile, the
  # root eslint.config.mjs, turbo.json — edits none of them, so that job was
  # skipped while every one of their lints moved: #2395 merged green on a base
  # whose `lint:example` was red. `scripts/examples-lint-filter.mjs` takes the
  # set from turbo's own attribution and leaves out what the job above and
  # examples.yml cover.
  #
  # ⚠ This is the only arm that runs BEFORE a merge, and it has no Dependabot
  # skip on purpose: the incident is an ESLint bump going green here and then
  # failing every branch's pre-push, which lints the examples too.
  # ============================================
  examples-lint:
    name: Examples lint (outside changes)
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.examples_lint_filter != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Unquoted on purpose: one `--filter=<pkg>` token per workspace, word-split
      # like $EXAMPLES_FILTER above.
      - name: Lint examples and benchmarks
        env:
          EXAMPLES_LINT_FILTER: ${{ needs.check.outputs.examples_lint_filter }}
          EXAMPLES_LINT_REASONS: ${{ needs.check.outputs.examples_lint_reasons }}
        run: |
          echo "Reached from outside — turbo's reasons: $EXAMPLES_LINT_REASONS"
          pnpm turbo run lint:example lint:bench $EXAMPLES_LINT_FILTER

  # ============================================
  # DOWNSTREAM: Smoke, Coverage, Bundle Size
  # ============================================

  # Smoke test: pack all public packages, install from tarballs
  # into an isolated project, verify every export resolves.
  # Uses `bundle` (not `build`) — no test/lint overhead.
  smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    # smoke bundles every package (base-bundle + shards warm the cache) and
    # resolves exports — it needs BUNDLES, not test results, so it does NOT depend
    # on base-test. Dropping base-test lets smoke run in PARALLEL with the core
    # property-tests instead of serialized behind the heaviest job (~2-4 min
    # wall-clock on a sharded PR, #1130). Gating integrity is unchanged: the CI
    # Result gate still requires base-test == success independently (job `ci`).
    needs: [check, pipeline-leaf, base-bundle, pipeline-sharded]
    # Active path succeeded: leaf → pipeline-leaf; sharded → base-bundle
    # + all shards (empty matrix.include → pipeline-sharded 'skipped', carried by base-bundle).
    #
    # Not on a diff that holds no source — a release PR, where the tarballs are
    # packed from master's code and every assertion here (exports resolve, no
    # private package in `dependencies` (#413), no source shipped (#418), no
    # missing `dist`) is independent of the version being bumped (#2450). It is
    # also the wrong address: a `changeset-release/*` PR is regenerated from
    # master, so a failure there cannot be answered there.
    # ⚠ That leaves the packaging guard off the master → npm path entirely —
    # neither `post-merge.yml` nor `changesets.yml` runs it. Its home in front of
    # the irreversible step is a separate issue.
    if: >-
      always() &&
      needs.check.outputs.should_run == 'true' &&
      needs.check.outputs.no_source != 'true' &&
      (
        (needs.check.outputs.mode == 'leaf' &&
          needs.pipeline-leaf.result == 'success') ||
        (needs.check.outputs.mode == 'sharded' &&
          needs.base-bundle.result == 'success' &&
          (needs.pipeline-sharded.result == 'success' || needs.pipeline-sharded.result == 'skipped'))
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # bundle (not build) — only tsdown, no test/lint/type-check.
      # Affected + upstream → remote cache from pipeline.
      # Non-affected → remote cache from previous CI runs.
      - name: Bundle all packages
        run: pnpm turbo run bundle --filter='./packages/*'

      - name: Run smoke test
        run: bash scripts/smoke-test-packages.sh

  # Code duplication — INFORMATIONAL ONLY, never blocks the merge.
  # The hard duplication gate stays in the pre-push hook (`pnpm lint:duplicates`,
  # threshold 2% in `.jscpd.json`). This job re-runs jscpd with the SARIF reporter
  # and `-t 100` (so jscpd itself always exits 0) and uploads the report to GitHub
  # Code Scanning — duplication then surfaces as PR annotations + Security-tab
  # entries without gating CI. NOT in the `ci` gate's `needs`, so it can't block.
  #
  # ⚠ That last sentence was aspirational for the channel's whole first year:
  # eighteen analyses uploaded `results_count: 8` and produced ZERO alerts,
  # because jscpd's paths were relative to its own scan roots (#2154). Fixed by
  # jscpd 5.1.1+, which emits `uriBaseId` + `originalUriBaseIds`; kept fixed by
  # the resolution check below.
  duplication:
    name: Code Duplication (SARIF)
    needs: [check]
    # Not on a Dependabot PR: a bump duplicates no source (IMPLEMENTATION_NOTES
    # "Dependabot PRs skip every metric"). Nor on a diff that holds no source at
    # all — a release PR, where this would rescan master's code (#2433).
    if: >-
      needs.check.outputs.should_run == 'true' &&
      needs.check.outputs.no_source != 'true' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # jscpd only reads packages/*/src/ + shared/ and has NO workspace-package
      # deps — its engine ships as a platform binary via optionalDependencies
      # (cpd-<arch>). So skip the full 32-package `pnpm install` (~30-60s on a
      # store cache-miss, #734) and fetch only jscpd via dlx (hardlinked from the
      # setup-node pnpm store cache). The version is read from package.json so a
      # Dependabot jscpd bump can't drift. Args mirror the root
      # `lint:duplicates:sarif` script (-t 100 = threshold 100 so jscpd always
      # exits 0 — this job is informational, it only uploads SARIF to Code
      # Scanning, never gates).
      #
      # `shared/` is part of the scan set: #1523 added it to close the
      # cross-boundary duplication blind spot (shared sources are symlinked into
      # 10 published packages), but only in the npm scripts — this inline command
      # kept the pre-#1523 scope until 2026-08-01, so the CI SARIF channel was
      # still blind to exactly what #1523 paid for. Keep the two in sync.
      # (2026-08-01 CI/CD audit §4.1.)
      - name: Detect duplication (SARIF)
        run: |
          jscpd_version="$(node -p "require('./package.json').devDependencies.jscpd")"
          pnpm dlx "jscpd@${jscpd_version}" packages/*/src/ shared/ --no-tips -t 100 -r sarif -o jscpd-report

      # #2154: this channel spent eighteen analyses uploading `results_count: 8`
      # and producing ZERO alerts. jscpd scans eight roots, and up to 5.0.16 its
      # report gave every uri relative to its OWN root (`index.ts`, `types.ts`),
      # which GitHub resolves against the repository root, fails to find, and
      # drops. Nothing in the job could see it: the scan exits 0, the upload
      # exits 0, and the alert count lives in an API this job never calls.
      #
      # So resolve the paths here, by GitHub's own rule, before handing the file
      # over. Pure stdlib on purpose — this job deliberately skips `pnpm
      # install` (see above), so the guard must not need node_modules.
      # No `continue-on-error`: this job is already outside the `ci` gate's
      # `needs`, so a red step here is loud and still blocks nothing — which is
      # exactly the trade a guard against SILENCE wants. The upload below keeps
      # `if: always()`, so a failing check reports the breakage without also
      # withholding the report.
      - name: Verify SARIF paths resolve in this repository
        run: node scripts/check-sarif-paths.mjs jscpd-report/jscpd-report.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: jscpd-report/jscpd-report.sarif
          category: jscpd

  coverage:
    name: Coverage (Codecov)
    needs: [check, pipeline-leaf, base-bundle, base-test, base-coverage, pipeline-sharded]
    # Skipped on a Dependabot PR, which changes manifests and the lockfile but
    # never a covered line (IMPLEMENTATION_NOTES "Dependabot PRs skip every
    # metric"), and on any diff that holds no source — a release PR uploads the
    # lcov the shards just produced from master's code (#2433). `ci` reads
    # either skip through `ok`.
    if: >-
      always() &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.check.outputs.no_source != 'true' &&
      needs.check.outputs.should_run == 'true' &&
      (
        (needs.check.outputs.mode == 'leaf' &&
          needs.pipeline-leaf.result == 'success' &&
          needs.pipeline-leaf.outputs.built == 'true') ||
        (needs.check.outputs.mode == 'sharded' &&
          needs.base-bundle.result == 'success' &&
          needs.base-test.result == 'success' &&
          (needs.pipeline-sharded.result == 'success' || needs.pipeline-sharded.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read # listWorkflowRunArtifacts for the R2.4 integrity check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Node for the --emit script (fs-only, no pnpm install) instead of
      # relying on the runner image's system node.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Merge every per-path coverage artifact into one tree: leaf emits a single
      # `coverage-reports-leaf`; sharded emits `coverage-reports-base` + one
      # `coverage-reports-<shard>` each. Coverage is a disjoint partition (turbo
      # `test` has no `^test`), so no lcov collides on merge.
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-reports-*
          merge-multiple: true
          path: packages

      # R2.4: a silently-lost shard upload would understate coverage and mask a
      # gap. Assert every expected coverage artifact exists (base + one per shard).
      - name: Verify all coverage shards uploaded
        if: needs.check.outputs.mode == 'sharded'
        uses: actions/github-script@v9
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        with:
          script: |
            const include = JSON.parse(process.env.MATRIX).include;
            const expected = ['coverage-reports-base', ...include.map((s) => `coverage-reports-${s.name}`)];
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const present = new Set(data.artifacts.map((a) => a.name));
            const missing = expected.filter((n) => !present.has(n));
            if (missing.length) core.setFailed(`Missing coverage artifacts: ${missing.join(', ')}`);

      # Collect every produced lcov dynamically — a hardcoded `files:` list drifts
      # out of sync as packages are added (#732): it had 16 stale paths (several
      # private) and missed ~14 public packages. The scope comes from the same
      # script that guards codecov.yml/sonar-project.properties (--emit mode),
      # so the CI scope and the drift guard cannot disagree. The script fails
      # loudly if no lcov.info exists after the artifact download.
      - name: Collect coverage reports
        id: lcov
        run: node scripts/check-coverage-scope.mjs --emit >> "$GITHUB_OUTPUT"

      # The TRANSPORT to Codecov is an external dependency — the action downloads
      # its uploader binary and verifies a GPG signature against a keyserver — and
      # this job is a HARD requirement of the single required gate (`ok "$COVERAGE"`
      # in the `ci` job). So a keyserver outage turned a green codebase red:
      # run 30237995762 (PR #1562) died with `gpg: no valid OpenPGP data found` →
      # `Coverage (Codecov)` failed → `CI Result` failed, while all ten shards,
      # base-test, smoke and repo-lints were green.
      #
      # `continue-on-error` puts the transport outside the merge decision WITHOUT
      # softening what actually protects coverage: `fail_ci_if_error` stays on, so a
      # failed upload is still reported (visible as a tolerated failure, not a silent
      # pass); the R2.4 integrity guard above ("Verify all coverage shards uploaded")
      # stays HARD, so a silently-lost shard still reds the gate; and the 100 %
      # thresholds are enforced by vitest inside each test job, not by this upload.
      # What is lost is dashboard freshness on a Codecov outage — not a gate.
      # (2026-08-01 CI/CD audit §1.7.)
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.lcov.outputs.reports }}
          disable_search: true
          fail_ci_if_error: true

  bundle-size:
    name: Bundle Size
    # bundle-size starts from dist artifacts (dist-base + dist-<shard>) plus a
    # cache-fill bundle — base-test produces NO dist (coverage only), so it does
    # not belong on this job's path. Same class as smoke (#1130); the win here is
    # an earlier PR size comment, not gate wall-clock (bundle-size is not in the
    # `ci` gate). coverage DOES keep base-test — it consumes its
    # coverage-reports-base artifact.
    #
    # Skipped on a Dependabot PR: no published package has a third-party
    # runtime dependency, so only a bundler bump could move a size, and that
    # case is accepted as rare (IMPLEMENTATION_NOTES "Dependabot PRs skip every
    # metric"). Skipped on a diff that holds no source for a stronger reason
    # than rarity: nothing inlines a version into a bundle, so on a release PR
    # the bytes are master's bytes and the delta is zero by construction (#2450).
    needs: [check, pipeline-leaf, base-bundle, pipeline-sharded]
    if: >-
      always() &&
      needs.check.outputs.should_run == 'true' &&
      needs.check.outputs.no_source != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (
        (needs.check.outputs.mode == 'leaf' &&
          needs.pipeline-leaf.result == 'success' &&
          needs.pipeline-leaf.outputs.built == 'true') ||
        (needs.check.outputs.mode == 'sharded' &&
          needs.base-bundle.result == 'success' &&
          (needs.pipeline-sharded.result == 'success' || needs.pipeline-sharded.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read # gh run list/download of the master bundle-size artifact (#734)
    steps:
      # ── PR sizes: start from pipeline's dist artifact (affected + upstream),
      #    then fill in non-affected packages from turbo remote cache so
      #    size-limit sees every dist/. Symmetric with the base-branch step
      #    below (`pnpm turbo run bundle --filter='./packages/*'`).
      - name: Checkout PR
        uses: actions/checkout@v7

      # Merge dist from whichever path ran (dist-leaf OR dist-base + dist-<shard>);
      # the cache-fill bundle step below fills any non-affected packages.
      - name: Download PR dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: packages

      - name: Setup (pnpm + Node + install)
        uses: ./.github/actions/setup

      # Fill in dist/ for packages that pipeline skipped (non-affected).
      # Affected packages already have dist from the downloaded artifact;
      # everything else is a turbo remote-cache hit.
      - name: Bundle remaining packages (cache-hit for non-affected)
        run: pnpm turbo run bundle --filter='./packages/*'

      # size-limit exits non-zero when a limit is exceeded but still prints the
      # JSON report, so the exit code is not the signal here — the report is. On a
      # CONFIG error it prints `{"error": …}` to that same stdout: valid JSON, but
      # an object, so a `${output:-[]}` guard passes it straight through and the
      # comparator below throws on `.filter`. Same shape as post-merge.yml's base
      # measurement: keep stderr in the log, and announce an unusable report.
      - name: Get PR sizes
        id: pr_sizes
        run: |
          npx size-limit --json > pr-bundle-sizes.json || true
          if ! node -e 'const r = JSON.parse(require("fs").readFileSync("pr-bundle-sizes.json", "utf8")); if (!Array.isArray(r) || r.length === 0) process.exit(1)' 2>/dev/null; then
            echo "::warning title=PR bundle sizes unavailable::size-limit produced no usable report (see this step's log) — the size table will show every package as removed"
            echo '[]' > pr-bundle-sizes.json
          fi
          echo "sizes<<EOF" >> $GITHUB_OUTPUT
          cat pr-bundle-sizes.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── Base sizes: master's sizes as post-merge.yml publishes them (#734), for
      #    the commit this PR's sizes were built on — the first parent of the
      #    merge commit checked out above. scripts/bundle-size-base.mjs picks the
      #    run by that commit, falls back to its closest built ancestor, and
      #    otherwise reports no base instead of diffing; it writes `sizes` and
      #    the line the report opens with, `note` (#2396).
      - name: Download base sizes from master
        id: base_sizes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/bundle-size-base.mjs

      # Both size payloads arrive through `env:`, never spliced into the script
      # body. `JSON.parse(\`${{ … }}\`)` embedded the values in a JS TEMPLATE
      # LITERAL, so a backtick or `${` anywhere in them changed the program: the
      # names come from .size-limit.js (a file any PR can edit) and the base
      # payload from a downloaded artifact. Failure mode ranged from a syntax
      # error to executing attacker-shaped JS with this job's `pull-requests:
      # write` token. actionlint does not flag it — `steps.*.outputs.*` is not in
      # its untrusted-input list — so nothing else would have caught the drift.
      # (2026-08-01 CI/CD audit §1.5.)
      - name: Compare and comment
        uses: actions/github-script@v9
        env:
          PR_SIZES: ${{ steps.pr_sizes.outputs.sizes }}
          BASE_SIZES: ${{ steps.base_sizes.outputs.sizes }}
          BASE_NOTE: ${{ steps.base_sizes.outputs.note }}
        with:
          script: |
            // Both inputs are guarded at their source, but parse defensively here
            // too: size-limit's error payload is an OBJECT, and every use below
            // assumes an array.
            const asRows = (raw) => {
              try {
                const parsed = JSON.parse(raw || '[]');
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            };
            const prSizes = asRows(process.env.PR_SIZES);
            const baseSizes = asRows(process.env.BASE_SIZES);

            const formatBytes = (bytes) => {
              if (bytes == null || isNaN(bytes)) return '—';
              if (bytes === 0) return '0 B';
              const sign = bytes < 0 ? '-' : '';
              const abs = Math.abs(bytes);
              const k = 1000; // SI units (same as size-limit: 1 kB = 1000 bytes)
              const sizes = ['B', 'KB', 'MB'];
              const i = Math.floor(Math.log(abs) / Math.log(k));
              return sign + parseFloat((abs / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const formatDiff = (pr, base) => {
              if (pr == null || isNaN(pr)) return '—';
              if (!base || isNaN(base)) return 'new';
              const diff = pr - base;
              const percent = base > 0 ? ((diff / base) * 100).toFixed(1) : 0;
              if (diff === 0) return '0';
              const sign = diff > 0 ? '+' : '';
              return `${sign}${formatBytes(diff)} (${sign}${percent}%)`;
            };

            const baseMap = new Map();
            for (const item of baseSizes) {
              baseMap.set(item.name, item.size);
            }

            let rows = [];
            let totalPr = 0;
            let totalBase = 0;
            let hasChanges = false;

            for (const item of prSizes) {
              const prSize = item.size ?? 0;
              const baseSize = baseMap.get(item.name) ?? 0;
              totalPr += isNaN(prSize) ? 0 : prSize;
              totalBase += isNaN(baseSize) ? 0 : baseSize;

              const diff = (isNaN(prSize) ? 0 : prSize) - (isNaN(baseSize) ? 0 : baseSize);
              if (diff !== 0) hasChanges = true;

              const status = item.passed === false ? '❌' : '✅';
              rows.push(`| ${status} | ${item.name} | ${formatBytes(item.size)} | ${formatBytes(baseMap.get(item.name))} | ${formatDiff(item.size, baseMap.get(item.name))} |`);
            }

            let body = `## Bundle Size Report\n\n`;

            // What the sizes are diffed against — a commit, a run and a distance,
            // or why there is no base (#2396).
            if (process.env.BASE_NOTE) {
              body += `${process.env.BASE_NOTE}\n\n`;
            }

            if (prSizes.length === 0) {
              body += `Could not measure bundle sizes.\n`;
            } else {
              body += `| Status | Package | PR Size | Base Size | Diff |\n`;
              body += `|--------|---------|---------|-----------|------|\n`;
              body += rows.join('\n');
              body += `\n\n`;

              const totalDiff = totalPr - totalBase;
              const totalPercent = totalBase > 0 ? ((totalDiff / totalBase) * 100).toFixed(1) : 0;
              const totalSign = totalDiff > 0 ? '+' : '';

              body += `**Total:** ${formatBytes(totalPr)} (${totalSign}${formatBytes(totalDiff)}, ${totalSign}${totalPercent}%)\n\n`;

              if (!hasChanges) {
                body += `No size changes detected.\n`;
              }

              const failures = prSizes.filter(s => s.passed === false);
              if (failures.length > 0) {
                body += `\n**Size limit exceeded for:** ${failures.map(f => f.name).join(', ')}\n`;
              }
            }

            body += `\n<details><summary>Size limits configured in <code>.size-limit.js</code></summary>\n\n`;
            body += `Run \`pnpm size\` locally to check bundle sizes.\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Bundle Size Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            core.summary.addRaw(body).write();

  # ============================================
  # WORKFLOW LINT: actionlint — runs on EVERY PR (no should_run gate)
  # Closes the gap (#733) where a PR touching only .github/workflows/*.yml sets
  # should_run=false → pipeline/smoke/sonar skip → the highest-risk code class
  # (executable workflows with secret/publish access) merged with ZERO automated
  # validation. Pinned by digest (rhysd/actionlint 1.7.8); the image bundles
  # shellcheck + pyflakes, so it also catches shell bugs in `run:` blocks.
  # SHELLCHECK_OPTS=--severity=warning drops the benign SC2086/SC2001 info/style
  # noise on `>> $GITHUB_OUTPUT`-style writes while keeping warnings, errors, and
  # actionlint's own expression/script-injection checks gating. Result is folded
  # into "CI Result" below so the single required check covers it.
  # ============================================
  actionlint:
    name: Lint Workflows (actionlint)
    # Skipped on a Dependabot PR; `ci` counts that skip as a pass there only.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:96d4a8c87dbbfb3bdd324f8fdc285fc3df5261e2decc619a4dd7e8ee52bbfd46
        with:
          args: -color
        env:
          SHELLCHECK_OPTS: --severity=warning

  # ============================================
  # SONAR, for a pull request from THIS repository (#2442). The analysis needs
  # only the coverage artifacts, which are ready when the pipeline's test jobs
  # are — about 122 s in — so running it here overlaps it with the tail of CI
  # instead of appending it. Measured: the verdict lands at ~122 + 97 s through
  # `sonar-trusted.yml`, against ~180 s from here.
  #
  # ⚠ A fork's run has no secrets, so `SONAR_TOKEN` is absent there and the scan
  # dies at "Secret source: None" (#1868, measured on #1857). That path stays on
  # `sonar-trusted.yml`, whose gate carries the mirror condition. The two are
  # mutually exclusive by the head repository, and `sonar-producer.test.mjs`
  # refuses a state where both or neither would produce.
  #
  # ⚠ The job is NOT named `SonarCloud` and does not rely on its own check run.
  # `SonarCloud` is a required context in `protect-master`, and a skipped job on
  # the fork path would put a second entry under that name beside the status the
  # trusted workflow posts. This job POSTS the status, exactly as the gate does,
  # so the context has one producer whichever path a pull request takes.
  #
  # ⚠ `if: always()` and only the head-repository test: every other condition is
  # decided INSIDE, because a context nobody produces blocks the pull request
  # forever. A skip here is a posted success with a reason, never an absence.
  # ============================================
  sonar:
    name: Sonar (same-repository PR)
    needs:
      [
        check,
        pipeline-leaf,
        base-bundle,
        base-test,
        base-coverage,
        pipeline-sharded,
      ]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # The three arms `sonar-trusted.yml`'s gate decides from artifacts, decided
      # here from what `check` already published — same verdicts, no API calls.
      - name: Decide whether there is anything to analyse
        id: decide
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CHECK: ${{ needs.check.result }}
          NO_SOURCE: ${{ needs.check.outputs.no_source }}
          SHOULD_RUN: ${{ needs.check.outputs.should_run }}
          MODE: ${{ needs.check.outputs.mode }}
          LEAF: ${{ needs.pipeline-leaf.result }}
          LEAF_BUILT: ${{ needs.pipeline-leaf.outputs.built }}
          BASE_BUNDLE: ${{ needs.base-bundle.result }}
          BASE_TEST: ${{ needs.base-test.result }}
          BASE_COV: ${{ needs.base-coverage.result }}
          SHARDED: ${{ needs.pipeline-sharded.result }}
        run: |
          set -euo pipefail

          verdict() {
            echo "analyse=false" >> "$GITHUB_OUTPUT"
            echo "why=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A bump changes manifests and the lockfile, never a line this reads
          # (IMPLEMENTATION_NOTES "Dependabot PRs skip every metric").
          [[ "$AUTHOR" == "dependabot[bot]" ]] && verdict "Not analysed: dependabot"

          # ⚠ Every arm below reads an OUTPUT of `check`, and a job that did not
          # succeed publishes the empty string rather than `false` — so the state
          # of the pipeline is settled first, from job RESULTS, which are
          # readable whatever happened. Measured before this arm existed: with
          # `check` failed, `should_run` was empty and a pull request of nothing
          # but source was told "docs or CI only" (#2441).
          for result in "$CHECK" "$LEAF" "$BASE_BUNDLE" "$BASE_TEST" "$BASE_COV" "$SHARDED"; do
            if [[ "$result" == "failure" ]]; then
              verdict "Not analysed: CI failed"
            fi
          done

          # Separate from a failure, and separate from "no coverage produced":
          # a cancelled run is usually the concurrency group retiring a commit
          # that a newer push replaced.
          for result in "$CHECK" "$LEAF" "$BASE_BUNDLE" "$BASE_TEST" "$BASE_COV" "$SHARDED"; do
            if [[ "$result" == "cancelled" ]]; then
              verdict "Not analysed: CI cancelled"
            fi
          done

          # The same predicate `coverage` and `duplication` consult (#2433).
          [[ "$NO_SOURCE" == "true" ]] && verdict "Not analysed: no source changed"

          [[ "$SHOULD_RUN" != "true" ]] && verdict "Not analysed: docs or CI only"

          # No coverage means the pipeline built nothing to analyse — the arm the
          # gate reaches by counting `coverage-reports-*` artifacts.
          case "$MODE" in
            leaf)
              [[ "$LEAF" == "success" && "$LEAF_BUILT" == "true" ]] \
                || verdict "Not analysed: no coverage produced" ;;
            sharded)
              { [[ "$BASE_BUNDLE" == "success" ]] \
                && [[ "$BASE_TEST" == "success" ]] \
                && [[ "$BASE_COV" == "success" ]] \
                && { [[ "$SHARDED" == "success" ]] || [[ "$SHARDED" == "skipped" ]]; }; } \
                || verdict "Not analysed: no coverage produced" ;;
            *)
              verdict "Not analysed: no shard plan" ;;
          esac

          echo "analyse=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.decide.outputs.analyse == 'true'
        uses: actions/checkout@v7
        with:
          # Sonar blames the changed lines; a shallow tree has nothing to blame.
          fetch-depth: 0

      # Pin Node for the `node -p` version read and the --emit scope script
      # (fs-only, no pnpm install) instead of relying on the runner's system node.
      - name: Setup Node.js
        if: steps.decide.outputs.analyse == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Same per-path coverage merge as the Codecov job (leaf single artifact OR
      # base + per-shard). check-coverage-scope --emit rescans after the merge.
      - name: Download coverage artifacts
        if: steps.decide.outputs.analyse == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-reports-*
          merge-multiple: true
          path: packages

      - name: Cache SonarCloud packages
        if: steps.decide.outputs.analyse == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Get version from core package
        id: version
        if: steps.decide.outputs.analyse == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./packages/core/package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Generate analysis scope from the filesystem (#732) — the same
      # `check-coverage-scope.mjs --emit` that guards codecov.yml and
      # sonar-project.properties, so the CI scope and the drift guard cannot
      # disagree. Scanner CLI args override the properties file.
      - name: Compute Sonar scope
        id: scope
        if: steps.decide.outputs.analyse == 'true'
        run: node scripts/check-coverage-scope.mjs --emit >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        id: scan
        if: steps.decide.outputs.analyse == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.sources=${{ steps.scope.outputs.sources }}
            -Dsonar.tests=${{ steps.scope.outputs.tests }}
            -Dsonar.javascript.lcov.reportPaths=${{ steps.scope.outputs.reports }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ⚠ `always()`: this step IS the required context. A scan that fails, a
      # step that dies and a verdict of "nothing to analyse" all have to end in a
      # posted status — the rule `sonar-trusted.yml` states for its own paths.
      - name: Report the verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ANALYSE: ${{ steps.decide.outputs.analyse }}
          WHY: ${{ steps.decide.outputs.why }}
          SCAN: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail

          if [[ "$ANALYSE" != "true" ]]; then
            STATE=success
            DESC="${WHY:-Not analysed}"
          elif [[ "$SCAN" == "success" ]]; then
            STATE=success
            DESC='Quality gate passed'
          else
            STATE=failure
            DESC="Quality gate failed or the scan could not run (${SCAN:-unknown})"
          fi

          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context=SonarCloud \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ============================================
  # GATE: Single required status check
  # Configure "CI Result" in branch protection
  # ============================================

  ci:
    name: CI Result
    runs-on: ubuntu-latest
    # ⚠ Sonar is not a job in this file and not on this gate's path.
    # `sonar-trusted.yml` analyses the PR once this workflow completes and posts
    # the verdict to the head SHA, where it gates on its own: the
    # `protect-master` ruleset lists "SonarCloud" as a required status check
    # beside "CI Result" / "Require Changeset" / "Validate Changesets" /
    # "Dependency Review". So a red quality gate blocks the merge without its
    # ~90s scan sitting on this job's critical path.
    needs: [check, pipeline-leaf, base-bundle, base-test, base-lint, base-coverage, base-properties, pipeline-sharded, repo-lints, smoke, coverage, actionlint, examples-build, examples-lint]
    if: always()
    steps:
      - name: Determine result
        env:
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          # actionlint runs on every PR but Dependabot's (no should_run gate), so
          # check it before the docs/CI-only short-circuit — that's the whole point
          # of #733: a workflow-only PR must not pass the gate without workflow
          # validation. A Dependabot workflow change is a `uses:` ref; its skip
          # counts as a pass there and nowhere else (IMPLEMENTATION_NOTES
          # "Dependabot PRs skip every metric").
          ACTIONLINT="${{ needs.actionlint.result }}"
          if [[ "$ACTIONLINT" == "skipped" && "$DEPENDABOT_PR" == "true" ]]; then
            ACTIONLINT="success"
          fi
          if [[ "$ACTIONLINT" != "success" ]]; then
            echo "❌ actionlint failed (workflow lint)"
            exit 1
          fi

          # check must have SUCCEEDED before ANY of its outputs can be trusted.
          # A check that dies before the change-detection step writes should_run
          # (transient checkout/diff failure) leaves should_run empty — which the
          # docs-only short-circuit below would otherwise read as a green skip,
          # passing this required gate while check is RED and every functional job
          # was skipped (vacuous pass, #1133). Placed before the short-circuit so
          # the empty-output case is caught; also subsumes the old "plan step
          # died" case (check.result=failure either way).
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "❌ check job failed — cannot trust its outputs (mode/should_run)"
            exit 1
          fi

          if [[ "${{ needs.check.outputs.should_run }}" != "true" ]]; then
            echo "✅ Skipped — no code changes (actionlint passed)"
            exit 0
          fi

          PLAN="${{ needs.check.result }}"
          MODE="${{ needs.check.outputs.mode }}"
          LEAF="${{ needs.pipeline-leaf.result }}"
          BASE_BUNDLE="${{ needs.base-bundle.result }}"
          BASE_TEST="${{ needs.base-test.result }}"
          BASE_LINT="${{ needs.base-lint.result }}"
          BASE_COV="${{ needs.base-coverage.result }}"
          BASE_PROPS="${{ needs.base-properties.result }}"
          SHARDED="${{ needs.pipeline-sharded.result }}"
          SMOKE="${{ needs.smoke.result }}"
          COVERAGE="${{ needs.coverage.result }}"
          LINTS="${{ needs.repo-lints.result }}"
          EXAMPLES="${{ needs.examples-build.result }}"
          EXAMPLES_LINT="${{ needs.examples-lint.result }}"
          echo "plan=$PLAN mode=$MODE leaf=$LEAF base_bundle=$BASE_BUNDLE base_test=$BASE_TEST base_lint=$BASE_LINT base_cov=$BASE_COV base_props=$BASE_PROPS sharded=$SHARDED smoke=$SMOKE coverage=$COVERAGE lints=$LINTS examples=$EXAMPLES examples_lint=$EXAMPLES_LINT"

          # Defensive belt-and-suspenders on the shard-plan output (R2.19): the
          # check-result guard at the top of this step already exits on any check
          # failure (#1133), so this is now redundant — kept as a cheap guard.
          if [[ "$PLAN" != "success" ]]; then
            echo "❌ check / shard plan failed"
            exit 1
          fi

          # ok(): success OR skipped. Used ONLY for smoke/coverage (they
          # legitimately skip on a built==false leaf, and coverage on every
          # Dependabot PR) and an empty-include
          # pipeline-sharded — NEVER for the job that DEFINES the active path
          # (pipeline-leaf / base-bundle + base-test + base-properties), so a real failure there
          # cannot be masked as a skip.
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }

          case "$MODE" in
            leaf)
              [[ "$LEAF" == "success" ]] && PATH_OK=1 || PATH_OK=0 ;;
            sharded)
              { [[ "$BASE_BUNDLE" == "success" ]] && [[ "$BASE_TEST" == "success" ]] && [[ "$BASE_LINT" == "success" ]] && [[ "$BASE_COV" == "success" ]] && [[ "$BASE_PROPS" == "success" ]] && ok "$SHARDED"; } && PATH_OK=1 || PATH_OK=0 ;;
            *)
              echo "❌ unknown shard-plan mode '$MODE'"
              exit 1 ;;
          esac

          # repo-lints runs on every should_run PR in BOTH modes — past the
          # should_run short-circuit above it must have run AND passed (hard
          # requirement, not ok()-skippable like smoke/sonar).
          # examples-build is ok()-skippable: it runs only when a PR touches an
          # example, which most PRs do not. When it DOES run, a failure is hard.
          # examples-lint likewise: it runs only when a change reaches the
          # examples or benchmarks from outside them (#2402).
          if [[ "$PATH_OK" == "1" ]] && [[ "$LINTS" == "success" ]] && ok "$SMOKE" && ok "$COVERAGE" && ok "$EXAMPLES" && ok "$EXAMPLES_LINT"; then
            echo "✅ All checks passed"
            exit 0
          fi

          echo "❌ CI failed"
          exit 1
