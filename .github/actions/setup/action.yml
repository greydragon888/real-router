name: Setup
description: Shared CI setup — pnpm, Node (from `.nvmrc`), and a pnpm install.
  Centralises the block repeated across every build job so the Node version /
  cache / install flags live in one place. The caller must run actions/checkout
  first (a local composite action needs the repo present to be resolved — and
  `node-version-file` needs `.nvmrc` on disk).
inputs:
  install-args:
    description: Arguments passed to `pnpm install` (e.g. `--frozen-lockfile --ignore-scripts`).
    required: false
    default: "--frozen-lockfile"
  node-cache:
    description:
      Value for actions/setup-node's `cache` input. Default "pnpm" restores the
      pnpm store from GitHub's cache backend — right for ephemeral GitHub-hosted
      runners. Pass "" to skip the restore/save entirely on persistent
      self-hosted runners, where the local store + node_modules survive between
      runs and the ~200 MB tarball download is pure network overhead
      (codspeed.yml does this).
    required: false
    default: "pnpm"
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      # Kept in lockstep with the workflows' pin by hand until 2026-08-01: this
      # file was outside Dependabot's scan (see the `directories` note in
      # dependabot.yml), so it sat on v6 while every workflow moved to v7 in
      # #1531. Now covered — Dependabot bumps it with the rest.
      uses: actions/setup-node@v7
      with:
        # Read from `.nvmrc` (repo root, resolved against GITHUB_WORKSPACE) so
        # the major CI runs and the major a dev machine selects cannot drift —
        # they did, and it cost ten days of a locally-red / CI-green test suite
        # (IMPLEMENTATION_NOTES "`.nvmrc` as the Node single source of truth").
        # Safe here because every caller checks out first, as documented above.
        node-version-file: .nvmrc
        cache: ${{ inputs.node-cache }}

    - name: Install dependencies
      shell: bash
      # Unquoted on purpose: install-args may carry multiple flags that must
      # word-split (e.g. `--frozen-lockfile --ignore-scripts`).
      run: pnpm install ${{ inputs.install-args }}
