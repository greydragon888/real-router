name: Setup
description: Shared CI setup — pnpm, Node (from `.nvmrc`), and a pnpm install.
  Centralises the block repeated across every build job so the Node version /
  cache / install flags live in one place. The caller must run actions/checkout
  first (a local composite action needs the repo present to be resolved — and
  `node-version-file` needs `.nvmrc` on disk).
inputs:
  install-args:
    description: Arguments passed to `pnpm install` (e.g. `--frozen-lockfile --ignore-scripts`).
    required: false
    default: "--frozen-lockfile"
  node-cache:
    description:
      Value for actions/setup-node's `cache` input. Default "pnpm" restores the
      pnpm store from GitHub's cache backend — right for ephemeral GitHub-hosted
      runners. Pass "" to skip the restore/save entirely on persistent
      self-hosted runners, where the local store + node_modules survive between
      runs and the ~200 MB tarball download is pure network overhead
      (codspeed.yml does this).
    required: false
    default: "pnpm"
  working-directory:
    description:
      Directory, relative to the repository root, that `pnpm install` runs
      in. Default "." installs the root workspace; a workspace of its own
      (cross-router-bench) passes its directory and installs only that.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Install pnpm
      # ⚠ Pinned to the exact minor, not the floating `v6` the other actions use:
      # pnpm 12 support landed in v6.1.0, and upstream has NOT moved the `v6` tag
      # to it (both resolve to a commit — `v6` to v6.0.10's, v6.1.0 to its own).
      # A `v6` call-site therefore installs a launcher that cannot bootstrap a
      # pnpm 12 pin, and the failure would surface on the setup step of every job
      # the day `packageManager` moves. v6.1.0 keeps the v11-and-earlier bootstrap
      # path unchanged, so it is a no-op until then. Dependabot bumps it from here.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      # Kept in lockstep with the workflows' pin by hand until 2026-08-01: this
      # file was outside Dependabot's scan (see the `directories` note in
      # dependabot.yml), so it sat on v6 while every workflow moved to v7.
      # Now covered — Dependabot bumps it with the rest.
      uses: actions/setup-node@v7
      with:
        # Read from `.nvmrc` (repo root, resolved against GITHUB_WORKSPACE) so
        # the major CI runs and the major a dev machine selects cannot drift —
        # they did, and it cost ten days of a locally-red / CI-green test suite
        # (IMPLEMENTATION_NOTES "`.nvmrc` as the Node single source of truth").
        # Safe here because every caller checks out first, as documented above.
        node-version-file: .nvmrc
        cache: ${{ inputs.node-cache }}

    - name: Stamp CI identity for turbo telemetry
      # Resource attributes for turbo's OTLP metrics. Only a workflow
      # that sets TURBO_EXPERIMENTAL_OTEL_ENDPOINT exports, so elsewhere this is
      # inert. Every value is bounded: the job plus its matrix suffix, the
      # event, the class of actor, the runner kind, the CPU model and the Node
      # version. A run id would make every run write new series.
      #
      # `ci.cpu` separates the hosted runners' hardware: a job's speed splits
      # into two populations, and without the model a slow draw reads as a
      # regression. It sits under `ci.*` because the collector turns only
      # `ci.*` and `process.runtime.version` into labels. The model is reduced
      # to `[A-Za-z0-9._-]`, since a comma or `=` in it would split the list.
      # The matrix suffix is reduced the same way: it comes from a job's env,
      # and a line break in it would start a variable of its own here.
      #
      # `ci.actor` tells a Dependabot run from a human one, which share the
      # `pr` series otherwise. It is the class of `GITHUB_ACTOR`, not the
      # login, which would add series for every contributor. The actor is who
      # started the run, and it also picks the secret store: a Dependabot PR a
      # human pushed to reads `human`.
      shell: bash
      run: |
        cpu="$(awk -F': *' '/^model name/ {print $2; exit}' /proc/cpuinfo 2>/dev/null | tr -c 'A-Za-z0-9._-' '_' | tr -s '_' | sed 's/^_//; s/_$//')"
        suffix="$(printf '%s' "${TURBO_TELEMETRY_JOB_SUFFIX:-}" | tr -c 'A-Za-z0-9._-' '_')"
        case "${GITHUB_ACTOR:-}" in
          'dependabot[bot]') actor=dependabot ;;
          *'[bot]') actor=bot ;;
          '') actor=unknown ;;
          *) actor=human ;;
        esac
        {
          printf 'TURBO_EXPERIMENTAL_OTEL_RESOURCE=service.name=turbo,service.namespace=real-router'
          printf ',ci.job=%s%s' "${GITHUB_JOB}" "${suffix:+-${suffix}}"
          printf ',ci.event=%s' "${GITHUB_EVENT_NAME}"
          printf ',ci.actor=%s' "${actor}"
          printf ',ci.runner=%s' "${RUNNER_ENVIRONMENT:-unknown}"
          printf ',ci.cpu=%s' "${cpu:-unknown}"
          printf ',process.runtime.version=%s\n' "$(node -v)"
        } >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted on purpose: install-args may carry multiple flags that must
      # word-split (e.g. `--frozen-lockfile --ignore-scripts`).
      run: pnpm install $INSTALL_ARGS
