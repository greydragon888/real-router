name: Install osv-scanner
description: The osv-scanner release this file pins, in /usr/local/bin, checked
  against the release's sha256. The binary comes from the Actions cache when an
  entry holds it — `ci-tool-cache.yml` fills the entry on master, which every
  pull request reads — and from the release otherwise. The caller must run
  actions/checkout first.
runs:
  using: composite
  steps:
    # The key hashes this file, which holds the pin: a new pin is a new entry.
    - name: Restore the osv-scanner download
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ci-tools/osv-scanner
        key: osv-scanner-${{ runner.os }}-${{ hashFiles('.github/actions/install-osv-scanner/action.yml') }}

    # lint:audit reads every lockfile with osv-scanner; `scripts/check-deps-audit.sh`
    # refuses a version below its floor. A restored file that does not match the
    # checksum is downloaded again, and a download that does not match it fails
    # the step, so the save below never stores it.
    - name: Install osv-scanner
      shell: bash
      env:
        OSV_SCANNER_VERSION: "2.6.0"
        OSV_SCANNER_SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
      run: |
        DIR="$HOME/.cache/ci-tools/osv-scanner"
        FILE="$DIR/osv-scanner_linux_amd64"
        mkdir -p "$DIR"
        if ! echo "${OSV_SCANNER_SHA256}  ${FILE}" | sha256sum --check --strict --status 2> /dev/null; then
          curl -fsSL --retry 5 -o "$FILE" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
        fi
        echo "${OSV_SCANNER_SHA256}  ${FILE}" | sha256sum --check --strict
        sudo install -m 0755 "$FILE" /usr/local/bin/osv-scanner
        osv-scanner --version

    # After a miss only: an exact hit is the entry already. A pull request's run
    # saves into its own merge ref, which only its later runs read.
    - name: Save the osv-scanner download
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ci-tools/osv-scanner
        key: ${{ steps.cache.outputs.cache-primary-key }}
