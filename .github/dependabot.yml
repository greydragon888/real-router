version: 2
updates:
  # Root workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    # A requirement that already allows the new version stays as it is, and only
    # the lockfile moves; any other is raised, as `increase` does. So a patch of
    # a dependency declared with `~` (syncpack.config.mjs) touches no manifest.
    versioning-strategy: increase-if-necessary
    groups:
      # react + react-dom move in lockstep: React checks at runtime that the two
      # versions are identical. Their peer ranges let `react` move alone
      # (react-dom@X peers `react ^X`, which a newer react satisfies) and stop
      # `react-dom` from moving alone (a newer react-dom peers the newer react,
      # which strictPeerDependencies refuses). Ungrouped, that produced:
      # `react` bumped without `react-dom`, a clean install, and failing React
      # tests — and no `react-dom` PR at all. The exact names outrank the `*`
      # of `patches` and `dev-dependencies`: a dependency joins the most
      # specific group it matches, and the order of this list breaks only a
      # tie (IMPLEMENTATION_NOTES "react and react-dom move as one Dependabot
      # group", "The patches group takes production dependencies only").
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @codspeed/* decides the V8 flags CodSpeed's simulation runs under, so a
      # bump moves every CodSpeed baseline at once. It arrives alone, not inside
      # `dev-dependencies`, where the step would be read as another package's.
      # Pinned to a 6.0.0 prerelease, it is also offered the later 6.0.0
      # prereleases. Listed before `dev-dependencies` for the reason the `react`
      # group gives. (IMPLEMENTATION_NOTES "CodSpeed simulation runs without
      # Maglev".)
      codspeed:
        patterns:
          - "@codspeed/*"
      # The patches of the production dependencies, in one PR a week: the float
      # set gets its patches without a PR per patch. Production only: a dev
      # dependency matches `*` here and in `dev-dependencies` equally, and
      # Dependabot gives such a tie to the group listed first — this one, which
      # takes no minor, so the minor came as a PR of its own. Dev dependencies
      # keep their groups, patches and minors together. (IMPLEMENTATION_NOTES
      # "Dependabot carries the float-set patches" and "The patches group takes
      # production dependencies only".)
      patches:
        dependency-type: "production"
        update-types:
          - "patch"
        patterns:
          - "*"
      # Group all development dependencies
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      # Group ESLint and related packages
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "*eslint*"
      # Group TypeScript related packages
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "tsdown"
      # Group testing libraries
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      # Group Turbo related
      turbo:
        patterns:
          - "turbo"
          - "eslint-config-turbo"
    reviewers:
      - "greydragon888"
    assignees:
      - "greydragon888"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Transitive deps whose OSV/GHSA advisories are already resolved by a pnpm
      # `overrides` entry in pnpm-workspace.yaml (verified clean by `lint:audit` /
      # osv-scanner). Dependabot does NOT apply pnpm overrides during resolution,
      # so it re-resolves these to their natural transitive ceiling (e.g. undici
      # 7.27.2 < fixed 7.28.0), decides it "cannot update X to a non-vulnerable
      # version", and ERRORS THE ENTIRE npm job — producing zero PRs. Repeated
      # errors then auto-halt Dependabot for the whole repo. These are pure
      # transitive deps (no direct import), fully managed via overrides, so
      # Dependabot can never PR them anyway — ignore them here.
      #
      # PATTERN: whenever a transitive-dep advisory is fixed via a pnpm override
      # in pnpm-workspace.yaml, add the dep here too, or Dependabot will re-halt.
      - dependency-name: "piscina" # override: piscina '>=5.2.0 <6.0.0'
      - dependency-name: "js-yaml" # override: read-yaml-file '>=2.1.0' (GHSA-h67p-54hq-rp68)
      # undici is no dependency of the root: danger installs a 7.x of its own
      # (`.pnpmfile.mjs`), and jsdom takes 8.x on its own range. Each
      # parent's range moves its copy; Dependabot would offer 8.x to both.
      - dependency-name: "undici"
      # @types/node is pinned to the Node.js runtime major (Node 24 — `.nvmrc` is
      # the source of truth; see the CLAUDE.md toolchain table). Block semver-major:
      # type defs ahead of the runtime let TS resolve Node APIs that don't exist
      # at runtime (compiles, then fails on Node 24). 24.x patch/minor still flow.
      # Lift this when the project moves to a newer Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript is pinned to the current major (6.x) until the type-tooling
      # ecosystem supports the next one. typescript-eslint and ts-morph lag each
      # TS major (TS 7 is unsupported by them today), so bumping TS ahead of them
      # breaks `pnpm lint` + type-tooling repo-wide — at most a split toolchain is
      # viable. Block the major only; 6.x patch/minor keep flowing. Lift this when
      # typescript-eslint + ts-morph declare support for the next TS major, then
      # bump TS manually.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vite is a direct dev-dep of benchmarks/package.json (the CodSpeed
      # bundles), so Dependabot bumps it INDIVIDUALLY ahead of its ecosystem. On a new MAJOR
      # (vite 8) the whole plugin/test stack still peers `vite >=7.3.5 <8` —
      # vitest@4.1.x + @vitest/mocker, vite-plugin-solid, @sveltejs/vite-plugin-svelte,
      # @analogjs/vite-plugin-angular, @testing-library/svelte,
      # vitefu — so the `pnpm install --lockfile-only` re-resolve fails with
      # ERR_PNPM_PEER_DEP_ISSUES (strictPeerDependencies: true) and ERRORS THE ENTIRE
      # npm job (observed with vite 8.1.3), risking a repo-wide halt.
      # Block the major only; 7.x patch/minor keep flowing. Lift this when vitest
      # peers vite 8, then bump the vite major manually + together across the
      # ecosystem.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # vitest and its two plugins peer each other's exact version, so any one of
      # them bumped alone fails the re-resolve (measured 2026-09-27: vitest 5.0.1
      # beside @vitest/coverage-v8 and @vitest/ui 4.1.11), and the Vitest 5
      # migration is blocked on its own. Majors move by hand, as one.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/ui"
        update-types: ["version-update:semver-major"]
      # babel 8: babel-preset-solid, @rollup/plugin-babel and the babel 7 plugins
      # of the Solid build peer `@babel/core ^7`, and @babel/preset-typescript 8
      # peers `^8` — a major of either fails the re-resolve. Majors move by hand
      # once the Solid chain takes babel 8.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # babel-preset-solid peers `solid-js` at its own version, so its patch
      # installs only once solid-js's has landed: tried in the same run, it
      # fails and fails the run (2026-10-01). So its patch is not proposed, and
      # it may trail solid-js by a patch until a minor/major PR or a hand bump.
      - dependency-name: "babel-preset-solid"
        update-types: ["version-update:semver-patch"]
      # @angular/* — EXACT cross-peer coupling (router@x requires core@x exactly),
      # so ANY single-package bump (patch/minor/major) breaks strictPeerDependencies
      # and can halt the whole npm job (same coupled-peer class as vite above).
      # The framework only moves via a manual, coordinated `pnpm update` across
      # all @angular/* at once; the `~` ranges then absorb the patch.
      # Ignore the namespace entirely (this replaced the `@angular/router` override).
      - dependency-name: "@angular/*"

  # The examples workspace — its own lockfile, so its own block: a single
  # `directory: "/"` sees only what the root pnpm-workspace.yaml includes. The
  # manifests declare @real-router/* as `*`, so the weekly group moves only the
  # releases the lockfile records; someone who copies an example installs the
  # latest release regardless.
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    # A patch inside a `~` range moves the lockfile alone, as in the root entry.
    versioning-strategy: increase-if-necessary
    groups:
      # `@real-router/*` outranks the `*` of the groups below: a dependency
      # joins the most specific group it matches; the order breaks only a tie.
      real-router:
        patterns:
          - "@real-router/*"
      # react + react-dom move in lockstep — the root block has the reason.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The patches of the production dependencies, in one PR a week — the root
      # entry has the reason, and why the dev dependencies stay out.
      patches:
        dependency-type: "production"
        update-types:
          - "patch"
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    reviewers:
      - "greydragon888"
    assignees:
      - "greydragon888"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Transitive deps whose advisories an `overrides` entry in
      # examples/pnpm-workspace.yaml resolves. Dependabot does not apply pnpm
      # overrides, re-resolves them to their natural ceiling and errors the whole
      # job — the root block has the incident.
      - dependency-name: "undici"
      - dependency-name: "piscina"
      - dependency-name: "js-yaml"
      # Held to the Node.js runtime major and to the TypeScript major the lint
      # toolchain supports, as in the root block.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vite is a direct dev-dep of most examples, so Dependabot bumps it ahead
      # of the plugin stack that peers on it; a new MAJOR fails the re-resolve
      # under strictPeerDependencies and errors the whole job. Majors move by hand.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # vitest 5 peers @vitest/* at its own exact version and fails the
      # re-resolve beside their 4.x — the root block has the measurement.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # @angular/* peers each other EXACTLY, so any single-package bump breaks
      # strictPeerDependencies; it moves only by a coordinated `pnpm update`
      # (examples/CLAUDE.md § Workspace).
      - dependency-name: "@angular/*"
      # @angular-devkit/* is released in lockstep with @angular/cli and
      # @angular/build, which the entry above holds back. Bumped alone it gives
      # the tree two devkit generations (22.2.0 beside the 22.1.8 of
      # @angular/build), so it moves with them: the manifests declare it with
      # `~`, and the coordinated update names it beside @angular/*.
      - dependency-name: "@angular-devkit/*"

  # The cross-router bench — its own lockfile, so its own block. A bump here
  # moves the bench's numbers rather than a shipped package, so it comes
  # monthly and in one group. @real-router/* is not updated here: the weekly
  # snapshot installs the latest release before it measures.
  - package-ecosystem: "npm"
    directory: "/cross-router-bench"
    schedule:
      interval: "monthly"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      # react + react-dom move in lockstep — the root block has the reason.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      bench:
        patterns:
          - "*"
    reviewers:
      - "greydragon888"
    assignees:
      - "greydragon888"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      - dependency-name: "@real-router/*"
      # Majors move by hand, as in the root block: the plugin stack peers on
      # vite, and the type tooling lags each TypeScript major.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @angular/* peers each other EXACTLY, so any single-package bump breaks
      # strictPeerDependencies; it moves only by a coordinated `pnpm update`.
      - dependency-name: "@angular/*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # `/` covers `.github/workflows/**` only. A composite action referenced by a
    # RELATIVE path (`uses: ./.github/actions/setup`) is not a dependency edge
    # Dependabot follows, and its own `uses:` pins live outside that scan — so
    # they were never bumped. Proof: the PR "bump actions/setup-node from 6 to
    # 7" updated six workflow files and left `.github/actions/setup/action.yml`
    # on v6; `git log -- .github/actions/` shows no dep bump in the directory's
    # history. That action runs in 11 jobs, i.e. the pins most worth updating
    # were the only ones frozen. Listing its directory explicitly puts it in
    # scope.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "greydragon888"
    assignees:
      - "greydragon888"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "automated"
