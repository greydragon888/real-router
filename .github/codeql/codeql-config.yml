name: "CodeQL Config"

# Paths to exclude from CodeQL analysis
paths-ignore:
  # Test sources may contain intentional security anti-patterns / extreme
  # inputs (unit, property, stress, bench). Convention: everything under a
  # `tests/` folder, plus these suffixes anywhere — both `.ts` and `.tsx`.
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.properties.ts"
  - "**/*.properties.tsx"
  - "**/*.stress.ts"
  - "**/*.stress.tsx"
  - "**/*.bench.ts"
  - "**/*.bench.tsx"

  # Benchmark harness sources (intentional edge cases and extreme inputs)
  - "**/benchmarks/**"

  # Build artifacts and dependencies
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.stryker-tmp/**"

  # Documentation and config
  - "**/*.md"
  - "**/*.json"

# Paths to include (optional - by default all non-excluded paths are included)
paths:
  - "packages/*/src/**"
  # Matches nothing today (every package entry lives under src/) — kept as a
  # forward guard so a root re-export file would not silently fall out of scope.
  - "packages/*/index.ts"

  # shared/* is shipped source that reaches its consumers ONLY through symlinks
  # (packages/{browser,hash,navigation}-plugin/src/browser-env, every adapter's
  # src/dom-utils, packages/{ssr-data,rsc-server}-plugin/src/shared-ssr), and the
  # extractor does not follow symlinked directories — measured on run
  # 30711121982, of 586 extracted files ZERO were under shared/. So each shared
  # dir is listed here by its real path. Same reason sonar-project.properties
  # lists shared/* explicitly (see ci.yml "Compute Sonar scope"). (2026-08-01
  # CI/CD audit §1.4; dom-utils since #2552.)
  - "shared/browser-env/**"
  - "shared/dom-utils/**"
  - "shared/ssr/**"

# Queries to run
queries:
  - uses: security-extended
  - uses: security-and-quality
