packages:
  - "packages/*"
  - "shared"
  - "examples/web/*"
  - "examples/web/*/*"
  - "examples/web/*/*/*" # subgroups (e.g. examples/web/react/animation-examples/)
  - "examples/desktop/*/*"
  - "examples/console/*"
  - "benchmarks"
peerDependencyRules:
  allowedVersions:
    typescript: '6'
overrides:
  '@types/node': $@types/node
  # Bound to <8: vite-plugin-solid (solid adapter) breaks on @babel/core 8 / vite 8
  # (both released 2026-06). The previous open upper bounds let `pnpm dedupe` (the
  # pre-commit hook auto-dedupes) pull 8 and kill the solid bundle. Lift both when
  # vite-plugin-solid supports 8. (vite's bound is tightened at its existing entry.)
  '@babel/core': '>=7.29.6 <8'
  # TEMPORARY (2026-07-11): typescript-eslint UNPUBLISHED 8.63.0 from the registry
  # (latest is 8.62.1 again) after the 07-10 Dependabot bump had already resolved
  # eslint-plugin-import-x's peer to 8.63.0 — every install/dedupe then dies with
  # NO_MATCHING_VERSION on @typescript-eslint/visitor-keys@8.63.0. Pin the trio to
  # the published 8.62.0 (matching the root's exact `typescript-eslint` pin).
  # REMOVE on the next typescript-eslint bump (a re-published >=8.63 makes this pin
  # a stale downgrade that will fight Dependabot).
  '@typescript-eslint/project-service': 8.62.0
  '@typescript-eslint/scope-manager': 8.62.0
  '@typescript-eslint/tsconfig-utils': 8.62.0
  '@typescript-eslint/types': 8.62.0
  '@typescript-eslint/typescript-estree': 8.62.0
  '@typescript-eslint/utils': 8.62.0
  '@typescript-eslint/visitor-keys': 8.62.0
  '@isaacs/brace-expansion': 5.0.1
  axios: '>=1.16.0'
  follow-redirects: '>=1.16.0'
  qs: '>=6.14.2'
  # Force adm-zip past the path-traversal fix (GHSA-xcpc-8h2w-3j85, High). Its only consumer is
  # @sonar/scan (root devDep, NOT shipped), which pins adm-zip EXACTLY at 0.5.17 in both 4.3.8 and
  # the latest 4.4.0 — so an override is the only bump path. Dev-only + trusted-input (the scanner
  # extracts SonarSource's own zip), so 0.6.0's stricter extract can't break it. Drop when a
  # @sonar/scan release moves off 0.5.x. (Override, not an osv-scanner.toml allowlist, so a future
  # regression that drops it re-fails the gate instead of being silently masked.)
  adm-zip: '>=0.6.0'
  rollup: 4.62.0
  minimatch@3: ~3.1.4
  minimatch@9: ~9.0.7
  minimatch@10: ~10.2.3
  ajv@6: ~6.14.0
  ajv@8: ~8.18.0
  underscore: '>=1.13.8'
  http-proxy-agent: 7.0.2
  undici: '>=7.29.0 <8.0.0'
  piscina: '>=5.2.0 <6.0.0'
  flatted: '>=3.4.2'
  path-to-regexp: '>=8.4.0'
  # ReDoS in brace-expansion (GHSA-3jxr-9vmj-r5cp, High). All three major lines are in the tree
  # via assorted dev/tooling deps — pin each to its patched release. EXACT (not '>=') because the
  # '@N' selector value can't be an open range without risking a cross-major jump (a '>=1.1.16' on
  # the @1-selected dep could resolve up to 5.x). Bump each line when its next patch lands.
  #
  # ⚠ A SECOND ReDoS landed on the same package (GHSA-mh99-v99m-4gvg, High, 2026-07) and for a
  # while had a fix on the @5 line only — see the dated note below for how that resolved.
  #
  # ⛔ Collapsing all three onto 5.0.8 is NOT the fix, and this is measured rather than assumed:
  # v1 and v2 both end in `module.exports = expandTop` (the function IS the export), while 5.x's
  # CJS build emits `exports.expand = expand` — a NAMED export with no default. Every consumer of
  # the older lines is `minimatch` (3.1.5 → @1, 5.1.9 and 9.0.9 → @2, 10.2.5 → @5) doing
  # `require('brace-expansion')` and calling the result, so the override would hand it an object
  # and break glob matching across the tooling — which is why each line is pinned separately
  # rather than collapsed onto @5.
  #
  # GHSA-mh99-v99m-4gvg (ReDoS #2, High) used to have no 1.x/2.x fix, so the surviving @1/@2
  # instances were allowlisted in `scripts/osv-scanner.toml` + `codeql.yml`. That changed on
  # 2026-08-01: OSV now answers CLEAN for 1.1.17 and 2.1.3 (both were still affected when this
  # was last checked on 07-30 — a version bump alone proved nothing, so it was re-queried per
  # version before acting). Both lines are pinned to those releases and BOTH allowlist entries
  # are gone, exactly as their own removal condition prescribed.
  #
  # 2026-08-04: a THIRD ReDoS (GHSA-rgw5-rvv9-x895, High) landed on all three lines at once and
  # invalidated yesterday's pins — 1.1.17, 2.1.3 and 5.0.8 are each affected. Unlike ReDoS #2 this
  # one shipped a fix per line on day one (1.1.18 / 2.1.4 / 5.0.9), so all three pins move together
  # and no allowlist is needed. The split-by-major structure above is what made that a three-line
  # edit; keep it.
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  # shell-quote < 1.9.0 (GHSA-395f-4hp3-45gv, High) — dev-only (concurrently → shell-quote), never
  # in a published @real-router/* package. Drop when concurrently pulls >=1.9.0 transitively.
  shell-quote: '>=1.9.0'
  # body-parser < 2.3.0 (GHSA-v422-hmwv-36x6, Low) — example-only (express@5), not shipped. Drop
  # when express pulls >=2.3.0.
  body-parser: '>=2.3.0'
  node-forge: '>=1.4.0'
  picomatch@2: 2.3.2
  picomatch@4: 4.0.4
  yaml@1: 1.10.3
  yaml@2: 2.8.3
  smol-toml: '>=1.6.1'
  defu: '>=6.1.5'
  devalue: '>=5.8.1'
  esbuild: '>=0.28.1'
  vite: '>=7.3.5 <8'
  fast-uri: '>=3.1.5 <4'
  hono: '>=4.12.34'
  # @hono/node-server: GHSA-frvp-7c67-39w9 (Medium) has no v1 fix — the patch is v2-only, so a
  # bounded major bump. Like hono / fast-uri above, it's transitive via the Angular dev/build
  # toolchain (@angular/build SSR dev server; ajv -> fast-uri) in angular examples only — not in
  # any published @real-router/* package. Bump/drop when the toolchain moves off these floors.
  '@hono/node-server': '>=2.0.5 <3'
  ip-address: '>=10.3.1'
  # postcss < 8.5.23 (GHSA-fxqj-rqcc-2cmp, Medium). Eleven parents, every one of them build- or
  # lint-time: vite, @angular/build, ng-packagr, @vue/compiler-sfc, beasties, postcss-scss /
  # -safe-parser / -load-config, eslint-plugin-svelte, svelte-eslint-parser. Not in any published
  # @real-router/* package. Single 8.x line, patch-level fix, so a floor is enough. Drop when the
  # toolchain pulls >=8.5.23 on its own.
  postcss: '>=8.5.23'
  js-cookie: '>=3.0.7'
  tmp: '>=0.2.6'
  fflate: 0.8.2
  read-yaml-file: '>=2.1.0 <3.0.0'
# --- pnpm settings (migrated from .npmrc during the pnpm 11 upgrade) ---
updateNotifier: false
saveExact: true
gitTagVersion: true
loglevel: error
# Strict mode for early peer-deps detection
autoInstallPeers: true
strictPeerDependencies: true
# Security: strict build-script verification (default in pnpm 11; kept explicit)
strictDepBuilds: true
# Auto-cleanup unused catalog entries
cleanupUnusedCatalogs: true
scriptShell: bash
# Supply-chain quarantine opt-out. Every dependency here is dev/build tooling,
# and UI frameworks at the adapters are peerDependencies (installed by the
# consumer) — nothing from these deps ships to users at runtime, so the 24h
# new-version quarantine adds no user-facing protection, while it WOULD block
# Dependabot security PRs (ERR_PNPM_NO_MATURE_MATCHING_VERSION). Protection is
# exact-pinning + deliberate bumps + PR review.
# NB: any explicit minimumReleaseAge auto-enables minimumReleaseAgeStrict; at 0
# the gate is a no-op, but if this is ever raised, also set minimumReleaseAgeStrict.
minimumReleaseAge: 0
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron: true
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
  vue-demi: true
  electron-winstaller: false
patchedDependencies:
  '@changesets/get-github-info@0.8.0': patches/@changesets__get-github-info@0.8.0.patch
