packages:
  - "packages/*"
  - "shared"
  - "benchmarks"
overrides:
  '@types/node': $@types/node
  # Bound to <8 for the SOLID CHAIN ONLY: an open upper bound lets `pnpm dedupe`
  # (the pre-commit hook auto-dedupes) pull @babel/core 8 into a chain that cannot
  # run it. Lift when vite-plugin-solid supports babel 8.
  #
  # ⚠ This entry once also carried a vite bound, on the grounds that
  # vite-plugin-solid broke on vite 8. That half is gone — measured on 2026-09-10,
  # the plugin builds and passes its 480 tests on vite 8.2.2. The babel half below
  # is a SEPARATE axis and still holds.
  #
  # ⚠ Scoped to the consumer rather than global since 2026-09-06. Unscoped, this
  # entry also pinned Stryker: @stryker-mutator/instrumenter 10 declares
  # `@babel/core: ~8.0.0`, got 7.29.7 from here, and every run died inside
  # @babel/generator@8 with `Cannot read properties of undefined (reading 'length')`
  # — a babel-7 core driving a babel-8 generator. The solid chain does not need the
  # global reach: `packages/solid` pins `@babel/core` at an exact 7.29.7, and
  # vite-plugin-solid (`^7.23.3`), babel-preset-solid and @rollup/plugin-babel (peer
  # `^7.0.0`) all declare carets that semver cannot resolve to 8 anyway.
  'vite-plugin-solid>@babel/core': '>=7.29.6 <8'
  # Floor for the axios advisories fixed in 1.16.0 and 1.18.0 — GHSA-35jp-ww65-95wh
  # and GHSA-mmx7-hfxf-jppx among them. Scoped to @codspeed/core, whose `^1.4.0`
  # admits the affected releases: @sonar/scan pins an exact 1.20.0, and an
  # unscoped floor would replace that pin too.
  '@codspeed/core>axios': '>=1.18.0'
  # Floor raised for GHSA-4mjr-xmp4-gh2g + GHSA-x5fp-wj9c-mxmx (both Medium, 6.16.0).
  # Parents are @gitbeaker and typed-rest-client — CI tooling, never a published
  # @real-router/* package. typed-rest-client pins an exact 6.15.1, an affected
  # release, so this floor overrides that pin on purpose.
  qs: '>=6.16.0'
  # Floor raised for GHSA-mw96-cpmx-2vgc (arbitrary file write via path traversal,
  # High, fixed in 4.59.0). Of the installed packages, only ng-packagr depends on
  # rollup (`^4.24.0`, optional); the rest take it as a peer. Scoped to that
  # edge so it does not reach the pin in `packages/solid` — the `vite` entry
  # says what an override does to a direct dependency.
  'ng-packagr>rollup': '>=4.59.0'
  minimatch@9: ~9.0.7
  minimatch@10: ~10.2.3
  ajv@6: ~6.14.0
  # At the version @angular-devkit/core pins exactly (8.20.0); every other
  # parent's range admits it.
  ajv@8: ~8.20.0
  # undici has no entry here. danger 14 declares it both as a dependency and as
  # an optional peer; `.pnpmfile.mjs` drops the peer declaration, so danger
  # installs a 7.x of its own. jsdom 30 takes 8.x on its own range
  # (IMPLEMENTATION_NOTES has the measurements).
  # At the version @angular/build pins exactly; ng-packagr's `^5.0.0` admits it.
  piscina: '>=5.3.2 <6.0.0'
  # ReDoS in brace-expansion (GHSA-3jxr-9vmj-r5cp, High). Two major lines, @2 and @5, are in the tree
  # via assorted dev/tooling deps — pin each to its patched release. EXACT (not '>=') because the
  # '@N' selector value can't be an open range without risking a cross-major jump (a '>=1.1.16' on
  # the @1-selected dep could resolve up to 5.x). Bump each line when its next patch lands.
  #
  # ⚠ A SECOND ReDoS landed on the same package (GHSA-mh99-v99m-4gvg, High, 2026-07) and for a
  # while had a fix on the @5 line only — see the dated note below for how that resolved.
  #
  # ⛔ Collapsing all three onto 5.0.8 is NOT the fix, and this is measured rather than assumed:
  # v1 and v2 both end in `module.exports = expandTop` (the function IS the export), while 5.x's
  # CJS build emits `exports.expand = expand` — a NAMED export with no default. Every consumer of
  # the older lines is `minimatch` doing
  # `require('brace-expansion')` and calling the result, so the override would hand it an object
  # and break glob matching across the tooling — which is why each line is pinned separately
  # rather than collapsed onto @5.
  #
  # GHSA-mh99-v99m-4gvg (ReDoS #2, High) used to have no 1.x/2.x fix, so the surviving @1/@2
  # instances were allowlisted in `scripts/osv-scanner.toml` + `codeql.yml`. That changed on
  # 2026-08-01: OSV now answers CLEAN for 1.1.17 and 2.1.3 (both were still affected when this
  # was last checked on 07-30 — a version bump alone proved nothing, so it was re-queried per
  # version before acting). Both lines are pinned to those releases and BOTH allowlist entries
  # are gone, exactly as their own removal condition prescribed.
  #
  # 2026-08-04: a THIRD ReDoS (GHSA-rgw5-rvv9-x895, High) landed on all three lines at once and
  # invalidated yesterday's pins — 1.1.17, 2.1.3 and 5.0.8 are each affected. Unlike ReDoS #2 this
  # one shipped a fix per line on day one (1.1.18 / 2.1.4 / 5.0.9), so all three pins move together
  # and no allowlist is needed. The split-by-major structure above is what made that a three-line
  # edit; keep it.
  #
  # 2026-09-30: three more (GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, High; GHSA-q2hr-2g5m-vwhr,
  # Medium) affect 1.1.18, 2.1.4 and 5.0.9. The last fix on each line is 1.1.21 / 2.1.7 / 5.0.12,
  # and api.osv.dev answers clean for each of those versions, queried one by one.
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  # shell-quote < 1.9.0 (GHSA-395f-4hp3-45gv, High) — dev-only (launch-editor → shell-quote), never
  # in a published @real-router/* package. Drop when launch-editor pulls >=1.9.0 transitively.
  shell-quote: '>=1.9.0'
  picomatch@2: 2.3.2
  # 4.0.7 is the highest minimum a parent declares (`^4.0.7`: @changesets/config,
  # knip, tsdown) and the version @angular-devkit/core and @angular/build pin
  # exactly; any lower value holds those parents below their range.
  picomatch@4: 4.0.7
  yaml@1: 1.10.3
  # Floor at 5.9.3, where every devalue advisory known on 2026-10-02 is fixed
  # (api.osv.dev answers clean for it). Capped below 6: `svelte`, the only
  # parent, declares `^5.9.2`, and an override outranks a parent's range — the
  # open floor let Dependabot's security PRs propose 6.0.2. `svelte` is a peer of
  # `@real-router/svelte` and is never bundled into it, which leaves the adapter's
  # own tests, the benchmark apps and this audit gate as the exposure.
  devalue: '>=5.9.3 <6.0.0'
  esbuild: '>=0.28.1'
  # @angular/build depends on an exact vite of its own; this collapses that
  # edge onto the exact vite `benchmarks/package.json` pins, so the tree holds
  # one vite. A DEDUPE pin, not a security floor; the ceiling keeps it inside the
  # major @angular/build declares.
  # ⚠ Scoped to that edge, not global. An override that reaches a direct
  # dependency becomes its recorded specifier: a raised pin then installs
  # nothing, with the install green and the lockfile untouched, and
  # `pnpm update --no-save` rewrites the specifier into a lockfile that
  # `install --frozen-lockfile` refuses.
  '@angular/build>vite': '>=8.2.2 <9'
  # Floor for GHSA-hrr3-gc8f-f4qj (Medium), fixed in 3.1.8. Transitive via `ajv`,
  # which declares `^3.0.1`.
  fast-uri: '>=3.1.8 <4'
  # postcss < 8.5.23 (GHSA-fxqj-rqcc-2cmp, Medium). Every parent is build- or lint-time:
  # vite, @angular/build, ng-packagr, @vue/compiler-sfc, beasties, postcss-scss /
  # -safe-parser / -load-config, eslint-plugin-svelte, svelte-eslint-parser. Not in any published
  # @real-router/* package. Single 8.x line, patch-level fix, so a floor is enough. It sits at
  # 8.5.26, the highest minimum a parent declares (vite's `^8.5.26`): an override outranks
  # semver, so a lower floor can keep vite on an older release. Drop when the toolchain pulls
  # >=8.5.23 on its own.
  postcss: '>=8.5.26'
  # fflate < 0.8.3: `unzipSync` can loop forever on a malformed ZIP64 archive
  # (GHSA-px8p-9vwx-vf98, 7.5). `@arethetypeswrong/core` (via its CLI and tsdown)
  # declares `^0.8.3`, but `@vitest/ui` declares `^0.8.2`, a range that admits
  # the affected release; the floor is what excludes it. IMPLEMENTATION_NOTES
  # records how an exact dedupe pin on this line once held the tree below the fix.
  # Root devDeps, build and test tooling, never in a published @real-router/*
  # package, and what they unzip is our own build output rather than untrusted
  # input. Bounded `<0.9` for the reason the @xmldom/xmldom entry states: on a 0.x
  # line the minor IS the major. No 0.9 exists today, so the bound costs nothing.
  fflate: '>=0.8.3 <0.9'
  # js-yaml 4.x — GHSA-5p4m-2wfm-xmqj (High, quadratic CPU in `!!omap`, fixed 4.3.1)
  # and GHSA-2883-xcg3-v3hh (High, 7.5, fixed 4.3.2). Every parent is dev/build
  # tooling that parses OUR OWN yaml (cosmiconfig, for @commitlint/load), never a
  # published @real-router/* package and never untrusted input — but both fixes
  # are same-line patches, so there is no reason to allowlist.
  # Bounded `<5` deliberately: 5.x is a separate major these consumers don't declare, and an
  # open floor would let dedupe jump the whole tree onto it. Drop when the tooling pulls >=4.3.2.
  js-yaml: '>=4.3.2 <5'
# --- pnpm settings (migrated from .npmrc during the pnpm 11 upgrade) ---
updateNotifier: false
saveExact: true
gitTagVersion: true
# ⚠ `ignore` keeps pnpm-lock.yaml ONE YAML document. Under the default
# (`download`) pnpm 12 writes its own binaries as a first document ahead of the
# dependency tree, and GitHub's dependency graph reads only that first document:
# Dependency Review, a required check, and Dependabot
# alerts would then see pnpm and nothing else. Measured with pnpm 12.3.4 and
# 12.4.1: two documents under the default, one under `ignore`.
# The cost: pnpm no longer switches to the version `packageManager` pins, and
# pnpm 11 honours the setting too, so a machine keeps whatever pnpm it has.
# `.husky/pre-commit` refuses a commit when `pnpm --version` differs from the
# pin; CI is unaffected, because `pnpm/action-setup` installs the pinned version.
# Drop it only once GitHub's graph reads the last document, and check that on
# the SBOM (`gh api repos/<owner>/<repo>/dependency-graph/sbom`) after the push.
pmOnFail: ignore
# ⚠ `error`, and `warn` is NOT an improvement — it was tried on 2026-09-07 and
# reverted the same day. pnpm writes `[WARN]` to STDOUT, and this repo parses
# pnpm's stdout as JSON: `scripts/build-matrix.mjs` runs
# `execSync("pnpm exec turbo query affected … --packages")` and hands the result
# straight to `JSON.parse`, so the very first warning line makes the CI job that
# computes the build matrix die with `SyntaxError: Unexpected token 'W'`.
# The cost that was measured before the change — four extra lines on a full
# `turbo run` — was the wrong measurement: it counted the humans reading the
# output and not the MACHINES. What is genuinely lost at `error` is pnpm's own
# deprecation notices (the `$` reference in the `@types/node` override has been
# drawing one since before 11.18, unseen). Read them deliberately instead —
# `pnpm --loglevel=warn install` during a bump — rather than by lowering the
# level for every invocation, including the ones a script is parsing.
loglevel: error
# Strict mode for early peer-deps detection
autoInstallPeers: true
strictPeerDependencies: true
# Security: strict build-script verification (default in pnpm 11; kept explicit)
strictDepBuilds: true
# Auto-cleanup unused catalog entries
cleanupUnusedCatalogs: true
scriptShell: bash
# Supply-chain quarantine opt-out. Every dependency here is dev/build tooling,
# and UI frameworks at the adapters are peerDependencies (installed by the
# consumer) — nothing from these deps ships to users at runtime, so the 24h
# new-version quarantine adds no user-facing protection, while it WOULD block
# Dependabot security PRs (ERR_PNPM_NO_MATURE_MATCHING_VERSION). Protection is
# exact-pinning + deliberate bumps + PR review.
# NB: any explicit minimumReleaseAge auto-enables minimumReleaseAgeStrict; at 0
# the gate is a no-op, but if this is ever raised, also set minimumReleaseAgeStrict.
minimumReleaseAge: 0
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
