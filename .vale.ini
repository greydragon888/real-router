; Vale — prose linting for the Markdown corpus.
;
; ⚑ The `.md` half of the claim surface is READ (by the claim-census ledger) but
; no FORM ratchet reaches it: `comment-historiography-authority` and
; its count table scan `packages/*/src` and `shared/` only. This config is that
; missing half, and nothing else — the source tree keeps its own, better
; calibrated guards.
;
; ⚠ Ignored files never enter: the scan set comes from `git ls-files` in
; `scripts/check-prose.sh`. The tracked trees out of scope by owner decision —
; `.claude/` among them — are the names its `in_corpus` excludes.

StylesPath = vale-styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = RealRouter

; Inline code spans hold identifiers and paths — `two call sites` inside one is
; a symbol name, not a claim.
TokenIgnores = (\x60[^\x60]+\x60)

; ⚠ **No `BlockIgnores` for fenced code, deliberately.** Vale parses Markdown
; and already keeps fenced blocks out; adding `(?s) *(```.*?```)` on top of that
; SWALLOWED prose instead — error count fell 27 → 4 and read as calibration
; until a planted `used to be` in README.md failed to red. Two lessons kept
; here because both cost a wrong conclusion: an ignore pattern is a claim that
; needs its own mutation, and INI has no repeated keys — a second
; `BlockIgnores =` line replaces the first in silence.

; ⚠ IMPLEMENTATION_NOTES.md is the HOME of history, by the rule in
; `.claude/rules/docs.md`: "Never delete historical decisions — they explain why
; it's this way", and ARCHITECTURE.md's present-tense rule is its deliberate
; mirror. Linting it for historiography would enforce the opposite of policy.
[IMPLEMENTATION_NOTES.md]
BasedOnStyles =

; ⚠ ARCHITECTURE.md says what holds now, by the same rule: no issue,
; pull-request or RFC numbers. No other file of the corpus is held to that, so
; `Architecture.RecordNumber` sits in a style of its own that no `BasedOnStyles`
; names: a rule named alone loads from its file, and only where it is named.
; The glob is matched against the path as Vale was given it — `ARCHITECTURE.md`
; is the root file named from the root, `*/ARCHITECTURE.md` any other path,
; since `*` crosses `/`.
[{ARCHITECTURE.md,*/ARCHITECTURE.md}]
Architecture.RecordNumber = YES
