# nginx vhost for the #1745 collector, installed as
# /etc/nginx/conf.d/real-router-otel.conf on the runner host.
#
# Port 80 serves only the ACME challenge for certbot's webroot. Port 443
# proxies exactly one path to the collector on loopback; the collector itself
# rejects a request without the ingest token.
server {
    listen 77.222.38.47:80;
    server_name 77-222-38-47.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-otel;
    }

    location / {
        return 404;
    }
}

server {
    listen 77.222.38.47:443 ssl;
    http2 on;
    server_name 77-222-38-47.sslip.io;

    ssl_certificate /etc/letsencrypt/live/77-222-38-47.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/77-222-38-47.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /v1/metrics {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:4318;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
